<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<title>Line up by ear</title>
<style>
  /* ZyDeck: lining the waveform up with the sound (Settings › Audio › Calibrate). Plain, for reading it right. */
  :root { --bg: #0b0b0b; --text: #ececec; --dim: #8f8f8f; --play: #3ddc84; --c: #ffc23d; --err: #ff5a5f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Roboto", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; gap: 14px; padding: max(16px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  header { display: flex; align-items: center; gap: 12px; }
  header h1 { flex: 1; margin: 0; font-size: 20px; }
  button { font: inherit; color: var(--text); background: #1d1d1d; border: 1px solid #333; border-radius: 12px; min-height: 48px; padding: 0 18px; cursor: pointer; }
  button:active { filter: brightness(1.4); }
  button:disabled { opacity: .4; }
  .msg { margin: 0; color: #cfcfcf; min-height: 2.8em; }
  /* the strip: the test pattern's notes rolling past the cursor where they're drawn (as on the decks) */
  .strip { position: relative; height: 92px; border-radius: 10px; background: #101010; overflow: hidden; border: 1px solid #262626; }
  .strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .strip .cur { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #fff; }
  .pad { flex: 1; min-height: 140px; font-size: 22px; font-weight: 700; border-radius: 18px; touch-action: none; }
  .pad.hit { background: #2a2a2a; }
  .dots { display: flex; gap: 8px; justify-content: center; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #333; }
  .dots i.on { background: var(--play); }
  .acts { display: flex; gap: 10px; }
  .acts button { flex: 1; }
  .yes:not(:disabled) { border-color: var(--play); color: var(--play); }
  @media (orientation: landscape) { body { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto 1fr auto; column-gap: 24px; }
    header, .msg, .strip { grid-column: 1 / -1; } .pad { grid-row: 4 / 6; grid-column: 2; } .dots { grid-column: 1; align-self: end; } .acts { grid-column: 1; } }
</style>
</head>
<body>
<header><h1>Line the waveform up with the sound</h1><button id="close">Close</button></header>
<p class="msg" id="msg">Starting the test pattern…</p>
<div class="strip"><canvas id="cv"></canvas><div class="cur"></div></div>
<button class="pad" id="pad" disabled>Tap on each note</button>
<div class="dots" id="dots"></div>
<div class="acts"><button id="again">Start again</button><button class="yes" id="save" disabled>Save</button></div>
<script>
// A test pattern (the hub's, /api/calibrate) plays on a sampler through Mixxx: the music's own way out (the buffer,
// the output, Bluetooth, the link to this device). A rising C major arpeggio, C E G C, a note a beat at 120 BPM.
// This page follows the sampler's position as the decks do (the hub's time stamps, its latency) and draws the notes
// rolling past the cursor where they're drawn; you tap on the notes you hear, from a low C. Each tap's moment (the
// touch's own time stamp) gives where the drawing was; its distance from the note is how far the drawing runs ahead
// of the sound. The first tap, on a C, is read against the bar (four notes: up to 1.8 s late, unmistakable); the
// rest against the note nearest to where the sound is. The median, added to the hub's offset, lines them up.
const HUB_HOST = new URLSearchParams(location.search).get("hub") || location.host;
const HUB = `${location.protocol}//${HUB_HOST}`;
const api = async path => (await fetch(HUB + path)).json();
const $ = id => document.getElementById(id);
const TAPS = 16, NOTES = ["C", "E", "G", "C"], INK = ["#ff8a3d", "#3ddcff", "#c77dff", "#ffd23d"];
let LAT = 0, pat = null, ws = null, anchor = null, playing = false, dur = 40;
let errs = [], est = null, delta = null;

// the hub's clock onto this page's: the fastest delivery seen lately (as the decks do)
const sync = { samples: [], off: null };
function hubTime(ts, now) {
  sync.samples.push([now, now - ts]);
  while (sync.samples.length > 1 && now - sync.samples[0][0] > 5000) sync.samples.shift();
  sync.off = sync.samples.reduce((m, x) => Math.min(m, x[1]), Infinity);
  return ts + sync.off;
}
// where the drawing is at time t (this page's clock): the position run on at normal speed, LAT earlier
const drawn = t => !anchor ? 0 : anchor.p + (playing ? 1 : 0) * Math.max(-1.2, Math.min((t - anchor.t) / 1000 - LAT, .25));

function connect() {
  ws = new WebSocket(`ws://${HUB_HOST}/ws`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data), now = performance.now();
    if (m.init) { LAT = m.init.lat || 0; return; }
    if (m.t === "lat") { LAT = m.s || 0; return; }
    if (m.t !== "cv" || !pat || !m.k.startsWith(pat.group + ",")) return;
    const key = m.k.slice(pat.group.length + 1);
    if (key === "duration" && m.v > 0) dur = m.v;
    else if (key === "play") playing = m.v > 0;
    else if (key === "playposition") anchor = { p: m.v * dur, t: m.ts != null ? Math.min(now, hubTime(m.ts, now)) : now };
  };
  ws.onopen = () => { if (pat) subscribe(); };
  ws.onclose = () => setTimeout(connect, 1200);
}
const subscribe = () => ws?.readyState === 1 && ws.send(JSON.stringify({ sub: [[pat.group, "playposition", 1], [pat.group, "duration", 0], [pat.group, "play", 0]] }));

async function start() {
  errs = []; est = null; delta = null;
  $("save").disabled = true; $("pad").disabled = true;
  $("dots").innerHTML = "<i></i>".repeat(TAPS);
  $("msg").textContent = "Starting the test pattern…";
  let r;
  try { r = await api("/api/calibrate?on=1"); } catch { r = { ok: false, error: "Couldn't reach Mixxx" }; }
  if (!r.ok) { $("msg").textContent = r.error || "Couldn't start the test pattern"; return; }
  pat = r; anchor = null; dur = r.seconds || 40;
  subscribe();
  $("msg").textContent = `Listen: C E G C, rising, over and over. Tap on every note you hear, starting on a low C (the lowest). ${TAPS} taps.`;
  $("pad").disabled = false;
}

$("pad").addEventListener("pointerdown", e => {
  if (!pat || errs.length >= TAPS || !playing || !anchor) return;
  $("pad").classList.add("hit"); setTimeout(() => $("pad").classList.remove("hit"), 90);
  const pos = drawn(e.timeStamp), BEAT = pat.beat, BAR = BEAT * pat.bar, FIRST = pat.first;
  let err;
  if (est === null) {   // the first: a low C, read against the bar
    err = pos - (FIRST + Math.floor((pos - FIRST + .4 * BEAT) / BAR) * BAR);
  } else {              // the rest: the note nearest to where the sound is
    err = pos - (FIRST + Math.round((pos - est - FIRST) / BEAT) * BEAT);
  }
  errs.push(err);
  const sorted = errs.slice().sort((a, b) => a - b);
  est = sorted[sorted.length >> 1];
  $("dots").children[errs.length - 1].classList.add("on");
  if (errs.length < TAPS) { $("msg").textContent = `${TAPS - errs.length} to go…`; return; }
  const use = errs.slice(2).map(x => x * 1000).sort((a, b) => a - b), med = use[use.length >> 1];
  const spread = use.map(x => Math.abs(x - med)).sort((a, b) => a - b)[use.length >> 1];
  if (spread > 45) { $("msg").textContent = "The taps were too uneven to read: Start again, one tap a note, from a low C."; return; }
  delta = Math.round(med / 5) * 5;
  $("msg").textContent = Math.abs(delta) < 10 ? "Already lined up (within 10 ms)."
    : `The waveform runs ${Math.abs(delta)} ms ${delta > 0 ? "ahead of" : "behind"} the sound. Save to line them up.`;
  $("save").disabled = Math.abs(delta) < 10;
});

$("save").addEventListener("click", async () => {
  try {
    const a = await api("/api/audio");
    const offset = Math.max(-200, Math.min(800, Math.round((a.offsetMs || 0) + delta)));
    await fetch(`${HUB}/api/audio/latency?offset=${offset}`);
    $("msg").textContent = `Saved: the waveform is drawn ${Math.abs(delta)} ms ${delta > 0 ? "later" : "earlier"} now. Start again to check.`;
    $("save").disabled = true;
  } catch { $("msg").textContent = "Couldn't save it"; }
});
$("again").addEventListener("click", start);
const stop = () => { if (pat) { fetch(`${HUB}/api/calibrate?on=0`, { keepalive: true }).catch(() => {}); pat = null; } };
$("close").addEventListener("click", () => { stop(); if (parent !== window) parent.postMessage({ zydek: "close-page" }, "*"); else history.back(); });
addEventListener("pagehide", stop);

// the strip: the notes where they're drawn now (the cursor in the middle, 2 s each side)
function frame() {
  const c = $("cv"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  if (pat && anchor) {
    const pos = drawn(performance.now()), span = 2, px = W / 2 / span;
    g.font = `700 ${Math.round(14 * dpr)}px system-ui, sans-serif`; g.textAlign = "center";
    for (let k = Math.max(0, Math.floor((pos - span - pat.first) / pat.beat)); ; k++) {
      const t = pat.first + k * pat.beat, x = W / 2 + (t - pos) * px;
      if (x > W + 20) break;
      const n = k % 4, h = (.35 + n * .15) * H;   // rising
      g.fillStyle = INK[n];
      g.fillRect(x - 3 * dpr, (H - h) / 2, 6 * dpr, h);
      g.fillText(NOTES[n], x, H - 6 * dpr);
    }
  }
  requestAnimationFrame(frame);
}
connect();
requestAnimationFrame(frame);
start();
</script>
</body>
</html>
