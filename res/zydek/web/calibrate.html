<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<title>Line up by ear</title>
<style>
  /* ZyDeck: lining the waveform up with the sound (Settings › Audio › Calibrate). Plain, for reading it right. */
  :root { --bg: #0b0b0b; --text: #ececec; --dim: #8f8f8f; --play: #3ddc84; --c: #ffc23d; --err: #ff5a5f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Roboto", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; gap: 14px; padding: max(16px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  header { display: flex; align-items: center; gap: 12px; }
  header h1 { flex: 1; margin: 0; font-size: 20px; }
  button { font: inherit; color: var(--text); background: #1d1d1d; border: 1px solid #333; border-radius: 12px; min-height: 48px; padding: 0 18px; cursor: pointer; }
  button:active { filter: brightness(1.4); }
  button:disabled { opacity: .4; }
  .msg { margin: 0; color: #cfcfcf; min-height: 2.8em; }
  /* the strip: the test pattern's waveform (Mixxx's, as on the decks) rolling past the cursor where it's drawn */
  .strip { position: relative; height: 120px; border-radius: 10px; background: #101010; overflow: hidden; border: 1px solid #262626; }
  .strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .strip .cur { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #fff; }
  /* four pads, low to high: C E G C, each in its note's colour */
  /* four bars stacked, high C on top, low C at the bottom */
  .pads { flex: 1; min-height: 200px; display: flex; flex-direction: column-reverse; gap: 8px; }
  .pad { flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 24px; font-weight: 800; border-radius: 18px; touch-action: none; padding: 0;
    color: var(--k); border: 2px solid color-mix(in srgb, var(--k) 70%, #000); background: color-mix(in srgb, var(--k) 14%, #161616); }
  .pad small { font-size: 13px; font-weight: 600; color: #a8a8a8; }
  .pad.hit { background: color-mix(in srgb, var(--k) 45%, #161616); }
  .pad:disabled { opacity: .35; }
  .dots { display: flex; gap: 8px; justify-content: center; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #333; }
  .dots i.on { background: var(--k, var(--play)); }
  .acts { display: flex; gap: 10px; }
  /* watching: each note's start should cross the line as you hear it; nudge the drawing until it does */
  .tune { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tune span { flex: 1 1 200px; color: #cfcfcf; font-variant-numeric: tabular-nums; }
  .tune button { min-width: 64px; }
  .pad.next { box-shadow: 0 0 0 2px var(--k), 0 0 14px color-mix(in srgb, var(--k) 45%, transparent); }
  .acts button { flex: 1; }
  .yes:not(:disabled) { border-color: var(--play); color: var(--play); }
</style>
</head>
<body>
<header><h1 id="title">Line the waveform up with the sound</h1><button id="close">Close</button></header>
<p class="msg" id="msg">Starting the test pattern…</p>
<div class="strip"><canvas id="cv"></canvas><div class="cur"></div></div>
<div class="tune"><span id="off">…</span><button data-d="-50">−50</button><button data-d="-10">−10</button><button data-d="10">+10</button><button data-d="50">+50</button><button id="zero">Reset</button></div>
<div class="pads" id="pads"></div>
<div class="dots" id="dots"></div>
<div class="acts"><button id="again">Start again</button><button class="yes" id="save" disabled>Save</button></div>
<script src="/zydeck-position.js"></script>
<script>
// A test pattern (the hub's, /api/calibrate) plays through Mixxx on the preview deck, in the headphones (the buffer,
// the output, Bluetooth, the link to this device): only you hear it. A rising C major arpeggio, C E G C, a note a beat at 120 BPM.
// This page follows the preview deck's position as the decks do (the hub's time stamps, its latency) and draws the
// pattern's waveform (Mixxx's analysis of it, as the decks get it) rolling past the cursor where it's drawn; you tap on the notes you hear, from a low C. Each tap's moment (the
// touch's own time stamp) gives where the drawing was; its distance from the note is how far the drawing runs ahead
// of the sound. Tapping is playing along, not answering: whichever bar you hit, a tap is the next note of C E G C
// (from a low C), so nothing has to be chosen (choosing which note it was adds a reaction's 300-600 ms, read as
// delay). Each is read against its note in the bar (up to 1.8 s late, unmistakable). The median moves the hub's
// offset. And the check that needs no taps at all: watch each note's start cross the line as you hear it, and nudge
// the drawing (the offset, live) until it does.
const Q = new URLSearchParams(location.search), HUB_HOST = Q.get("hub") || location.host;
// scope: "host", the host's output (the hub's offset, System › Calibrate); "device", this screen on top of it (its
// own offset, Controller › Calibrate: the link, the display), kept by the page that opened this one
const SCOPE = Q.get("scope") === "device" ? "device" : "host";
let VIEW = (+Q.get("view") || 0) / 1000;
const HUB = `${location.protocol}//${HUB_HOST}`;
const api = async path => (await fetch(HUB + path)).json();
const $ = id => document.getElementById(id);
const TAPS = 16, NOTES = ["C", "E", "G", "C"], INK = ["#ff5a4a", "#ffb43d", "#3ddc84", "#3d9bff"];   // low to high
let LAT = 0, pat = null, ws = null, playing = false, dur = 40;
// the pattern's position, kept and drawn by zydeck-position.js, exactly as the decks are
const d = { playing: false, ratio: 1, pos: 0 };
let anchor = null;   // (set once a position has come in)
let wf = null, wfImg = null;   // the pattern's waveform: {rate, n, data} (all, low, mid, high per point), drawn once
let errs = [], est = null, delta = null;

// where the drawing is at time t (this page's clock): the decks' own model, LAT earlier
const lat = () => LAT + (SCOPE === "device" ? VIEW : 0);
const drawn = t => ZydeckPos.posModel(d, t, lat());

function connect() {
  ws = new WebSocket(`ws://${HUB_HOST}/ws`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data), now = performance.now();
    if (m.init) { LAT = m.init.lat || 0; return; }
    if (m.t === "lat") { LAT = m.s || 0; return; }
    if (m.t !== "cv" || !pat || !m.k.startsWith(pat.group + ",")) return;
    const key = m.k.slice(pat.group.length + 1);
    if (key === "duration" && m.v > 0) dur = m.v;
    else if (key === "play") { playing = d.playing = m.v > 0; if (!playing) ZydeckPos.posStop(d, now); }
    else if (key === "playposition") { ZydeckPos.posUpdate(d, m.v * dur, now, m.ts); anchor = true; }
  };
  ws.onopen = () => { if (pat) subscribe(); };
  ws.onclose = () => setTimeout(connect, 1200);
}
const subscribe = () => ws?.readyState === 1 && ws.send(JSON.stringify({ sub: [[pat.group, "playposition", 1], [pat.group, "duration", 0], [pat.group, "play", 0]] }));

async function start() {
  errs = []; est = null; delta = null;
  $("save").disabled = true; pads.forEach(p => p.disabled = true);
  $("dots").innerHTML = "<i></i>".repeat(TAPS);
  $("msg").textContent = "Starting the test pattern…";
  let r;
  try { r = await api("/api/calibrate?on=1"); } catch { r = { ok: false, error: "Couldn't reach Mixxx" }; }
  if (!r.ok) { $("msg").textContent = r.error || "Couldn't start the test pattern"; return; }
  pat = r; anchor = null; dur = r.seconds || 40; delete d.pt;
  subscribe();
  loadWaveform();
  $("msg").textContent = `In your headphones: C E G C, rising, over and over. Watch each note's start cross the white line as you hear it: if it's early or late, nudge it. Or tap along, in time like playing it (any bar; start on a low C): ${TAPS} taps.`;
  nextPad(0);
  pads.forEach(p => p.disabled = false);
}

// the pads: C E G C, low to high
const pads = NOTES.map((n, i) => {
  const b = document.createElement("button");
  b.className = "pad"; b.disabled = true; b.style.setProperty("--k", INK[i]);
  b.innerHTML = `${n}<small>${["low", "", "", "high"][i]}</small>`;
  b.addEventListener("pointerdown", e => tap(e));
  $("pads").appendChild(b);
  return b;
});
// the note a tap is for: the next in order from the first (a low C), whichever bar was hit
const nextPad = n => pads.forEach((p, i) => p.classList.toggle("next", i === n % 4));
function tap(e) {
  if (!pat || errs.length >= TAPS || !playing || !anchor) return;
  const note = errs.length % 4, b = e.currentTarget || pads[note];
  b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 90);
  nextPad(errs.length + 1);
  // that note in the bar: the one that makes the gap fall from 0.4 beat early to the rest of the bar late
  const pos = drawn(e.timeStamp), BEAT = pat.beat, BAR = BEAT * pat.bar, at = pat.first + note * BEAT;
  const err = pos - (at + Math.floor((pos - at + .4 * BEAT) / BAR) * BAR);
  errs.push(err);
  const sorted = errs.slice().sort((a, b) => a - b);
  est = sorted[sorted.length >> 1];
  $("dots").children[errs.length - 1].classList.add("on");
  $("dots").children[errs.length - 1].style.setProperty("--k", INK[note]);
  if (errs.length < TAPS) { $("msg").textContent = `${TAPS - errs.length} to go…`; return; }
  const use = errs.slice(2).map(x => x * 1000).sort((a, b) => a - b), med = use[use.length >> 1];
  const spread = use.map(x => Math.abs(x - med)).sort((a, b) => a - b)[use.length >> 1];
  if (spread > 45) { $("msg").textContent = "The taps were too uneven to read: Start again, tapping along in time, from a low C."; return; }
  delta = Math.round(med / 5) * 5;
  $("msg").textContent = Math.abs(delta) < 10 ? "Already lined up (within 10 ms)."
    : `The waveform runs ${Math.abs(delta)} ms ${delta > 0 ? "ahead of" : "behind"} the sound. Save to line them up.`;
  $("save").disabled = Math.abs(delta) < 10;
}

$("save").addEventListener("click", async () => {
  await setOffset(await current() + delta);
  $("msg").textContent = `Saved: the waveform is drawn ${Math.abs(delta)} ms ${delta > 0 ? "later" : "earlier"} now. Watch the notes cross the line to check, and nudge if needed.`;
  $("save").disabled = true;
});
$("again").addEventListener("click", () => { nextPad(0); start(); });
const sign = ms => `${ms > 0 ? "+" : ""}${ms}`;
async function showOffset(a) {
  try { a = a || await api("/api/audio"); } catch { return; }
  $("off").textContent = SCOPE === "device"
    ? `This screen: ${sign(Math.round(VIEW * 1000))} ms on top of the host's ${a.totalMs} ms`
    : `Drawn ${a.totalMs} ms behind Mixxx (adjusted ${sign(a.offsetMs)} ms)`;
  return a;
}
const current = async () => SCOPE === "device" ? Math.round(VIEW * 1000) : (await showOffset())?.offsetMs ?? 0;
async function setOffset(ms) {
  if (SCOPE === "device") {   // this screen's: the page that opened this keeps it (its deck settings)
    VIEW = Math.max(-400, Math.min(800, Math.round(ms))) / 1000;
    if (parent !== window) parent.postMessage({ zydek: "view-offset", ms: Math.round(VIEW * 1000) }, "*");
    showOffset();
    return;
  }
  try { showOffset(await api(`/api/audio/latency?offset=${Math.max(-200, Math.min(800, Math.round(ms)))}`)); } catch {}
}
document.querySelectorAll(".tune [data-d]").forEach(b => b.addEventListener("click", async () => setOffset(await current() + +b.dataset.d)));
$("zero").addEventListener("click", () => setOffset(0));
showOffset();
$("title").textContent = SCOPE === "device" ? "Line this screen up with the sound" : "Line the host up with its sound";
const stop = () => { if (pat) { fetch(`${HUB}/api/calibrate?on=0`, { keepalive: true }).catch(() => {}); pat = null; } };
$("close").addEventListener("click", () => { stop(); if (parent !== window) parent.postMessage({ zydek: "close-page" }, "*"); else history.back(); });
addEventListener("pagehide", stop);

// Mixxx's waveform of the pattern, once it's loaded and analysed: the same as the decks draw
async function loadWaveform() {
  wf = null; wfImg = null;
  for (let i = 0; i < 40 && pat && !wf; i++) {
    try {
      const st = await api("/api/calibrate?state=1");
      if (st.id) {
        const r = await fetch(`${HUB}/waveform/${st.id}`);
        if (r.ok) {
          const buf = new Uint8Array(await r.arrayBuffer()), dv = new DataView(buf.buffer);
          if (String.fromCharCode(...buf.slice(0, 4)) === "MXWF") { wf = { rate: dv.getFloat32(4, true), n: dv.getUint32(8, true), data: buf.subarray(12) }; return; }
        }
      }
    } catch {}
    await new Promise(res => setTimeout(res, 600));
  }
}
const SPAN = 2;   // seconds each side of the cursor
// the whole pattern drawn once at the strip's scale, as Mixxx's RGB waveform: the loudest low / mid / high in a
// column mix red / green / blue, the height its loudness
function waveImage(W, H) {   // the decks' own columns (zydeck-position.js)
  const pxPerSec = W / 2 / SPAN, cols = Math.ceil(wf.n / wf.rate * pxPerSec), c = document.createElement("canvas");
  c.width = cols; c.height = H;
  ZydeckPos.waveColumns(c.getContext("2d"), wf, 0, cols, H, pxPerSec);
  return { c, pxPerSec, W, H };
}
// the strip: the waveform where it's drawn now (the cursor in the middle, SPAN seconds each side)
function frame() {
  const c = $("cv"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  g.fillStyle = "#2a2a2a"; g.fillRect(0, H / 2 - dpr / 2, W, dpr);   // the axis
  if (pat && anchor && wf) {
    if (!wfImg || wfImg.W !== W || wfImg.H !== H) wfImg = waveImage(W, H);
    const pos = ZydeckPos.posAt(d, performance.now(), lat());   // drawn as the decks draw it
    g.drawImage(wfImg.c, Math.round(W / 2 - pos * wfImg.pxPerSec), 0);
  }
  requestAnimationFrame(frame);
}
connect();
requestAnimationFrame(frame);
start();
</script>
</body>
</html>
