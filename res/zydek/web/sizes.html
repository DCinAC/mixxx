<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Size Test</title>
<style>
  :root { --mm: 5.93px; --bg: #0b0b0b; --text: #e8e8e8; --dim: #777; --acc: #ff8a1e; --hit: #3ddc84; --miss: #ff5a5f; --gap: calc(var(--mm) * 1.4); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--dim); overflow: hidden; touch-action: none;
    font: 600 calc(var(--mm) * 2.1)/1.2 -apple-system, "Roboto", sans-serif; }
  body { display: grid; grid-template-rows: calc(var(--mm) * 12) minmax(0, 1fr); }
  header { display: flex; align-items: center; gap: var(--gap); padding: 0 var(--gap); border-bottom: 1px solid #1d1d1d; }
  button { font: inherit; color: #cfcfcf; background: #1c1c1c; border: 1px solid #333; border-radius: calc(var(--mm) * 1.2);
    height: calc(var(--mm) * 9); padding: 0 calc(var(--mm) * 3); }
  button.on { color: var(--text); border-color: var(--text); background: #2a2a2a; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(var(--mm) * 6); padding: calc(var(--mm) * 3); min-height: 0; }
  .field { display: flex; gap: var(--gap); align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: var(--gap); align-items: center; }
  .col .lbl { color: var(--dim); font-size: calc(var(--mm) * 1.8); min-height: calc(var(--mm) * 3); text-align: center; }
  .t { position: relative; border-radius: calc(var(--mm) * 1.2); background: #1a1a1a; border: 1px solid #2c2c2c; }
  .t.target { background: var(--acc); border-color: var(--acc); }
  .t.flash-hit { background: var(--hit) !important; } .t.flash-miss { background: var(--miss) !important; }
  .dot { position: fixed; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; pointer-events: none; z-index: 5; }
  aside { min-width: 0; overflow: auto; color: var(--text); font-weight: 500; }
  aside p { color: var(--dim); margin: 0 0 calc(var(--mm) * 2); font-size: calc(var(--mm) * 1.9); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: calc(var(--mm) * .8) calc(var(--mm) * 1); border-bottom: 1px solid #222; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  td.good { color: var(--hit); } td.bad { color: var(--miss); }
  .knob { display: flex; flex-direction: column; align-items: center; }
  .knob svg { overflow: visible; }
  .knob .kbg { fill: #222; stroke: #3a3a3a; stroke-width: 1.5; } .knob.held .kbg { stroke: var(--acc); }
  .knob .ktrack { fill: none; stroke: #2e2e2e; stroke-width: 3; stroke-linecap: round; }
  .knob .karc { fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; }
  .knob .kptr { stroke: #eee; stroke-width: 3; stroke-linecap: round; }
  .knob .v { font-size: calc(var(--mm) * 1.8); color: var(--text); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .knob .v.ok { color: var(--hit); } .knob .v.off { color: var(--miss); }
  .ring { position: fixed; border: 1px dashed rgba(255,255,255,.35); border-radius: 50%; pointer-events: none; z-index: 4; display: none; }
  .big { font-size: calc(var(--mm) * 4); color: var(--acc); }
</style>
</head>
<body>
<header>
  <button data-tab="buttons" class="on">Buttons</button><button data-tab="knobs">Knobs</button>
  <span style="margin-left:calc(var(--mm)*2)" id="hint"></span>
  <div class="spacer"></div>
  <span id="modeLbl" style="display:none">Knob gesture</span>
  <button data-mode="spin" style="display:none">Spin</button><button data-mode="drag" style="display:none">Drag (both)</button>
  <button data-mode="dragH" style="display:none">Drag ↔</button><button data-mode="dragV" style="display:none">Drag ↕</button>
  <button id="reset">Reset</button>
  <button id="fs">Exit fullscreen</button>
</header>
<main id="main"></main>
<div class="ring" id="ring"></div>
<script>
// Shares the controller's settings (screen scale, knob gesture) through localStorage.
let S = { pxmm: 5.93, knobMode: "spin" };
try { S = { ...S, ...JSON.parse(localStorage.getItem("ctl-settings") || "{}") }; } catch {}
const saveMode = () => { try { const all = JSON.parse(localStorage.getItem("ctl-settings") || "{}"); all.knobMode = S.knobMode; localStorage.setItem("ctl-settings", JSON.stringify(all)); } catch {} };
document.documentElement.style.setProperty("--mm", S.pxmm + "px");
const mm = n => n * S.pxmm, px2mm = p => p / S.pxmm;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
let tab = "buttons";

let fsPaused = false;   // an explicit exit pauses auto-fullscreen until you press the button again
const enterFs = () => document.documentElement.requestFullscreen({ navigationUI: "hide" })
  .then(() => screen.orientation?.lock?.("landscape").catch(() => {})).catch(() => {});
addEventListener("pointerdown", e => {
  if (e.target.id === "fs" || fsPaused || document.fullscreenElement) return;
  enterFs();
}, true);
const paintFs = () => { document.getElementById("fs").textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen"; };
document.addEventListener("fullscreenchange", paintFs);
document.getElementById("fs").onclick = () => {
  if (document.fullscreenElement) { fsPaused = true; document.exitFullscreen().catch(() => {}); }
  else { fsPaused = false; enterFs(); }
};
paintFs();
addEventListener("contextmenu", e => e.preventDefault());

// =========================================================================================
// Buttons: columns of 5 targets per size, packed with the controller's 1.4 mm gaps
// =========================================================================================
const SIZES = [8, 10, 12, 14, 16, 18, 20];
let stats, targets, current;
function resetButtons() { stats = Object.fromEntries(SIZES.map(s => [s, { n: 0, hit: 0, off: [] }])); }
resetButtons();

function buildButtons() {
  const main = document.getElementById("main"); main.innerHTML = "";
  const field = h("div", "field"); targets = [];
  SIZES.forEach(size => {
    const col = h("div", "col"); col.appendChild(h("div", "lbl", `${size} mm`));
    for (let r = 0; r < 5; r++) {
      const t = h("div", "t"); t.style.width = t.style.height = mm(size) + "px";
      t.dataset.size = size; col.appendChild(t); targets.push(t);
    }
    field.appendChild(col);
  });
  const aside = h("aside", "", `<p>Tap the orange target as quickly and naturally as you would mid-set. Hits count only inside the target. Offset = how far from its centre you landed.</p><table id="tbl"></table>`);
  main.append(field, aside);
  field.addEventListener("pointerdown", onButtonTap);
  next(); renderStats();
}

function next() {
  if (current) current.classList.remove("target");
  let t; do { t = targets[Math.floor(Math.random() * targets.length)]; } while (t === current);
  current = t; current.classList.add("target");
}

function onButtonTap(e) {
  e.preventDefault();
  const r = current.getBoundingClientRect(), size = +current.dataset.size;
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  const off = px2mm(Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)));
  const st = stats[size]; st.n++; if (inside) st.hit++; st.off.push(off);
  const d = h("div", "dot"); d.style.left = e.clientX + "px"; d.style.top = e.clientY + "px"; document.body.appendChild(d);
  setTimeout(() => d.remove(), 600);
  const t = current; t.classList.add(inside ? "flash-hit" : "flash-miss"); setTimeout(() => t.classList.remove("flash-hit", "flash-miss"), 180);
  next(); renderStats();
}

function renderStats() {
  const rows = SIZES.map(s => {
    const st = stats[s], pct = st.n ? Math.round(st.hit / st.n * 100) : null;
    const off = st.off.length ? (st.off.reduce((a, b) => a + b, 0) / st.off.length).toFixed(1) : "–";
    return `<tr><td>${s} mm</td><td>${st.n}</td><td class="${pct === null ? "" : pct >= 95 ? "good" : pct < 85 ? "bad" : ""}">${pct === null ? "–" : pct + " %"}</td><td>${off} mm</td></tr>`;
  }).join("");
  document.getElementById("tbl").innerHTML = `<tr><th>Size</th><th>Taps</th><th>Hit</th><th>Avg offset</th></tr>${rows}`;
}

// =========================================================================================
// Knobs: set each knob to the target value; compare Spin and Drag at several sizes
// =========================================================================================
const KSIZES = [10.5, 12, 13, 14, 16];      // 10.5 mm = the controller's knob today
let goal = 0, kResults = [];
function polar(a, r = 15) { const t = (a - 90) * Math.PI / 180; return [20 + r * Math.cos(t), 20 + r * Math.sin(t)]; }
function arc(a0, a1) {
  if (Math.abs(a1 - a0) < .5) return "";
  const [x0, y0] = polar(Math.min(a0, a1)), [x1, y1] = polar(Math.max(a0, a1));
  return `M${x0} ${y0} A15 15 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} 1 ${x1} ${y1}`;
}
function newGoal() { goal = Math.round((10 + Math.random() * 80) * 10) / 10; document.getElementById("hint").innerHTML = `Set every knob to <span class="big">${goal.toFixed(1)}</span>`; }

// Same as the controller (controller.html), kept in sync by hand.
// Drag (both): distance along the finger's path counts the same in every direction.
// The path's direction is measured over the last 1 mm travelled (by distance, not per touch event, so it doesn't
// depend on speed and the screen's ~0.1 mm jitter can't flip it). Each touch step is projected onto that
// direction instead of adding up step lengths, so jitter cancels out rather than accumulating.
// Moving towards up/right raises the value. Only along the up-left/down-right diagonals, where that's
// ambiguous, the previous direction decides (±20° hysteresis), so the sign can't flicker there.
const AXIS_MM = 1, BORDER = Math.sin(20 * Math.PI / 180);
function strokeDelta(st, ddx, ddy) {
  const t = st.trail, x = st.x, y = st.y;
  t.push([x, y]);
  if (t.length > 200) t.splice(0, t.length - 200);
  for (let i = t.length - 2; i >= 0; i--) {
    const len = Math.hypot(x - t[i][0], y - t[i][1]);
    if (len < mm(AXIS_MM)) continue;
    let ux = (x - t[i][0]) / len, uy = (y - t[i][1]) / len;
    const screen = (ux - uy) / Math.SQRT2, a = st.axis;     // screen > 0: pointing up/right
    const flip = a && Math.abs(screen) < BORDER ? ux * a[0] + uy * a[1] < 0 : screen < 0;
    st.axis = flip ? [-ux, -uy] : [ux, uy];
    t.splice(0, i);
    break;
  }
  if (!st.axis) { st.pend[0] += ddx; st.pend[1] += ddy; return 0; }   // first millimetre: held until the direction is known
  ddx += st.pend[0]; ddy += st.pend[1]; st.pend[0] = st.pend[1] = 0;
  return ddx * st.axis[0] + ddy * st.axis[1];
}

function makeKnob(size) {
  const el = h("div", "knob", `<svg viewBox="0 0 40 40" style="width:${mm(size)}px;height:${mm(size)}px"><path class="ktrack" d="${arc(-135, 135)}"/>` +
    `<circle class="kbg" cx="20" cy="20" r="11"/><path class="karc"/><line class="kptr" x1="20" y1="20" x2="20" y2="11"/></svg><div class="v"></div>`);
  let v = Math.random(), t0 = 0;
  const ring = document.getElementById("ring");
  const paint = () => {
    const a = -135 + v * 270; el.querySelector(".karc").setAttribute("d", arc(-135, a));
    const [x, y] = polar(a, 10.5); const p = el.querySelector(".kptr"); p.setAttribute("x2", x); p.setAttribute("y2", y);
    const val = v * 100, err = Math.abs(val - goal), lab = el.querySelector(".v");
    lab.textContent = val.toFixed(1); lab.className = "v " + (err <= .5 ? "ok" : err > 3 ? "off" : "");
  };
  el.addEventListener("pointerdown", e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("held"); t0 = performance.now();
    const r = el.querySelector("svg").getBoundingClientRect();
    const st = { x: e.clientX, y: e.clientY, cx: r.left + r.width / 2, cy: r.top + r.height / 2, a: null,
      trail: [[e.clientX, e.clientY]], axis: null, pend: [0, 0] };
    const move = ev => {
      if (S.knobMode === "spin") {
        const dx = ev.clientX - st.cx, dy = ev.clientY - st.cy, rad = Math.hypot(dx, dy);
        ring.style.display = "block"; ring.style.left = (st.cx - rad) + "px"; ring.style.top = (st.cy - rad) + "px";
        ring.style.width = ring.style.height = 2 * rad + "px";
        if (rad < mm(3)) { st.a = null; return; }
        const a = Math.atan2(dy, dx);
        if (st.a !== null) { let da = a - st.a; if (da > Math.PI) da -= 2 * Math.PI; else if (da < -Math.PI) da += 2 * Math.PI; v = clamp(v + da / (2 * Math.PI), 0, 1); }
        st.a = a;
      } else {
        const ddx = ev.clientX - st.x, ddy = ev.clientY - st.y; st.x = ev.clientX; st.y = ev.clientY;
        const delta = S.knobMode === "dragH" ? ddx : S.knobMode === "dragV" ? -ddy : strokeDelta(st, ddx, ddy);
        v = clamp(v + delta / mm(40), 0, 1);
      }
      paint();
    };
    const up = () => {
      el.classList.remove("held"); ring.style.display = "none";
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
      kResults.push({ size, mode: S.knobMode, err: Math.abs(v * 100 - goal), secs: (performance.now() - t0) / 1000 });
      renderKnobStats();
    };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  });
  paint();
  return el;
}

function buildKnobs() {
  const main = document.getElementById("main"); main.innerHTML = "";
  // Like the mixer: 5 knobs per column spread over the full height, columns packed side by side.
  const field = h("div", "field"); field.style.height = "100%"; field.style.alignItems = "stretch";
  const cols = KSIZES.map(size => {
    const col = h("div", "col"); col.style.justifyContent = "space-between"; col.style.height = "100%";
    col.appendChild(h("div", "lbl", `${size} mm`));
    for (let r = 0; r < 5; r++) col.appendChild(makeKnob(size));
    field.appendChild(col);
    return { col, size };
  });
  requestAnimationFrame(() => cols.forEach(({ col, size }) => {
    const svgs = [...col.querySelectorAll("svg")].map(s => s.getBoundingClientRect());
    const gap = px2mm(svgs[1].top - svgs[0].bottom);
    col.querySelector(".lbl").innerHTML = `${size} mm<br><span style="color:#555">${gap.toFixed(1)} mm apart</span>`;
  }));
  const aside = h("aside", "", `<p>Turn each knob to the target (green = within 0.5). Each grab is logged: final error and time. Switch Spin/Drag at the top to compare. In Spin, the dashed ring shows your radius: circle wider for finer control.</p><button id="newGoal">New target</button><table id="ktbl" style="margin-top:calc(var(--mm)*2)"></table>`);
  main.append(field, aside);
  document.getElementById("newGoal").onclick = () => { newGoal(); buildKnobs(); };
  renderKnobStats();
}

function renderKnobStats() {
  const tbl = document.getElementById("ktbl"); if (!tbl) return;
  const rows = [];
  for (const mode of ["spin", "drag", "dragH", "dragV"]) for (const size of KSIZES) {
    const r = kResults.filter(x => x.mode === mode && x.size === size);
    if (!r.length) continue;
    const err = r.reduce((a, b) => a + b.err, 0) / r.length, secs = r.reduce((a, b) => a + b.secs, 0) / r.length;
    rows.push(`<tr><td>${mode}</td><td>${size} mm</td><td>${r.length}</td><td class="${err <= .5 ? "good" : err > 3 ? "bad" : ""}">${err.toFixed(1)}</td><td>${secs.toFixed(1)} s</td></tr>`);
  }
  tbl.innerHTML = `<tr><th>Gesture</th><th>Size</th><th>Grabs</th><th>Avg error</th><th>Avg time</th></tr>${rows.join("")}`;
}

// =========================================================================================
function show(t) {
  tab = t;
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  const knobs = t === "knobs";
  ["modeLbl"].forEach(id => document.getElementById(id).style.display = knobs ? "" : "none");
  document.querySelectorAll("[data-mode]").forEach(b => { b.style.display = knobs ? "" : "none"; b.classList.toggle("on", b.dataset.mode === S.knobMode); });
  if (knobs) { newGoal(); buildKnobs(); } else { document.getElementById("hint").textContent = ""; buildButtons(); }
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => show(b.dataset.tab));
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { S.knobMode = b.dataset.mode; saveMode(); show("knobs"); });
document.getElementById("reset").onclick = () => { if (tab === "buttons") { resetButtons(); renderStats(); } else { kResults = []; renderKnobStats(); } };
show("buttons");
</script>
</body>
</html>
