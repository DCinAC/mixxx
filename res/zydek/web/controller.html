// Live: fetch the analysed waveform of the track on a deck. The hub answers 200 with it, 202 while Mixxx is still
// analysing it (as long as that takes: after a restart there can be a queue; a "wf" push says when it's done), 404
// when it's not on a deck. ZyDeck Connect (controller mode) says 404 for both: there, a minute of tries.
async function loadWaveform(d, id) {
  d.wfFor = id; d.wf = null; d.wfVer = (d.wfVer || 0) + 1;
  if (!id) return;
  for (let tries = 0; d.wfFor === id && (!REMOTE.on || tries < 30); tries++) {
    let wait = 2000;
    try {
      const url = assetUrl(`/waveform/${id}`);
      if (!url) return;
      const r = await fetch(REMOTE.on ? url : `${url}?stems=1`);   // the hub's: each stem's level too, when it has stems
      if (!REMOTE.on && r.status === 404 && tries >= 3) return;   // not on a deck (its name can come a moment early)
      if (r.status === 202) wait = 15000;   // (or sooner: the "wf" push)
      if (r.ok && r.status === 200) {
        const buf = new Uint8Array(await r.arrayBuffer());
        const dv = new DataView(buf.buffer), magic = String.fromCharCode(...buf.slice(0, 4));
        if (d.wfFor !== id || (magic !== "MXWF" && magic !== "MXWS")) return;
        d.wf = { rate: dv.getFloat32(4, true), n: dv.getUint32(8, true), data: buf.subarray(12), stride: magic === "MXWS" ? 8 : 4, stems: magic === "MXWS" };
        d.wfVer++;
        return;
      }
    } catch {}
    await untilWf(id, wait);
  }
}

// Simulation: a made-up waveform for the demo decks (kicks on the beat, hats off the beat).
function demoWave(d) {
  const rate = 441, n = Math.ceil(d.dur * rate), data = new Uint8Array(n * 4), beat = 60 / d.bpm;
  let seed = d.n * 9301;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    const t = i / rate, ph = (t / beat) % 1, bar = Math.floor(t / beat / 16) % 4;
    const kick = Math.exp(-ph * 9) * (bar === 3 && ph > .5 ? .3 : 1);
    const hat = Math.exp(-((ph + .5) % 1) * 22) * .7;
    const lo = 40 + 200 * kick, hi = 30 + 160 * hat + 30 * rnd(), mi = 60 + 70 * rnd() + 50 * Math.sin(t * 1.3) ** 2;
    const k = i * 4;
    data[k] = Math.min(255, Math.max(lo, mi, hi) * .9); data[k + 1] = Math.min(255, lo); data[k + 2] = Math.min(255, mi); data[k + 3] = Math.min(255, hi);
  }
  return { rate, n, data };
}
decks.forEach(d => {
  d.wf = demoWave(d); d.wfVer = 1;
  d.beats = Float64Array.from({ length: Math.floor(d.dur * d.bpm / 60) }, (_, i) => i * 60 / d.bpm); d.bar = 0; d.beatsVer = 1;
});

async function remoteStems(d) {
  if (d.rstem?.s === "making" || d.rstem?.s === "loading") return;
  if (d.rstem?.s === "done") return remoteStemsLoad(d);
  const id = d.wfFor;
  if (!REMOTE.http || id == null) { toast("The computer hasn't said which track this is yet"); return; }
  const k = `k=${encodeURIComponent(REMOTE.key || "")}`;
  const set = v => { if (d.wfFor === id) { d.rstem = v; markDirty("deck", d); } };
  set({ s: "making", p: 0 });

    const r = await (await fetch(`${REMOTE.http}/web/stems?id=${id}&${k}`)).json();
    if (!r.job) throw new Error(r.error || "ZyDeck Connect said no");
    for (;;) {
      await new Promise(res => setTimeout(res, 1500));
      const j = await (await fetch(`${REMOTE.http}/web/job?id=${encodeURIComponent(r.job)}&${k}`)).json();
      if (j.state === "done") { set({ s: "done", job: r.job }); toast("Stems ready (in Mixxx's ZyDeck Web crate): pad 5 loads them"); return; }
      if (j.state === "error" || j.ok === false) throw new Error(j.error || "failed");
      set({ s: "making", p: j.progress || 0 });

async function remoteStemsLoad(d) {
  const id = d.wfFor, job = d.rstem.job, k = `k=${encodeURIComponent(REMOTE.key || "")}`;
  const set = v => { if (d.wfFor === id) { d.rstem = v; markDirty("deck", d); } };
  set({ s: "loading", job });
  try {   // (Mixxx ZyDeck loads it, as a phone's "load to deck"; not into a playing deck, unless Mixxx allows that)
    const r = await (await fetch(`${REMOTE.http}/web/load?job=${encodeURIComponent(job)}&target=deck${d.n}&${k}`)).json();
    if (!r.job) throw new Error(r.error || "ZyDeck Connect said no");
    for (;;) {
      await new Promise(res => setTimeout(res, 300));
      const j = await (await fetch(`${REMOTE.http}/web/job?id=${encodeURIComponent(r.job)}&${k}`)).json();
      if (j.state === "error") throw new Error(j.error || "failed");
      if (j.state !== "done") continue;

    toast(`Stems not loaded: ${e.message}`);

  }
}

  if (lat.offsets.length > 100) lat.offsets.shift();
  const off = lat.offsets.reduce((b, x) => x[0] < b[0] ? x : b)[1];
  const up = m.h - off - m.c, down = now - (m.h + m.j - off);
  lat.rtt.push(rtt); lat.up.push(up); lat.down.push(down); lat.js.push(m.j);
  if (!m.m) lat.direct++;
  if (rtt > 40 && lat.spikes.length < 20) lat.spikes.push([Math.round(m.c), +rtt.toFixed(1), +up.toFixed(1), +down.toFixed(1)]);
}
latPing();
const latInput = e => { if (lat.input.length < 500) lat.input.push(performance.now() - e.timeStamp); };
addEventListener("pointerdown", latInput, { capture: true, passive: true });
addEventListener("pointermove", latInput, { capture: true, passive: true });
let latLoopT = performance.now();
setInterval(() => { const now = performance.now(); lat.loopMax = Math.max(lat.loopMax, now - latLoopT - 50); latLoopT = now; }, 50);
setInterval(() => {
  const tele = +S.pingHz > 0 && !document.hidden && sharing();
  if (!prof.on && !tele) return;
  const summary = { ...(prof.on ? { gaps: latStats(lat.gaps), xruns: remoteXruns,
    rttAll: lat.rtt.map(v => +v.toFixed(1)), gapsAll: lat.gaps.map(v => Math.round(v)),   // (the whole set's percentiles)
    via: !REMOTE.on ? "local" : REMOTE.via === "usb" ? "cable" : REMOTE.via, playing: decks.filter(d => d.playing).length, scratching: [0, 1].some(s => deckOf(s).grabbed),
    scr: { fix: S.scrFix !== false, feel: S.scrFeel || "smooth" },
    hidden: document.hidden } : {}), n: lat.rtt.length, rtt: latStats(lat.rtt), up: latStats(lat.up), down: latStats(lat.down),
    js: latStats(lat.js), lost: lat.lost, direct: lat.direct, input: latStats(lat.input), frameMax: Math.round(lat.frameMax),
    loopMax: Math.round(lat.loopMax), bufMax: lat.bufMax, sends: lat.sends, touches: active.size, page: sidePage.join("/"), live,
    spikes: lat.spikes, ...(lat.trace.length ? { strip: lat.trace } : {}) };
  // the session over /ws (every page that pings has it: the phone's deck view has no /ctl), telemetry's log over /ctl
  if (prof.on && mxWs && mxWs.readyState === 1) mxWs.send(JSON.stringify({ prof: summary }));
  if (tele) ctlSend({ type: "latency", ...summary });
  Object.assign(lat, { trace: [], t0: performance.now(), rtt: [], up: [], down: [], js: [], spikes: [], lost: 0, direct: 0, input: [], frameMax: 0, loopMax: 0, bufMax: 0, sends: 0, gaps: [] });
}, 1000);

// Telemetry for the Mac's debug view, 4 times a second, and the latency summaries and debug probes: only once you've
// said yes (askTelemetry, or Settings › Developer › Telemetry). What goes: frame rate, touch counts and timing, the
// decks' position, tempo and controls, and the controls you press; no track names, library or anything personal.
const sharing = () => S.telemetry === true && S.telemetryAsked === true;
function askTelemetry() {
  if (PHONE || S.telemetryAsked || !window.ZydeckMenu?.ask || document.querySelector(".zm-ask")) return;
  ZydeckMenu.ask("Help make ZyDeck better?", [
    "Share performance data with ZyDeck's debug tools when one is connected on your network: frame rate, touch timing and the decks' state (position, tempo, the controls you press).",
    "It has no track names, no library and nothing personal. You can change this in Settings › Developer › Telemetry."], "Share it", "No thanks")
    .then(yes => { S.telemetryAsked = true; S.telemetry = yes; saveSettings(); ZydeckMenu.refresh(); });
}
setTimeout(askTelemetry, 8000);
let moves = 0, lastTele = performance.now(), sentUpTo = 0;
addEventListener("pointermove", () => moves++, true);
setInterval(() => {
  const now = performance.now(), secs = (now - lastTele) / 1000;
  if (!sharing()) { frames = 0; moves = 0; lastTele = now; if (eventLog.length) sentUpTo = eventLog[eventLog.length - 1][0]; return; }
  const events = eventLog.filter(e => e[0] > sentUpTo);
  if (eventLog.length) sentUpTo = eventLog[eventLog.length - 1][0];
  ctlSend({ type: "telemetry", t: Date.now(), fps: Math.round(frames / secs), moves: Math.round(moves / secs),
    touches: active.size, page: sidePage.join("/"), fullscreen: !!document.fullscreenElement, viewport: [innerWidth, innerHeight],
    dpr: devicePixelRatio, decks: [0, 1].map(s => { const d = deckOf(s); return { side: s ? "R" : "L", n: d.n,
      pos: +d.pos.toFixed(3), vel: +(d.vel || 0).toFixed(3), playing: d.playing, grabbed: d.grabbed, coast: !!d.coast,
      scr: d.scr ? { slip: d.scr.slip == null ? null : +d.scr.slip.toFixed(3), sent: +d.scr.sent.toFixed(3), lag: +d.scr.lag.toFixed(3) } : null,
      tempo: +d.tempo.toFixed(2), ol: d.ol, sync: d.syncMode, loop: d.loopOn ? d.loopSize : 0, vol: +d.vol.toFixed(2) }; }), events: events.slice(-60) });
  frames = 0; moves = 0; lastTele = now;
}, 250);

// =====================================================================================================
// Debug probes, started from the Mac (settings.probe = {id, kind, ...}); results go out as telemetry.
//   reload: reload this page · bench: scripted knob + fader drags, timing every frame · trace: record real touches
// =====================================================================================================
let probeSeen;                            // the probe already present when the page loaded is not rerun
function onProbe(p) {
  if (probeSeen === undefined) { probeSeen = p ? p.id : null; return; }
  if (!p || p.id === probeSeen) return;
  probeSeen = p.id;
  if (!sharing()) return;   // (probes are telemetry too)
  if (p.kind === "reload") location.reload();
  else if (p.kind === "bench") runBench(p).catch(err => ctlSend({ type: "telemetry", probe: { kind: "bench", id: p.id, error: String(err) } }));
  else if (p.kind === "trace") armTrace(p);
}

const pct = (a, q) => { if (!a.length) return 0; const b = [...a].sort((x, y) => x - y); return +b[Math.min(b.length - 1, Math.floor(q * b.length))].toFixed(2); };
const stats = a => ({ n: a.length, avg: a.length ? +(a.reduce((x, y) => x + y, 0) / a.length).toFixed(2) : 0, p50: pct(a, .5), p95: pct(a, .95), max: pct(a, 1) });

async function runBench(p) {
  const out = { kind: "bench", id: p.id, live, knobMode: S.knobMode, ua: navigator.userAgent, hz: p.hz || 120 };
  if (sidePage.some(p => p !== "deck")) { sidePage.fill("deck"); build(); await new Promise(r => setTimeout(r, 300)); }
  const realPaint = paintAll, paints = [];
  paintAll = () => { const a = performance.now(); realPaint(); paints.push(performance.now() - a); };
  benchQuiet = true;
  try {
    for (const which of ["knob", "fader"]) {
      const d = deckOf(0), el = which === "knob" ? ui.chans[0].knobs[0] : ui.faders[0];
      const key = which === "knob" ? "gain" : "vol", orig = d[key];
      const r = (which === "knob" ? el : el.querySelector(".cap")).getBoundingClientRect();
      let x = r.left + r.width / 2, y = r.top + r.height / 2, t = 0;
      const ev = type => new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 4242, pointerType: "touch",
        clientX: x, clientY: y, width: 8, height: 8 });
      const frames = [], moves = [], echoes = [];
      paints.length = 0;
      el.dispatchEvent(ev("pointerdown"));
      await new Promise(done => {
        let last = performance.now(); const t0 = last;
        const step = now => {
          frames.push(now - last); last = now;
          // finger: back and forth at ~30 mm/s with 0.1 mm jitter, at the touch screen's sample rate
          const n = Math.round(out.hz / 60);
          for (let i = 0; i < n; i++) {
            t += 1 / out.hz;
            const base = Math.sin(t * Math.PI / 1.5) * mm(20);
            if (which === "knob") { x = r.left + r.width / 2 + base + (Math.random() - .5) * mm(.2); y = r.top + r.height / 2 + (Math.random() - .5) * mm(.2); }
            else { y = r.top + r.height / 2 - base / 2 + (Math.random() - .5) * mm(.2); }
            const a = performance.now(); el.dispatchEvent(ev("pointermove")); moves.push(performance.now() - a);
          }
          // Mixxx echoes each change back ~once a frame; this is what a live drag costs on top of the touch handling
          const a = performance.now();
          applyCv(which === "knob" ? `[Channel${d.n}],pregain` : `[Channel${d.n}],volume`, d[key]);
          echoes.push(performance.now() - a);
          if (now - t0 < (p.ms || 3000)) requestAnimationFrame(step); else done();
        };
        requestAnimationFrame(step);
      });
      el.dispatchEvent(ev("pointerup"));
      d[key] = orig; paintMixer();
      out[which] = { frame: stats(frames.slice(1)), longFrames: frames.filter(f => f > 20).length,
        move: stats(moves), echo: stats(echoes), paintAll: stats(paints) };
      await new Promise(r => setTimeout(r, 300));
    }
  } finally { paintAll = realPaint; benchQuiet = false; }
  ctlSend({ type: "telemetry", probe: out });
}

// Records the next few real drags (any control): every pointermove with its coalesced touch samples.
function armTrace(p) {
  let left = p.count || 4;
  const traces = new Map();
  const onDown = e => {
    if (left <= 0 || !e.isTrusted) return;
    const target = e.target.closest(".knob, .fader, #xf, .strip, .lane, .pad, button");
    traces.set(e.pointerId, { target: target ? target.className || target.id : e.target.tagName, mode: S.knobMode,
      t0: e.timeStamp, down: [e.clientX, e.clientY, e.width, e.height], moves: [] });
  };
  const onMove = e => {
    const tr = traces.get(e.pointerId);
    if (!tr || tr.moves.length > 3000) return;
    const co = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    tr.moves.push([+(e.timeStamp - tr.t0).toFixed(2), +e.clientX.toFixed(2), +e.clientY.toFixed(2),
      co.map(c => [+(c.timeStamp - tr.t0).toFixed(2), +c.clientX.toFixed(2), +c.clientY.toFixed(2)])]);
  };
  const onUp = e => {
    const tr = traces.get(e.pointerId);
    if (!tr) return;
    traces.delete(e.pointerId);
    if (tr.moves.length < 5) return;                      // a tap, not a drag
    left--;
    ctlSend({ type: "telemetry", probe: { kind: "trace", id: p.id, left, ...tr } });
    if (left <= 0) { removeEventListener("pointerdown", onDown, true); removeEventListener("pointermove", onMove, true);
      removeEventListener("pointerup", onUp, true); removeEventListener("pointercancel", onUp, true); }
  };
  addEventListener("pointerdown", onDown, true); addEventListener("pointermove", onMove, true);
  addEventListener("pointerup", onUp, true); addEventListener("pointercancel", onUp, true);
  ctlSend({ type: "telemetry", probe: { kind: "trace-armed", id: p.id, count: left } });
}

if (PHONE) {   // the tablet's screen and debug settings don't apply here
  document.getElementById("rotate").remove();
}
applySettings();
build();
requestAnimationFrame(frame);
addEventListener("resize", () => { layoutEpoch++; requestAnimationFrame(paintAll); });
</script>
</body>
</html>
