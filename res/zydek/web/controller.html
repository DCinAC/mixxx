  :root {
    --mm: 5.93px; --bar: calc(var(--mm) * 20); --knob: calc(var(--mm) * 10.5);
    --kcol: calc(var(--knob) + var(--mm) * 3.5);
    --bg: #0b0b0b; --panel: #121212; --pad: #1a1a1a; --edge: #2c2c2c; --text: #e8e8e8; --dim: #767676;
    --deck12: #ff8a1e; --deck34: #38b6ff; --play: #3ddc84; --cue: #f0a23b; --err: #ff5a5f; --fx: #ff7a45; --roll: #38b6ff; --jump: #a47bff;
    --sodium: #ffad32; --vfd: #78ff9b;
    --gap: calc(var(--mm) * 1.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--dim); overflow: hidden; overscroll-behavior: none;
    touch-action: none; font: 600 calc(var(--mm) * 2.1)/1.15 -apple-system, "Roboto", sans-serif; }

  button { font: inherit; color: #cfcfcf; background: #1c1c1c; border: 1px solid #333; border-radius: calc(var(--mm) * 1.2); padding: 0; }
  button.on { color: var(--text); border-color: var(--text); background: #2a2a2a; }

  /* ---- layout: top-left bar | mixer (full height) | top-right bar, decks under the bars ---- */
  #app { height: 100%; display: grid; padding: var(--gap); gap: var(--gap) calc(var(--gap) * 1.4);
    grid-template-columns: minmax(0, 1fr) calc(var(--mm) * 30 + 2 * var(--kcol)) minmax(0, 1fr);
    grid-template-rows: calc(var(--bar) - var(--gap)) minmax(0, 1fr);
    grid-template-areas: "tl mix tr" "dl mix dr"; }
  #topL { grid-area: tl; } #topR { grid-area: tr; justify-content: flex-end; }
  #mixwrap { grid-area: mix; display: grid; min-height: 0; }
  #dl { grid-area: dl; } #dr { grid-area: dr; }
  #dl, #dr { display: grid; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: var(--gap); min-width: 0; }
  .topbar .tab { height: calc(var(--mm) * 11); width: calc(var(--mm) * 13.5); font-size: calc(var(--mm) * 2.4); }
  .topbar .note { flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: calc(var(--mm) * 1.9); color: #555; }
  #topknobs { margin-left: auto; }
  /* loop controls for the deck on that side, next to the mixer */
  .loopbox { --acc: var(--deck12); display: flex; gap: calc(var(--mm) * 1); flex: none; }
  .loopbox.d34 { --acc: var(--deck34); }
  .loopbox button { height: calc(var(--mm) * 11); width: calc(var(--mm) * 9); font-size: calc(var(--mm) * 2.8); }
  .loopbox .loop { width: calc(var(--mm) * 16); border-color: var(--acc); color: var(--text); font-size: calc(var(--mm) * 3.4); line-height: 1; }
  .loopbox .loop small { display: block; font-size: calc(var(--mm) * 1.6); color: var(--acc); margin-top: 2px; }
  .loopbox .loop.on { background: var(--play); border-color: var(--play); color: #04200e; }
  .loopbox .loop.on small { color: #04200e; }
  .topbar .knob { width: calc(var(--mm) * 14); }
  #gear { width: calc(var(--mm) * 11); height: calc(var(--mm) * 11); font-size: calc(var(--mm) * 4); }
  /* recording the set: red while it records, with its running time */
  /* a button held for a second job (the FX menu): a light fill rises as the hold counts down */
  .holding { position: relative; overflow: hidden; }
  .holding::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 100%; pointer-events: none;
    background: rgba(255,255,255,.22); transform-origin: bottom; animation: holdfill var(--hold, 1s) linear forwards; }
  @keyframes holdfill { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  #rec { height: calc(var(--mm) * 7); padding: 0 calc(var(--mm) * 1.6); font-size: calc(var(--mm) * 1.9); font-weight: 700; flex: none;
    font-variant-numeric: tabular-nums; }
  #rec.on { border-color: #ff3b30; color: #fff; background: #b3261e; }
  #prof { position: fixed; top: calc(var(--mm) * 1.2); left: 50%; transform: translateX(-50%); z-index: 45; display: flex; align-items: center;
    gap: calc(var(--mm) * 1.2); padding: calc(var(--mm) * .6) calc(var(--mm) * .8) calc(var(--mm) * .6) calc(var(--mm) * 1.6);
    border: 1px solid #ff3b30; border-radius: calc(var(--mm) * 4); background: rgba(20, 8, 8, .92); color: #ff6b61;
    font: 700 calc(var(--mm) * 1.9) system-ui, sans-serif; }
  #prof button { height: calc(var(--mm) * 5.5); min-width: calc(var(--mm) * 7); border-radius: calc(var(--mm) * 3); border: 1px solid #ff6b61;
    background: none; color: #fff; font: inherit; }
  #prof .pm { padding: 0 calc(var(--mm) * 1.6); }
  #rec.wait { border-color: #ff3b30; color: #ff6b61; }
  #gear.live { border-color: var(--play); color: var(--play); }   /* connected to Mixxx */

  .side { --acc: var(--deck12); display: grid; gap: var(--gap); min-width: 0; min-height: 0; }
  .side.d34 { --acc: var(--deck34); }
  .side.left { grid-template-columns: calc(var(--mm) * 13) minmax(0, 1fr); }
  .side.right { grid-template-columns: minmax(0, 1fr) calc(var(--mm) * 13); }
  .side.samples { grid-template-columns: minmax(0, 1fr); }
  .deck { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; min-height: 0; }

  .head { height: calc(var(--mm) * 9); flex: none; display: flex; align-items: center; gap: calc(var(--mm) * 1.2); min-width: 0; }
  .switch { height: 100%; min-width: calc(var(--mm) * 15); display: flex; align-items: center; justify-content: center; gap: calc(var(--mm) * .8);
    border-color: var(--acc); color: var(--acc); font-size: calc(var(--mm) * 3.4); }
  .switch small { font-size: calc(var(--mm) * 1.8); color: var(--dim); }
  /* tablet: both decks named in their own colours, in fixed places; the one on this side bright */
  .switch.pair { flex-direction: row; align-items: center; justify-content: center; gap: calc(var(--mm) * .6);
    white-space: nowrap; line-height: 1; font-size: calc(var(--mm) * 3.6); }
  .switch.pair em { font-style: normal; font-size: 1em; color: var(--text); font-weight: 800; }
  .switch.pair i { font-style: normal; font-size: .7em; color: var(--dim); }
  .switch.pair span { font-size: calc(1em - 2pt); font-weight: 400; opacity: .3; }
  .switch.pair span.on { font-size: 1em; opacity: 1; font-weight: 800; }
  .switch.pair .k12 { color: var(--deck12); }
  .switch.pair .k34 { color: var(--deck34); }
  .title { flex: 1; min-width: 0; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: calc(var(--mm) * 2.3); }
  .title small { color: var(--dim); font-weight: 500; margin-left: calc(var(--mm) * .8); }
  .num { font-variant-numeric: tabular-nums; color: var(--text); font-size: calc(var(--mm) * 2.3); }
  .num.dim { color: var(--dim); }

  /* platter strip: the record unrolled; the cursor is the sticker */
  .strip { flex: 0 0 calc(var(--mm) * 22); position: relative; overflow: hidden; border-radius: calc(var(--mm) * 1.5);
    border: 1px solid #3a3a3a; background:
      repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), #2e2e2e calc(25% - 1px) 25%),
      repeating-linear-gradient(90deg, transparent 0 calc(6.25% - 1px), #1f1f1f calc(6.25% - 1px) 6.25%), #121212; }
  .strip.held { border-color: var(--acc); background-color: #181818; }
  /* the track end warning light (Settings › Screen): a playing track's last 30 s, the strip flashes pink, as Mixxx's
     overview does: once a second, lit for 70 % of it (the time left is inside it, so it doesn't blink as well); its own
     layer's opacity, so nothing is drawn again */
  .endwarn { position: absolute; inset: 0; pointer-events: none; opacity: 0; will-change: opacity; z-index: 3;
    background: rgba(255, 70, 165, .26); box-shadow: inset 0 0 0 2px rgba(255, 95, 175, .9); }
  .ending .endwarn { animation: endwarn 1s step-end infinite; }
  @keyframes endwarn { 0% { opacity: 1; } 70%, 100% { opacity: 0; } }
  .strip .cursor { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--acc); left: 50% !important;
    box-shadow: 0 0 calc(var(--mm) * 1.2) var(--acc); will-change: transform; left: 0; }
  /* waveform of the stretch of record the strip shows (Mixxx's analysis: red lows, green mids, blue highs) */
  /* the waveform's layer: tiles drawn once, slid (and squeezed for tempo) by the compositor, never redrawn per frame */
  .strip .axis { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,.28); pointer-events: none; }
  .strip .wftrack { position: absolute; left: 0; top: 0; width: 0; height: 100%; transform-origin: 0 0; will-change: transform; pointer-events: none; }
  .strip .wftrack .tiles canvas { position: absolute; top: 0; height: 100%; }
  /* Live render: the wave in its own layers (one per stem), scaled for the gain and each stem's mute without drawing */

  /* SLIP, as Mixxx draws it: while the track runs on underneath (a loop, a scratch, CENSOR), the top half shows

  /* the knobs and keys */

  .pfx-foot .knob { --knob: calc(var(--zmm) * 17); width: calc(var(--zmm) * 21); flex: none; }
  .pfx-foot .knob span { font-size: calc(var(--zmm) * 2.3); letter-spacing: .06em; font-weight: 700; white-space: nowrap; }
  .pfx-foot .pfx-sp { flex: 1; }
  .pfx-foot .zk { padding: 0 calc(var(--zmm) * 2.4); }
  .padopts button small { display: block; font-size: calc(var(--mm) * 1.4); opacity: .8; margin-top: calc(var(--mm) * .3); }
  .padopts .clear { color: var(--err); }
  .cuecols { display: grid; grid-template-columns: repeat(8, 1fr); gap: calc(var(--mm) * .6); height: auto !important; }
  .cuecols button { height: calc(var(--mm) * 6) !important; background: var(--sw) !important; border-color: transparent; }
  .cuecols button.on { outline: calc(var(--mm) * .35) solid var(--text); outline-offset: calc(var(--mm) * .2); }
  .pad .n { position: absolute; left: calc(var(--mm) * 1); top: calc(var(--mm) * .8); font-size: calc(var(--mm) * 1.6); opacity: .6; }
  .pad.lit { background: var(--c); border-color: var(--c); color: var(--fg, #111); }
  .pad.tint { background: color-mix(in srgb, var(--c) 15%, var(--pad)); border-color: color-mix(in srgb, var(--c) 45%, var(--edge)); color: color-mix(in srgb, var(--c) 80%, #ddd); }
  .pad.off { opacity: .3; }
  .pad.armed { outline: 3px dashed var(--cue); outline-offset: -5px; }
  .pad .lp { position: absolute; top: 3px; right: 5px; font-style: normal; font-size: calc(var(--mm) * 1.7); font-weight: 700; opacity: .9; }
  .pad.loopon::after { content: ""; position: absolute; inset: 4px; border: 2px solid var(--fg, #111); border-radius: calc(var(--mm) * 1); pointer-events: none; }
  .pad.down { background: #fff !important; border-color: #fff !important; color: #111 !important; transform: scale(.97); }

  /* tempo: a touchpad lane, no jump */
  .tempo { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  .ol { flex: 0 0 calc(var(--mm) * 9); font-size: calc(var(--mm) * 1.7); }
  .ol.on { background: var(--err); border-color: var(--err); color: #fff; }
  .lane { flex: 1; position: relative; border-radius: calc(var(--mm) * 1.5); border: 1px solid #333; background:
      repeating-linear-gradient(0deg, transparent 0 calc(var(--tick) - 1px), #262626 calc(var(--tick) - 1px) var(--tick)), #121212;
    --tick: 6.25%; overflow: hidden; }
  .lane.held { border-color: var(--acc); }
  .lane.locked { opacity: .45; }
  .lane .lock { position: absolute; left: 0; right: 0; top: 50%; margin-top: calc(var(--mm) * 2); text-align: center;
    font-size: calc(var(--mm) * 1.5); color: var(--acc); letter-spacing: .05em; }
  .lane .zero { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #4a4a4a; }
  .lane .mark { position: absolute; left: 12%; right: 12%; height: calc(var(--mm) * 2.2); margin-top: calc(var(--mm) * -1.1); top: 50%;
    border-radius: 3px; background: var(--acc); will-change: top; }
  .lane .end { position: absolute; left: 0; right: 0; text-align: center; font-size: calc(var(--mm) * 1.5); color: #555; }
  .lane .end.t { top: calc(var(--mm) * .6); } .lane .end.b { bottom: calc(var(--mm) * .6); }
  .tread { flex: 0 0 calc(var(--mm) * 6); text-align: center; color: var(--text); font-size: calc(var(--mm) * 1.9); font-variant-numeric: tabular-nums; }
  .tread.over { color: var(--err); }

  /* ---- strips on top (S.layout "stacked"): both platter strips across the top, as Mixxx stacks its
     waveforms, and the top-bar controls in the side columns. 3 mm of screen stay above the top strip, so a
     finger sliding off its top edge is still on the glass (and lifting there counts as off the strip). ---- */
  #stack { display: none; }
  #app.stacked { grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top top" "dl mix dr"; }
  #app.stacked #topL, #app.stacked #topR { display: none; }
  #app.stacked #stack { grid-area: top; display: grid; column-gap: var(--gap);
    grid-template-columns: calc(var(--mm) * 40) minmax(0, 1fr) calc(var(--mm) * 40);
    grid-template-rows: calc(var(--mm) * 7) calc(var(--mm) * 19) var(--gap) calc(var(--mm) * 19) calc(var(--mm) * 7);
    grid-template-areas: "sl n0 sr" "sl s0 sr" "sl . sr" "sl s1 sr" "sl n1 sr"; }
  #sideL { grid-area: sl; } #sideR { grid-area: sr; } #strip0 { grid-area: s0; } #strip1 { grid-area: s1; }
  /* ---- the waveform panel (S.panel, strips on top): Serato's three strips. "d" back to back: deck 1's strip grows
     upwards and deck 2's downwards from the beat strip between them, each deck's whole-track overview in a row of its
     own; "b1" the overviews behind the nudge bars' words; "b2" faintly over the platter strips; "classic" as before.
     The nudge bars stay as they are in all of them. ---- */
  #beatstrip, #ovw0, #ovw1 { display: none; min-width: 0; min-height: 0; position: relative; pointer-events: none; }
  #beatstrip canvas, #ovw0 canvas, #ovw1 canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* they scratch too (each deck's half of the panel is its platter, as tall as the strip was): the beat strip, and the
     overviews' own rows (back to back); the cue tabs reaching into the nudge bars don't take touches */
  #app.stacked:is(.panel-d, .panel-b1, .panel-b2) #beatstrip, #app.stacked.panel-d :is(#ovw0, #ovw1) { pointer-events: auto; touch-action: none; }
  #app.stacked.panel-d #stack { grid-template-rows: calc(var(--mm) * 7) calc(var(--mm) * 3.5) calc(var(--mm) * 13.5) calc(var(--mm) * 8)
    calc(var(--mm) * 13.5) calc(var(--mm) * 3.5) calc(var(--mm) * 7);
    grid-template-areas: "sl n0 sr" "sl o0 sr" "sl s0 sr" "sl bs sr" "sl s1 sr" "sl o1 sr" "sl n1 sr"; }
  #app.stacked.panel-b1 #stack, #app.stacked.panel-b2 #stack { grid-template-rows: calc(var(--mm) * 7) calc(var(--mm) * 15.5) calc(var(--mm) * 8)
    calc(var(--mm) * 15.5) calc(var(--mm) * 7); grid-template-areas: "sl n0 sr" "sl s0 sr" "sl bs sr" "sl s1 sr" "sl n1 sr"; }
  #app.stacked:is(.panel-d, .panel-b1, .panel-b2) #beatstrip { display: block; grid-area: bs; background: #050607; border-left: 1px solid #222; border-right: 1px solid #222; }
  #app.stacked:is(.panel-d, .panel-b1, .panel-b2) :is(#ovw0, #ovw1) { display: block; }
  #app.stacked.panel-d #ovw0 { grid-area: o0; background: #07080a; } #app.stacked.panel-d #ovw1 { grid-area: o1; background: #07080a; }
  /* its hot cues' tabs reach 1.8 mm into the nudge bar beside it (only drawn there: the bar works as ever) */
  #app.stacked.panel-d #ovw0 canvas { top: calc(var(--mm) * -1.8); height: calc(100% + var(--mm) * 1.8); }
  #app.stacked.panel-d #ovw1 canvas { height: calc(100% + var(--mm) * 1.8); }
  #app.stacked.panel-d :is(#ovw0, #ovw1) { z-index: 3; }
  /* b1: over the nudge bar, added to it (screen: it only lights, never dims the words) */
  #app.stacked.panel-b1 #ovw0 { grid-area: n0; z-index: 2; mix-blend-mode: screen; opacity: .5; }
  #app.stacked.panel-b1 #ovw1 { grid-area: n1; z-index: 2; mix-blend-mode: screen; opacity: .5; }
  /* b2: over the platter strip, as faint light: the waveform under it keeps all its brightness */
  #app.stacked.panel-b2 #ovw0 { grid-area: s0; z-index: 2; mix-blend-mode: screen; opacity: .3; }
  #app.stacked.panel-b2 #ovw1 { grid-area: s1; z-index: 2; mix-blend-mode: screen; opacity: .3; }
  /* d: each half waveform grows from the beat strip's side, its gain and EQ scaling it from there */
  #app.stacked.panel-d #strip0 :is(.wl, .sl, .bl) { transform-origin: 50% 100%; }
  #app.stacked.panel-d #strip1 :is(.wl, .sl, .bl) { transform-origin: 50% 0; }
  /* nothing at a waveform's base (by the beat strip), where its quiet parts are: no centre line there, deck 1's text
     at its top, deck 2's at its bottom (the section colour bar: each strip's outer edge too, renderTile) */
  #app.stacked.panel-d .strip .axis { display: none; }
  #app.stacked.panel-d #strip0 .strip .foot { bottom: auto; top: calc(var(--mm) * 3.4); }
  #app.stacked.panel-d #strip1 .strip .info { top: auto; bottom: calc(var(--mm) * .5); }
  #app.stacked.panel-d #strip1 .strip .barsleft { top: auto; bottom: calc(var(--mm) * .4); }
  #app.stacked.panel-d #strip1 .strip .foot { bottom: calc(var(--mm) * 3.4); }
  /* deck 1's hot cue tags at its top edge, where its upward waveform is thinnest (below while it slips: the slip
     ghost has the top half then) */
  #app.stacked.panel-d #strip0 .strip .cm b { top: 0; bottom: auto; }
  #app.stacked.panel-d #strip0 .strip.slipping > .wftrack .cm b { top: auto; bottom: 0; }
  #app.stacked:is(.panel-d, .panel-b1, .panel-b2) #strip0 .strip { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  #app.stacked:is(.panel-d, .panel-b1, .panel-b2) #strip1 .strip { border-top-left-radius: 0; border-top-right-radius: 0; }
  #nudge0 { grid-area: n0; } #nudge1 { grid-area: n1; }
  #nudge0, #nudge1 { display: grid; min-width: 0; }
  /* nudge bar on the outer edge of each strip, like a jog wheel's edge: drag it to bend the tempo */
  .nudge { --acc: var(--deck12); position: relative; overflow: hidden; border: 1px solid #333; background-color: #0f0f0f;
    background-image: repeating-linear-gradient(90deg, #2c2c2c 0 1px, transparent 1px calc(var(--mm) * 2));
    background-position: var(--off, 0px) 0; display: flex; align-items: center; justify-content: center;
    color: #4a4a4a; font-size: calc(var(--mm) * 1.6); letter-spacing: .08em; white-space: nowrap; }
  .nudge.d34, .strip.d34 { --acc: var(--deck34); }
  #nudge0 .nudge { border-radius: calc(var(--mm) * 1.5) calc(var(--mm) * 1.5) 0 0; border-bottom-color: #222; }
  #nudge1 .nudge { border-radius: 0 0 calc(var(--mm) * 1.5) calc(var(--mm) * 1.5); border-top-color: #222; }
  #strip0 .strip { border-top-left-radius: 0; border-top-right-radius: 0; }
  #strip1 .strip { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .nudge.held { border-color: var(--acc); color: var(--acc); }
  .nudge.loopmove { color: var(--play); }
  .flags { --acc: var(--deck12); display: flex; gap: calc(var(--mm) * 1); flex: 1; }
  .flags.d34 { --acc: var(--deck34); }
  .flags button { flex: 1; height: calc(var(--mm) * 7.5); font-size: calc(var(--mm) * 1.7); letter-spacing: .03em; }
  .flags button.on { border-color: var(--acc); color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, #1c1c1c); }
  .loopbox button small { display: block; font-size: calc(var(--mm) * 1.3); color: var(--dim); }
  .loopbox button.adj { background: var(--play); border-color: var(--play); color: #04200e; }
  .loopbox button.adj small { color: #04200e; }
  #sideL, #sideR { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  #sideR .topbar { justify-content: flex-end; }
  #strip0, #strip1 { display: grid; min-width: 0; min-height: 0; }
  #app.stacked .topbar .tab { width: calc(var(--mm) * 12); height: calc(var(--mm) * 10.5); font-size: calc(var(--mm) * 2.2); }
  #app.stacked #gear { width: calc(var(--mm) * 10); height: calc(var(--mm) * 10.5); flex: none; }
  /* both side columns: the same rows at the same heights, so the SAMPLES buttons (and the rest) line up */
  #sideL > .topbar:first-child, #sideR > .topbar:first-child { height: calc(var(--mm) * 13); flex: none; }
  #app.stacked .loopbox button { height: calc(var(--mm) * 10.5); }
  #app.stacked .topbar .knob { width: calc(var(--mm) * 12); }
  #app.stacked .topbar .switch { height: calc(var(--mm) * 10.5); flex: 1; }
  #app.stacked .topbar .switch.narrow { flex: 0 0 calc(var(--mm) * 15); min-width: 0; }
  #app .switch.pair.narrow { font-size: calc(var(--mm) * 2.5); gap: calc(var(--mm) * .35); }   /* "Deck 1⇆3" in 15 mm */
  .smpbtn { flex: 1; height: calc(var(--mm) * 9); line-height: 1.05; font-size: calc(var(--mm) * 2); letter-spacing: .04em; }
  .smpbtn i { font-style: normal; font-weight: 400; }
  .smpbtn small { display: block; font-size: calc(var(--mm) * 1.4); font-weight: 500; color: var(--dim); margin-top: 1px; }
  .smpbtn .dimmed { opacity: .4; }
  .pad .dimmed { opacity: .3; }   /* a LOOP/ROLL arrow at the end of the lengths */
  .smpbtn small.lit { color: var(--text); }
  .smpbtn.on { border-color: var(--play); color: var(--play); background: color-mix(in srgb, var(--play) 14%, #1c1c1c); }
  .smpbtn.on small.lit { color: var(--play); }
  #app:not(.stacked) .smpbtn { flex: 0 0 auto; height: calc(var(--mm) * 11); padding: 0 calc(var(--mm) * 2); }
  .topbar .sshift { flex: 1; height: calc(var(--mm) * 10.5); font-size: calc(var(--mm) * 2.2); }
  .sshift.on { background: var(--err); border-color: var(--err); color: #fff; }
  #app.stacked .side.left { grid-template-columns: calc(var(--mm) * 13) minmax(0, 1fr); }
  #app.stacked .side.samples { grid-template-columns: minmax(0, 1fr); }   /* the sampler page: just its 16 pads */
  /* shorter mixer: the EQ columns run the full height, the crossfader sits under the two channel faders */
  #app.stacked #mixer > :nth-child(1) { grid-area: 1 / 1 / 3 / 2; }
  #app.stacked #mixer > :nth-child(2) { grid-area: 1 / 2 / 2 / 3; }
  #app.stacked #mixer > :nth-child(3) { grid-area: 1 / 3 / 2 / 4; }
  #app.stacked #mixer > :nth-child(4) { grid-area: 1 / 4 / 3 / 5; }
  #app.stacked #xf { grid-area: 2 / 2 / 3 / 4; }
  #app.stacked #xf .rail { left: calc(var(--mm) * 3); right: calc(var(--mm) * 3); }
  .strip .info { position: absolute; left: calc(var(--mm) * 1.2); right: calc(var(--mm) * 1.2); top: calc(var(--mm) * .5);
    display: flex; gap: calc(var(--mm) * 1.5); align-items: baseline; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .strip .info .title { font-size: calc(var(--mm) * 2); pointer-events: auto; margin-right: calc(50% + var(--mm) * 17); }   /* held (paused): unload. Ends before the bars left */
  .strip .info .num { font-size: calc(var(--mm) * 2); }
  .num.keynum { color: var(--dim); } .num.keynum.shifted { color: var(--acc); }   /* lit: shifted from the track's own key */
  /* the key's colour bar (as Mixxx's): the key you hear, and as it drifts off it (tempo without key lock) the key a
     semitone that way creeping in, top for up, bottom for down: all one colour is in tune */
  .num.keynum .kbar { display: inline-block; width: calc(var(--mm) * .7); height: .95em; margin-right: .35em; vertical-align: -.1em;
    border-radius: 1px; background: linear-gradient(var(--kt) 0 var(--ks), var(--kb) var(--ks) 100%); }
  .num.keynum .kbar[hidden] { display: none; }

  /* ---- mixer ---- */
  #mixer { display: grid; grid-template-columns: var(--kcol) minmax(0, 1fr) minmax(0, 1fr) var(--kcol);
    grid-template-rows: minmax(0, 1fr) calc(var(--mm) * 15); gap: var(--gap); padding: var(--gap); border-radius: calc(var(--mm) * 2);
    background: var(--panel); border: 1px solid #222; min-height: 0; }
  .chan { --acc: var(--deck12); display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-height: 0; }
  .chan.d34 { --acc: var(--deck34); }
  .chan .pfl { width: 100%; flex: 0 0 calc(var(--mm) * 9); font-size: calc(var(--mm) * 2); }
  .chan .pfl.on { background: var(--cue); border-color: var(--cue); color: #1b1206; }
  .fader.muted .cap { background: var(--err); border-color: var(--err); }
  .knob { --acc: inherit; display: flex; flex-direction: column; align-items: center; width: 100%; touch-action: none; }
  .knob svg { width: var(--knob); height: var(--knob); overflow: visible; }
  .topbar .knob svg { width: calc(var(--mm) * 10.5); height: calc(var(--mm) * 10.5); }   /* top bar knobs stay fixed */
  .knob .kbg { fill: #222; stroke: #3a3a3a; stroke-width: 1.5; }
  .knob .ktrack { fill: none; stroke: #2e2e2e; stroke-width: 3; stroke-linecap: round; }
  .knob .karc { fill: none; stroke: var(--acc, var(--text)); stroke-width: 3; stroke-linecap: round; }
  .knob.centred .ktrack { stroke: color-mix(in srgb, var(--acc, var(--text)) 55%, #2e2e2e); }   /* on its centre: the ring lit */
  body.kc-dark .knob.centred .ktrack { stroke: #161616; }                                           /* (Look › Knob at centre: dark) */
  .knob .kptr { stroke: #eee; stroke-width: 3; stroke-linecap: round; }
  .knob span { font-size: calc(var(--mm) * 1.55); color: var(--dim); margin-top: calc(var(--mm) * .3); }
  .knob.held .kbg { stroke: var(--acc, var(--text)); }
  /* protractor shown around a knob while spinning it: ring at the finger's radius, 15° ticks, ray to the finger */
  .protractor { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 8; overflow: visible; }
  .protractor .ring { fill: none; stroke: rgba(255,255,255,.4); stroke-width: 1.2; stroke-dasharray: 4 5; }
  .protractor .comet { stroke-width: 2.6; stroke-linecap: round; }
  .protractor .ray { stroke: var(--acc, #fff); stroke-width: 1.5; opacity: .75; }
  .protractor .ray.dead { opacity: .2; }
  .topbar .knob { --acc: #ddd; }

  .fader { --acc: var(--deck12); position: relative; min-height: 0; }
  .fader.d34 { --acc: var(--deck34); }
  .fader .rail { position: absolute; left: 50%; top: calc(var(--mm) * 3); bottom: calc(var(--mm) * 3); width: calc(var(--mm) * .9);
    margin-left: calc(var(--mm) * -.45); border-radius: 3px; background: #050505; border: 1px solid #333; }
  .fader .ticks { position: absolute; left: 12%; right: 12%; top: calc(var(--mm) * 3); bottom: calc(var(--mm) * 3);
    background: repeating-linear-gradient(180deg, #2a2a2a 0 1px, transparent 1px 10%); }
  .fader .cap { position: absolute; left: 6%; right: 6%; height: calc(var(--mm) * 6); border-radius: calc(var(--mm) * .9);
    background: #d8d8d8; border: 1px solid #fff; will-change: top; }
  .fader .cap::after { content: ""; position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; margin-top: -1px; background: var(--acc); }
  .fader .lbl { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; color: var(--acc); font-size: calc(var(--mm) * 1.8); }
  .fader.held .cap { background: #fff; box-shadow: 0 0 calc(var(--mm) * 1.2) var(--acc); }
  #xf { grid-column: 1 / -1; position: relative; }
  #xf .rail { position: absolute; top: 50%; left: calc(var(--mm) * 4); right: calc(var(--mm) * 4); height: calc(var(--mm) * .9);
    margin-top: calc(var(--mm) * -.45); border-radius: 3px; background: #050505; border: 1px solid #333; }
  #xf .cap { position: absolute; top: 12%; bottom: 12%; width: calc(var(--mm) * 6); border-radius: calc(var(--mm) * .9);
    background: #d8d8d8; border: 1px solid #fff; will-change: left; }
  #xf.held .cap { background: #fff; box-shadow: 0 0 calc(var(--mm) * 1.2) #fff; }
  #xf .mid { position: absolute; left: 50%; top: 18%; bottom: 18%; width: 1px; background: #444; }

  /* unload: the eject sign, the waveform's height, beside the title; and its question */
  .strip .ejecticon { position: absolute; top: 4%; bottom: 4%; aspect-ratio: 1; opacity: 0; transition: opacity .5s; pointer-events: none; z-index: 4; }
  .strip .ejecticon.on { opacity: .92; }
  .strip .ejecticon.armed { pointer-events: auto; cursor: pointer; }   /* after the hold: tap it to unload */
  .strip .ejecticon svg { width: 100%; height: 100%; fill: var(--text); filter: drop-shadow(0 0 calc(var(--mm) * .8) rgba(0,0,0,.8)); }
  .unloadscrim { position: fixed; inset: 0; z-index: 48; background: rgba(0,0,0,.55); }
  #unloadask { position: fixed; z-index: 49; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(90vw, calc(var(--mm) * 80));
    background: #151515; border: 1px solid #333; border-radius: calc(var(--mm) * 2); padding: calc(var(--mm) * 3); display: grid; gap: calc(var(--mm) * 1.6); }
  #unloadask .t { font-size: calc(var(--mm) * 3); font-weight: 700; }
  #unloadask .sub { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #unloadask .dont { display: flex; align-items: center; gap: calc(var(--mm) * 1); color: var(--text); }
  #unloadask .dont small { color: var(--dim); }
  #unloadask .dont input { width: calc(var(--mm) * 3.5); height: calc(var(--mm) * 3.5); }
  #unloadask .seg { display: flex; gap: calc(var(--mm) * 1); }
  #unloadask .seg button { flex: 1; height: calc(var(--mm) * 7.5); }
  #unloadask .yes { background: var(--err); border-color: var(--err); color: #fff; }

  /* ---- T4·4: the mockup's fixed 2000 × 1200 surface, scaled to the screen ---- */
  #app.t44 { display: block; padding: 0; }
  #app.t44 > :not(.t44-scale) { display: none !important; }   /* the Controller layout stays built; Screen just hides it */
  .t44-scale { position: absolute; inset: 0; overflow: hidden; }
  .t44-scale .tablet { position: absolute; left: 50%; top: 50%; box-shadow: none; border-radius: 0; }

  .tablet{--pad-font:"Open Sans",sans-serif;--jog-bpm-digit:26px;--jog-bpm-unit:20px;--jog-time-digit:33px;--jog-time-colon:34px;--jog-elapsed-digit:21px;--jog-key-size:31px;

    background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:0 0 0 14px #000,0 0 0 15px #2a2a2a,0 22px 50px rgba(0,0,0,.22)}
  .tablet .topbar{display:flex;align-items:center;gap:12px;min-width:0;color:#9a9a96;font-size:13px}
  .link-state{display:flex;align-items:center;gap:8px;white-space:nowrap}

  body.skin-d #app .mode-btn{width:112px;height:40px;padding:0 10px 7px!important;--lc:var(--deck34);perspective:400px}
  .mode-btn .flip{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.75,.25,1)}
  .mode-btn.two .flip{transform:rotateX(180deg)}
  .mode-btn .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:17px;font-weight:700;letter-spacing:.08em}
  .mode-btn .face.back{transform:rotateX(180deg)}
  .tablet.two-deck .corner-btn{opacity:0;pointer-events:none}
  body.skin-d #app .pair-key{--lc:var(--deck12)}
  body.skin-d #app .pair-key.d34{--lc:var(--deck34)}
  .pair-key .side{color:#b9bcc2;font-size:11px}
  .pair-key .pdeck{font-size:18px;font-weight:700;opacity:.38}
  .pair-key .pdeck.on{opacity:1}
  .pair-key .k12{color:var(--deck12)}
  .pair-key .k34{color:var(--deck34)}
  .pair-key .swap{color:#9a9da2;font-size:14px}
  .mixer-badge{display:flex;align-items:center;gap:7px;margin-left:auto;color:#b9bcc2;font-size:12px;white-space:nowrap}
  .mixer-badge i{width:7px;height:12px;background:radial-gradient(70% 60% at 50% 55%,#b9e5ff,var(--deck34) 55%,#17587d);box-shadow:0 0 7px rgba(56,182,255,.55)}

  .decks{display:grid;grid-template-columns:308px 132px minmax(0,1fr) 132px 308px;grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;min-height:0;transition:grid-template-columns .2s ease}
  .tablet.labels-visible .decks{grid-template-columns:284px 156px minmax(0,1fr) 156px 284px}
  .slot{--acc:var(--deck12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;
    background:linear-gradient(#151619,#0e0f11);border:1px solid #202225;border-radius:8px}
  .slot.d34,.wave.d34,.channel.d34{--acc:var(--deck34)}
  .s1{grid-column:1;grid-row:1}.m1{grid-column:2;grid-row:1}.s2{grid-column:5;grid-row:1}.m2{grid-column:4;grid-row:1}
  .s3{grid-column:1;grid-row:2}.m3{grid-column:2;grid-row:2}.s4{grid-column:5;grid-row:2}.m4{grid-column:4;grid-row:2}
  .discbox{position:relative;width:280px;height:280px;display:grid;place-items:center;border-radius:14px;isolation:isolate}
  .discbox::before{content:"";position:absolute;inset:0;z-index:5;border:2px solid transparent;border-radius:14px;pointer-events:none;transition:box-shadow .15s}
  .discbox.active::before{border-color:var(--acc);box-shadow:0 0 8px color-mix(in srgb,var(--acc) 80%,transparent),0 0 24px color-mix(in srgb,var(--acc) 42%,transparent),inset 0 0 12px color-mix(in srgb,var(--acc) 18%,transparent)}
  .disc{--d:252px;position:relative;width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 43%,#1d1e22 0 42%,#151619 63%,#0e0f11 100%);
    box-shadow:inset 0 0 0 3px #2a2c30,inset 0 0 22px rgba(0,0,0,.65),0 0 0 2px #050505,0 3px 8px rgba(0,0,0,.55)}
  .decks .disc{--d:272px;transition:width .2s ease,height .2s ease}
  .tablet.labels-visible .decks .disc{--d:252px}
  .disc::after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid #2a2c30;pointer-events:none;box-shadow:inset 0 0 12px rgba(0,0,0,.35)}
  .arc{position:absolute;inset:7px;border-radius:50%;border:calc(var(--d) * .025) solid transparent;
    background:conic-gradient(var(--acc) 0 var(--deg,0deg),#26282c var(--deg,0deg) 360deg) border-box}
  .arc::after{content:"";position:absolute;inset:0;border-radius:50%;background:#151619}
  .active .arc{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--acc) 65%,transparent))}
  .rim{position:absolute;inset:4px;border-radius:50%;pointer-events:none;border:calc(var(--d) * .085) solid transparent;
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.17) 0 .55deg,rgba(0,0,0,.18) .55deg 1.15deg,transparent 1.15deg 2.1deg) border-box,
      conic-gradient(from 210deg,#303236,#777a80 12%,#3a3c40 28%,#85888d 46%,#34363a 65%,#6c6f74 82%,#303236) border-box;opacity:.95}
  .rim::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 43%,#1d1e22 0 42%,#151619 63%,#0e0f11 100%);box-shadow:inset 0 0 0 2px #2a2c30}
  .active .rim{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--acc) 48%,transparent))}
  .notch{position:absolute;left:50%;top:50%;z-index:3;width:4%;height:9.5%;margin:-4.75% 0 0 -2%;border:1px solid #000;border-radius:1px;
    background:linear-gradient(#050505,#1b1c1f);transform:rotate(var(--a,0deg)) translateY(calc(var(--d) * -.45));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 3px rgba(0,0,0,.8)}
  .playhead{position:absolute;left:50%;top:50%;width:2px;height:38%;margin:-38% 0 0 -1px;background:linear-gradient(#fff,rgba(255,255,255,.18));transform-origin:50% 100%;transform:rotate(var(--ph,90deg));border-radius:1px;z-index:2}
  .center{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
  .center .s7{--dh:inherit}
  .center .tm7{--dh:var(--jog-time-digit);padding:calc(var(--jog-time-digit) * .105) calc(var(--jog-time-digit) * .132);border-radius:3px;background:#151619}
  .center .jog-time{width:calc(var(--jog-time-digit) * 5.316);justify-content:center;gap:2px;white-space:nowrap}
  .center .jog-time .s7{gap:1px}
  .center .jog-time .s7 svg{width:calc(var(--dh) * .8)}
  .center .jog-time .colon{font-size:var(--jog-time-colon);line-height:1}
  #app.t44 .center .tm7 .s7 .on{fill:var(--sodium);stroke:rgba(255,173,50,.38)}
  #app.t44 .center .tm7 .s7 .off{fill:#15120d;stroke:none}
  .center .jog-time .s7:last-child svg:last-child{height:calc(var(--dh) * .6);width:calc(var(--dh) * .48)}
  .center .elapsed-wrap{display:flex;align-items:center;justify-content:center}
  .center .tm7.elapsed{--dh:var(--jog-elapsed-digit);padding:0;background:transparent}
  .center .tm7.elapsed .colon{font-size:calc(var(--jog-elapsed-digit) * .75)}
  .center .key{display:flex;align-items:center;gap:calc(var(--jog-key-size) * .265);font:700 var(--jog-key-size)/1 "Barlow Condensed",sans-serif;color:var(--silk);letter-spacing:.08em}
  .center .key::before{content:"";display:block;width:calc(var(--jog-key-size) * .1765);height:calc(var(--jog-key-size) * .9706);border-radius:1px;background:var(--key-color,var(--acc));box-shadow:0 0 6px color-mix(in srgb,var(--key-color,var(--acc)) 45%,transparent)}
  .center .bpm{display:flex;align-items:flex-end;justify-content:center;gap:6px;--dh:var(--jog-bpm-digit)}
  .center .bpm .unit{padding-bottom:2px;color:#a7b3a9;font:600 var(--jog-bpm-unit)/1 "Barlow Condensed",sans-serif;letter-spacing:.08em}
  #app.t44 .center .vfd7 .on{fill:var(--vfd);stroke:rgba(120,255,155,.38)}
  #app.t44 .center .vfd7 .off{fill:#10251a;stroke:rgba(120,255,155,.05);stroke-width:.7;paint-order:stroke}

  /* Outer corner: tucked 4 px inside the glow so the glow lines stay visible. Inner corner: the disc's arc, 4 px away. */
  body.skin-d #app button.corner-btn{position:absolute;left:0;top:0;z-index:7;width:96px;height:96px;padding:0!important;border:0!important;border-radius:0!important;
    background:transparent!important;box-shadow:none!important;color:var(--silk)!important;text-shadow:0 -1px 0 rgba(0,0,0,.55);cursor:pointer}
  body.skin-d #app button.corner-btn.right{left:auto;right:0}
  .corner-btn svg{position:absolute;inset:0;width:96px;height:96px;overflow:visible}
  .corner-btn .cut{fill:url(#corner-key-face);stroke:#050505;stroke-width:3;filter:drop-shadow(3px 4px 4px rgba(0,0,0,.48))}
  .corner-btn.sel .cut{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--acc) 65%,transparent)) drop-shadow(3px 4px 4px rgba(0,0,0,.48))}
  .corner-btn .lamp{position:absolute;left:14px;top:18px;width:9px;height:17px;background:#202226;box-shadow:inset 0 0 0 2px #383a3e}
  .corner-btn.sel .lamp{background:radial-gradient(70% 60% at 50% 55%,color-mix(in srgb,var(--acc) 70%,#fff),var(--acc) 55%,color-mix(in srgb,var(--acc) 80%,#000));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 0 7px color-mix(in srgb,var(--acc) 55%,transparent)}
  .corner-btn .num{position:absolute;left:32px;top:13px;color:var(--acc);font:700 25px/1 "Barlow Condensed",sans-serif}
  .corner-btn.right .lamp{left:auto;right:14px}
  .corner-btn.right .num{left:auto;right:32px}
  /* Pressed: the key face darkens and sinks. The generic key's grey square is cancelled here (it would cover the jog). */
  body.skin-d #app button.corner-btn.down, body.skin-d #app button.corner-btn:active{background:transparent!important;box-shadow:none!important}
  .corner-btn.down .cut, .corner-btn:active .cut{filter:brightness(.84) drop-shadow(1px 2px 2px rgba(0,0,0,.55))}
  .keys{display:flex;justify-content:center;gap:7px}
  .keys button{height:32px;min-width:54px;font-size:12px}
  body.skin-d #app .keys button{--lc:var(--acc)}

  /* Big Wave rows: 3 1 2 4, shared t4-wave-*.svg assets and overlay positions. */
  .waves{grid-column:3;grid-row:1/3;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:4px;min-height:0;min-width:0}
  .wave{--acc:var(--deck12);position:relative;min-width:0;min-height:0;overflow:hidden;background:#08090a;border:1px solid #1d2022;border-radius:4px}
  .wave>img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;object-fit:fill}
  .wave .played{position:absolute;top:0;bottom:0;left:0;width:50%;background:rgba(0,0,0,.45)}
  .wave .cur{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#ffc23d;box-shadow:0 0 4px rgba(255,194,61,.35)}
  .nm{position:absolute;left:5px;top:4px;display:flex;align-items:center;gap:6px;padding:2px 6px 2px 4px;border-radius:3px;background:rgba(0,0,0,.76);
    font-size:14px;line-height:20px;color:#ddd;white-space:nowrap;max-width:44%;overflow:hidden;z-index:2}
  .nm b{color:var(--acc);font-size:15px}
  .nm span.title{overflow:hidden;text-overflow:ellipsis}
  .on-deck{width:7px;height:12px;flex:none;background:#202226;box-shadow:inset 0 0 0 1.5px #383a3e}
  .on-deck.lit{background:radial-gradient(70% 60% at 50% 55%,color-mix(in srgb,var(--acc) 70%,#fff),var(--acc) 55%,color-mix(in srgb,var(--acc) 80%,#000));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 0 7px color-mix(in srgb,var(--acc) 55%,transparent)}
  .bars{position:absolute;right:calc(50% + 7px);top:4px;font:700 44px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#fff;
    -webkit-text-stroke:.07em #000;paint-order:stroke fill;z-index:2;white-space:nowrap}

  .cursec{position:absolute;left:5px;bottom:5px;display:flex;align-items:center;gap:6px;padding:3px 6px 3px 3px;border-radius:3px;background:rgba(0,0,0,.76);
    font:700 13px/1.25 system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;z-index:2;color:var(--sc)}
  .cursec i{font-style:normal;padding:2px 5px;border-radius:3px;color:#101010;background:var(--sc)}

  /* One vertical Mixxx channel beside each jog; no crossfader on this screen. */
  .channel{--acc:var(--deck12);align-self:center;height:360px;display:grid;grid-template-columns:minmax(0,1fr) 44px;grid-template-rows:20px minmax(0,1fr);
    gap:6px;padding:8px 7px;background:linear-gradient(#141518,#0e0f11);border:1px solid #23262a;border-radius:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
  .chlab{grid-column:1/-1;text-align:center;font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em;color:var(--acc)}
  .knobs{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:4px;align-items:center;min-height:0}
  .channel .knob{--knob:52px;position:relative;display:flex;cursor:pointer}
  .channel .knob span{display:none;position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:4;margin:0;padding:3px 5px;border-radius:2px;background:rgba(0,0,0,.88);color:#e4e2da;font-size:12px;text-align:center;white-space:nowrap}
  .channel .knob.show-label span,.tablet.labels-always .channel .knob span{display:block}
  .knob .phys{fill:var(--err);stroke:#0b0b0b;stroke-width:.8;filter:drop-shadow(0 0 1.5px rgba(255,90,95,.85))}
  .knob.caught .phys{fill:var(--err);filter:drop-shadow(0 0 1.5px rgba(255,90,95,.85));animation:knob-catch-flash .2s ease-out}
  @keyframes knob-catch-flash{
    0%{opacity:0;fill:#fff;filter:drop-shadow(0 0 1px rgba(255,255,255,0))}
    35%{opacity:1;fill:#fff;filter:drop-shadow(0 0 3px rgba(255,255,255,.95))}
    100%{opacity:1;fill:var(--err);filter:drop-shadow(0 0 1.5px rgba(255,90,95,.85))}
  }
  .channel .faderwrap{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;height:auto;min-height:0}
  .channel .faderwrap .fader{width:44px;height:100%}
  .fader .phys{position:absolute;left:4px;right:4px;top:var(--p,60%);height:3px;margin-top:-1px;border-radius:2px;background:var(--err);box-shadow:0 0 6px rgba(255,90,95,.85);z-index:3}
  .fader.caught .phys{background:var(--err);box-shadow:0 0 6px rgba(255,90,95,.85);animation:fader-catch-flash .2s ease-out}
  @keyframes fader-catch-flash{
    0%{opacity:0;background:#fff;box-shadow:0 0 2px rgba(255,255,255,0)}
    35%{opacity:1;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.95)}
    100%{opacity:1;background:var(--err);box-shadow:0 0 6px rgba(255,90,95,.85)}
  }

  /* The two active decks' pads: Mixxx ZyDeck's LateNight PaleMoon padgrid.cpp, kept in one row of eight. */
  .padbanks{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
  .padcol{display:grid;grid-template-rows:28px minmax(0,1fr);gap:6px;padding:7px 8px 8px;background:#121212;border:1px solid #242628;border-radius:9px;min-height:0}
  .mx-mode{position:relative;display:flex;align-items:center;justify-content:center;border:1px solid #000001;border-radius:0;
    background:color-mix(in srgb,var(--acc) 22%,#3a3a3c);box-shadow:inset 0 0 0 100px rgba(220,220,220,.07);
    color:var(--acc);font:600 16px/1 "Open Sans",sans-serif;letter-spacing:.04em}
  .mx-mode .mx-mode-name{color:var(--acc);text-shadow:none}
  .mx-mode .chev{position:absolute;top:50%;transform:translateY(-50%);color:color-mix(in srgb,var(--acc) 60%,#888);font-size:20px}
  .mx-mode .chev.l{left:7px}.mx-mode .chev.r{right:7px}
  .padrow{grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:minmax(0,1fr);min-height:0;gap:2px}
  body.skin-d #app .padbanks .pads{background:transparent;border-radius:0;box-shadow:none}
  body.skin-d #app .padbanks .pad:not(.asknob){border:1px solid #000001!important;border-radius:0!important;background:var(--mx-face,#1e1e20)!important;
    box-shadow:inset 0 0 0 100px rgba(220,220,220,.07)!important;color:var(--mx-ink,#666)!important;padding:4px 2px!important;
    font:600 19.6px/1.15 var(--pad-font);justify-content:center!important;align-items:center!important;text-align:center!important}
  .padbanks .pad .mx-name{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:22.4px;font-weight:600}
  .padbanks .pad .mx-detail{display:block;margin-top:3px;font-size:16.8px;font-weight:600;line-height:1.1}

  /* Big Wave panels inside the mockup's .waves rows */
  .waves .wv { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #08090a; border: 1px solid #1d2022; border-radius: 4px; container-type: size; }
  .waves .wv canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .waves .wv .played { position: absolute; top: 0; bottom: 0; left: 0; width: 50%; background: rgba(0,0,0,.45); }
  .waves .wv .cur { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ffc23d; box-shadow: 0 0 4px rgba(255,194,61,.35); }
  .waves .wv .name { position: absolute; left: 5px; top: 4px; display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px 4px; border-radius: 3px; background: rgba(0,0,0,.76); font-size: 14px; line-height: 20px; color: #ddd; white-space: nowrap; max-width: 44%; overflow: hidden; z-index: 2; }
  .waves .wv .name b { color: var(--acc); font-size: 15px; }
  .waves .wv .name span { overflow: hidden; text-overflow: ellipsis; }
  .waves .wv .bars { position: absolute; right: calc(50% + 7px); top: 4px; font: 700 44px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #fff; -webkit-text-stroke: .07em #000; paint-order: stroke fill; z-index: 2; white-space: nowrap; }
  .waves .wv .cursec { position: absolute; left: 5px; bottom: 5px; display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 3px; border-radius: 3px; background: rgba(0,0,0,.76); font: 700 13px/1.25 system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 2; color: var(--c); }
  .waves .wv .cursec:empty { display: none; }
  .waves .wv .cursec i { font-style: normal; padding: 2px 5px; border-radius: 3px; color: #101010; background: var(--c); }
  .waves .wv .span { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); z-index: 3; padding: 1px 8px; border-radius: 4px; background: rgba(0,0,0,.78); font: 700 15px/20px system-ui, sans-serif; color: #fff; white-space: nowrap; visibility: hidden; }
  .waves .wv.spanon .span { visibility: visible; }
  .waves .wv.empty canvas, .waves .wv.empty .cur, .waves .wv.empty .played { visibility: hidden; }
  #app.t44 .tablet { --pad-font: "IBM Plex Sans", sans-serif; }
  #app.t44 .mx-mode { font-family: "IBM Plex Sans", sans-serif; }

  /* ---- phone (?phone=1): one phone held sideways, inside the phone page (portrait there is the library) ----
     tempo lanes on the outer edges (full height), both strips across the top, under them deck | mixer | deck. */
  #app.phone { --gap: calc(var(--mm) * 1); padding: calc(var(--mm) * .8); gap: var(--gap); grid-template-areas: none;
    grid-template-columns: calc(var(--mm) * 9) minmax(0, 1fr) calc(var(--mm) * 9); grid-template-rows: minmax(0, 1fr); }
  #app.phone .pcol { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }

const samplers = Array.from({ length: 32 }, (_, i) => ({ state: [0, 1, 2, 3, 5, 8, 9, 12].includes(i) ? 1 : 0, name: `Sample ${i + 1}` }));
const master = { main: .8, phones: .6, mix: .5, xf: .5 };
const sides = [0, 1];                    // deck index shown on the left / right side (0↔2, 1↔3)
// What each side shows: its deck, or sampler pads (left 1-16, right 17-32), switched on its own so the other
// side stays a deck.
const sidePage = ["deck", "deck"];
// Which pads a side shows when it's on sampler pads: 0 = 1-16, 1 = 17-32. Left normally 1-16, right 17-32;
// SHIFT + SAMPLES shows the other bank.
const sideBank = [0, 1];
const deckOf = s => decks[sides[s]];
// Wired to Mixxx later; for now every event is logged for the Mac's /settings debug view.
const eventLog = [];
// Latency log counters (see "Latency log" below)
const lat = { seq: 0, sent: new Map(), rtt: [], up: [], down: [], js: [], spikes: [], lost: 0, direct: 0,
  input: [], frameMax: 0, loopMax: 0, bufMax: 0, sends: 0, offsets: [], trace: [], gaps: [], t0: performance.now() };
// The session profiler (the hub's /api/profile; its report: /profile): while it runs, this page pings 20 times a
// second and sends its summary every second, telemetry or not (it stays on this device)
let prof = { on: false }, profAt = 0, remoteXruns = null;
const send = (...args) => {
  if (!live && args[0] === "loopMove") { const d = decks[args[1] - 1]; d.loopStart += args[2] * 60 / d.bpm; }
  if (!live && args[0] === "loopPoint") {

    if (args[2] === "in") d.loopStart = args[3]; d.loopSize = ((args[2] === "out" ? args[3] : end) - d.loopStart) * d.bpm / 60;
  }
  eventLog.push([Math.round(performance.now()), ...args]);
  if (eventLog.length > 400) eventLog.splice(0, 200);

};
let benchQuiet = false;                   // a debug benchmark is driving the controls: don't send them to Mixxx
let live = false;                         // true once the real pad server (connected to Mixxx) answers
// Controller mode (the hub's "remote" status): the decks are Mixxx's on a computer. Waveforms and beat grids

let REMOTE = { on: false };

fetch("/api/livestems").then(r => r.json()).then(j => { liveStemsAuto = j.auto !== false; }).catch(() => {});

// =====================================================================================================
// Touch handling: every control captures its finger until it lifts (pointer capture)
// =====================================================================================================
// (in zydeck-knob.js, shared with the phone page's mixer: the touch dispatch, palms, Precision's heard values and the knobs)
const { active, isPalm, drag, startDrag, RAW_INPUT, realtimeInput, heardValue, polar, arc, knob } = zydeckTouch({
  // Precision: a held control shows Mixxx's own value: its element's (el.mixxx: the master knobs), or its getter read
  // through what Mixxx last said for that deck's fields (heard(), kept even while our own echo is ignored)
  heard: (get, ctx, el) => {
    if (el.mixxx) return el.mixxx();
    if (!ctx?._mx) return undefined;
    const v = get(new Proxy(ctx, { get: (t, k) => (t._mx && Object.hasOwn(t._mx, k) ? t._mx[k] : t[k]) }));
    return Number.isFinite(v) ? v : undefined;
  },
  settings: () => S, mm, rect: cachedRect, tick: el => tick(el), holdMs: () => FX_HOLD_MS,   // (the knobs held for something: the FX knobs, for the FX menu)
  beat: ctx => { const d = ctx || deckOf(0); return 60 / (d.bpm * (1 + d.tempo / 100)); },
});
// ZyDeck's app: in Real-time, Android delivers touch moves unbatched too (else once a frame, before the page sees them)
const tellApp = () => { try { window.ZydekAndroid?.setRealtimeInput?.(realtimeInput()); } catch {} };
addEventListener("contextmenu", e => e.preventDefault());
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const h = (tag, cls, html) => { const el = document.createElement(tag); if (cls) el.className = cls; if (html != null) el.innerHTML = html; return el; };

// a master control's own value as Mixxx last said it (Precision shows it while held)
const mixxxOf = (el, k) => { el.mixxx = () => master._mx?.[k]; return el; };
// ---- fader: a touch on its track jumps the cap there and follows at once; a touch on the cap itself never moves
// it, and dragging it starts after 2 mm (so a touch can't nudge the level)
function fader(get, set, label, horizontal, target = () => null) {
  const el = horizontal ? document.getElementById("xf") : h("div", "fader", `<div class="lbl"></div><div class="ticks"></div><div class="rail"></div><div class="cap"></div>`);
  if (horizontal) el.innerHTML = `<div class="mid"></div><div class="rail"></div><div class="cap"></div>`;
  el._px = undefined;                     // the crossfader element is reused across rebuilds; its cap is new
  const cap = el.querySelector(".cap");
  const geom = () => {
    const r = cachedRect(el), pad = mm(3);
    return horizontal ? { a: r.left + mm(4), len: r.width - mm(8) } : { a: r.top + pad, len: r.height - 2 * pad };
  };
  // value 1 = top (vertical) / right (horizontal)
  const capCenter = (g, v) => horizontal ? g.a + v * g.len : g.a + (1 - v) * g.len;
  const valueAt = (g, p) => clamp(horizontal ? (p - g.a) / g.len : 1 - (p - g.a) / g.len, 0, 1);
  el.paint = shown => {
    if (shown != null && el.hold) el.hold.shown = shown;   // held: other repaints keep the finger's place
    const ctx = el.hold ? el.hold.ctx : target(), g = geom(), r = cachedRect(el);
    const v = (el.hold ? heardValue(get, ctx, el) : undefined) ?? shown ?? el.hold?.shown ?? get(ctx);   // (Precision: where Mixxx has it)
    const px = (capCenter(g, v) - (horizontal ? r.left : r.top) - mm(3)).toFixed(1) + "px";
    if (px !== el._px) { el._px = px; cap.style[horizontal ? "left" : "top"] = px; }
    if (label) setText(el.querySelector(".lbl"), label(ctx));
  };
  drag(el, {
    down: e => {
      const g = geom(), p = horizontal ? e.clientX : e.clientY, ctx = target();
      el.hold = { ctx };
      let v = get(ctx);
      // on the cap (or within 2 mm of it: a fingertip's slop): it stays put until the finger has moved 2 mm;
      // anywhere else on the fader: the cap jumps to the finger
      const c = cap.getBoundingClientRect(), slop = mm(2);
      const onCap = e.clientX >= c.left - slop && e.clientX <= c.right + slop && e.clientY >= c.top - slop && e.clientY <= c.bottom + slop;
      if (!onCap) { v = valueAt(g, p); set(v, ctx); el.paint(); }
      el.classList.add("held");
      return { p, v, g, ctx, dead: onCap };
    },
    move: (e, st) => {
      if (st.dead) {   // on the cap: still until the finger has gone 2 mm, then it follows from there
        const moved = (horizontal ? e.clientX : e.clientY) - st.p;
        if (Math.abs(moved) < mm(2)) return;
        st.dead = false;
        st.p += Math.sign(moved) * mm(2);
      }
      const at = ev => clamp(st.v + ((horizontal ? ev.clientX : ev.clientY) - st.p) / st.g.len * (horizontal ? 1 : -1), 0, 1);
      set(at(e), st.ctx);
      el.paint(at(e));
    },
    up: () => { el.classList.remove("held"); el.hold = null; el.paint(); },
  });
  return el;
}

// =====================================================================================================
// Building the screen
// =====================================================================================================
const ui = { sides: [], chans: [], faders: [], top: [] };

function buildTop() {
  const box = document.getElementById("topknobs");

  ui.top = [
    mixxxOf(knob("MASTER", () => master.main, v => { master.main = v; send("master", v); }, .8, false), "main"),
    mixxxOf(knob("PHONES", () => master.phones, v => { master.phones = v; send("phones", v); }, .6, false), "phones"),
    mixxxOf(knob("CUE MIX", () => master.mix, v => { master.mix = v; send("headMix", v); }, .5, true), "mix"),
  ];

}

function buildSide(s) {
  const el = h("div", `side ${s ? "right" : "left"}`);
  const u = { el };
  if (sidePage[s] === "samples") {
    el.classList.add("samples");
    const pads = h("div", "pads grid16");
    u.spads = [];
    for (let k = 0; k < 16; k++) {
      const i = sideBank[s] * 16 + k, p = h("div", "pad");
      bindPress(p, down => samplerPress(deckOf(s), i, down, p));
      pads.appendChild(p); u.spads[k] = { el: p, i };
    }
    el.appendChild(pads);
    shiftButton(s, u, "shift sshift");
    if (stacked()) { buildStrip(s, u); placeStrip(s, u); }
    ui.sides[s] = u;
    return el;
  }

  // tempo lane (outer edge)
  const tempo = h("div", "tempo");
  tempoControls(s, u, "TEMPO<br>BOOST");
  tempo.append(u.shiftBtn, u.lane, u.tread, u.ol);   // SHIFT at the top, TEMPO BOOST at the bottom

  const deck = h("div", "deck");
  const head = buildStrip(s, u);

  // transport
  const tr = h("div", "transport");
  transportControls(s, u);
  const kb = h("div", "keybox");
  const kd = h("button", "", "−"), ku = h("button", "", "+"); u.key = h("span");
  kb.append(kd, u.key, ku);
  tr.append(u.cue, u.play, u.sync, kb);
  const shiftKey = n => { const d = deckOf(s); if (live) send("key", d.n, n); guessKey(d, n); paintSide(s); };
  bindPress(kd, down => { if (down) shiftKey(-1); });
  bindPress(ku, down => { if (down) shiftKey(1); });

  // pad modes + pads
  const modes = h("div", "modes");
  // (no FX mode: the FX strip under the pads has it all; PAD FX is effects held on by the pads, rekordbox's way)
  u.modes = ["cue", "pfx", "stem", "smpl", "jump"].map(m => {   // (PAD FX where ROLL was: its pads roll too)
    const b = h("button", "", m === "pfx" ? "PAD FX" : m.toUpperCase()); b.dataset.mode = m;
    bindPress(b, down => {
      if (!down) return;
      const d = deckOf(s);
      if (m === "pfx") { d.pfxPage = d.mode === "pfx" ? 1 - (d.pfxPage || 0) : d.pfxPage || 0; }   // (again: its other page)
      d.mode = m; shiftUsed(d); if (m === "pfx") pfxPrep(d); paintSide(s);
    });
    modes.appendChild(b); return b;
  });
  const pads = buildPads(s, u, 8);
  const fx = buildFxStrip(s, u);
  if (stacked()) { deck.append(tr, modes, pads, fx); placeStrip(s, u); } else deck.append(head, u.strip, tr, modes, pads, fx);
  if (s === 0) el.append(tempo, deck); else el.append(deck, tempo);
  ui.sides[s] = u;
  return el;
}

// The tablet's FX strip for side s (its deck's effect unit), Beat FX or Multi-FX as in Settings: the same
// controls as the FX pad mode, always at hand.
function buildFxStrip(s, u) {
  const el = h("div", "fxstrip");
  const unit = () => fxUnitOf(deckOf(s));
  u.fx = { el, paint: () => {} };
  const pfx = buildPfxStrip(s);   // (in PAD FX mode, in its place)
  const strip = el;
  const done = () => {
    const inner = u.fx.paint;
    const box = h("div", "fxset"); box.append(...strip.childNodes); strip.append(box, pfx.el);
    u.fx.paint = () => {
      const on = deckOf(s).mode === "pfx";
      box.hidden = on; pfx.el.hidden = !on;
      if (on) pfx.paint(); else inner();
    };
  };
  if (S.fxLayout === "multi") {
    const hold = { onHold: () => fxMenu(s), fill: () => [el] };   // hold anywhere on the row: the FX menu
    const knobs = [0, 1, 2].map(j => knob("FX", () => fxState[unit() - 1].meta[j],
      v => { fxState[unit() - 1].meta[j] = v; setCtl(fxSlotG(unit(), j), "meta", v); }, null, false, () => null,
      () => fxTapEffect(deckOf(s), unit(), j), hold));
    const mix = knob("MIX", () => fxState[unit() - 1].mix, v => { fxState[unit() - 1].mix = v; setCtl(fxUnitG(unit()), "mix", v); }, null,
      false, () => null, null, hold);
    el.append(...knobs, mix);
    u.fx.paint = () => {
      const f = fxState[unit() - 1];
      knobs.forEach((k, j) => {
        k.classList.toggle("fxon", !!f.enabled[j]);
        setHTML(k.querySelector("span"), `${f.enabled[j] ? "● " : ""}${fxName(unit(), j).replace(/</g, "&lt;")}`);
        k.paint();
      });
      mix.paint();
    };
  } else {
    const name = h("button"), on = h("button");
    const level = knob("LEVEL", () => fxState[unit() - 1].mix, v => { fxState[unit() - 1].mix = v; setCtl(fxUnitG(unit()), "mix", v); }, null);
    bindPress(name, holdOrTap(() => fxMenu(s), () => fxCycle(deckOf(s), unit(), 0, deckOf(s).shift ? -1 : 1), name, FX_HOLD_MS));
    // BEAT: a knob that snaps from ¼ to 32 beats, a tick for each step
    const beatIdx = () => Math.max(0, FX_BEAT_STEPS.indexOf(fxBeat[unit() - 1]));
    let lastStep = -1;
    const beats = knob("BEAT", () => beatIdx() / (FX_BEAT_STEPS.length - 1), v => {
      const i = Math.round(v * (FX_BEAT_STEPS.length - 1));
      if (i !== lastStep) { if (lastStep >= 0) tick(beats); lastStep = i; fxSetBeats(unit(), 1, FX_BEAT_STEPS[i]); }
    }, null);
    beats.classList.add("stepped");

      const a = -135 + i / (FX_BEAT_STEPS.length - 1) * 270, [x1, y1] = polar(a, 15), [x2, y2] = polar(a, 18);
      const t = document.createElementNS("http://www.w3.org/2000/svg", "line");
      t.setAttribute("x1", x1); t.setAttribute("y1", y1); t.setAttribute("x2", x2); t.setAttribute("y2", y2); t.setAttribute("class", "ktick");

      if (!down) return;

    });

    u.fx.paint = () => {
      const un = unit(), f = fxState[un - 1];
      setHTML(name, `${fxName(un, 0).replace(/</g, "&lt;")}<small>${deckOf(s).shift ? "◀ previous" : "next effect ▶"}</small>`);
      setHTML(beats.querySelector("span"), `BEAT ${beatText(fxBeat[un - 1])}`);

// PAD FX's strip: the pad last pressed (held: lit), its INTENSITY (its effect's meta knob; each pad keeps its own)
// and the unit's MIX (how much of the effect against the track: half and half, a roll still has the track under it)
function buildPfxStrip(s) {
  const el = h("div", "fxset pfxset"), name = h("button", "pfxname");
  const last = () => { const d = deckOf(s); return d.pfxLast ?? pfxId(d, 0); };
  bindPress(name, down => { if (down) pfxMenu(deckOf(s), last(), name); });   // (its menu, as SHIFT + the pad)
  // LEVEL/DEPTH and INTENSITY: for now only, over the pads' presets. At rest 0 (the presets as they are); turned, the
  // pad held plays at that level / intensity at once (or the next one pressed), and once no pad is held they're back
  // at 0. Never the presets themselves (the pad's menu sets those).
  const tmp = () => (deckOf(s).pfxTmp ??= { level: 0, meta: 0 });
  const level = knob("LEVEL/DEPTH", () => tmp().level, v => { tmp().level = v; pfxOverride(deckOf(s)); }, 0);
  const meta = knob("INTENSITY", () => tmp().meta, v => { tmp().meta = v; pfxOverride(deckOf(s)); }, 0);
  el.append(name, level, meta);
  return { el, paint: () => {
    const d = deckOf(s), id = last(), p = pfxPad(id), held = (d.pfxHeld || []).some(o => o && o.id === id);
    setHTML(name, `${p.name || pfxName(p.fx)}${p.beats ? " " + beatText(p.beats) : ""}<small>${held ? "on" : "pad " + ((id & 7) + 1)} · ${pfxRemote ? "Mixxx's" : "unit " + pfxUnit(d)}</small>`);
    name.classList.toggle("on", held);
    level.paint(); meta.paint();
  } };
}

// Tempo lane, TEMPO BOOST and SHIFT for side s (both layouts).
function tempoControls(s, u, olLabel) {
  u.ol = h("button", "ol", olLabel);
  bindPress(u.ol, down => { if (!down) return; const d = deckOf(s); d.ol = !d.ol;
    if (!d.ol && Math.abs(d.tempo) > 8) { d.tempo = clamp(d.tempo, -8, 8); send("tempo", d.n, d.tempo); }
    paintSide(s); });
  u.lane = h("div", "lane", `<div class="end t"></div><div class="zero"></div><div class="mark"></div><div class="lock"></div><div class="end b"></div>`);
  u.tread = h("div", "tread");
  shiftButton(s, u);
  drag(u.lane, {
    // Touchpad: only the change in finger position counts, wherever you touch.
    down: e => { if (synced(deckOf(s))) return false;   // a synced deck follows the master's tempo
      u.lane.classList.add("held"); u.laneDeck = deckOf(s); return { y: e.clientY, deck: u.laneDeck }; },
    move: (e, st) => {
      const dmm = (e.clientY - st.y) / S.pxmm;
      st.y = e.clientY;
      // linear; TEMPO BOOST widens it to -99 % .. +300 %
      const d = st.deck;
      d.tempo = clamp(d.tempo + dmm * S.sens * (S.fasterDown ? 1 : -1), d.ol ? -99 : -8, d.ol ? 300 : 8);
      send("tempo", st.deck.n, st.deck.tempo);
      paintTempo(s);
    },
    up: () => { u.lane.classList.remove("held"); u.laneDeck = null; paintTempo(s); },
  });
}

// SHIFT for side s. Held: a momentary SHIFT, like a controller's. Tapped: it stays on until the next tap (or
// until it's used). Each side's SHIFT is its own.
function shiftButton(s, u, cls = "shift") {
  u.shiftBtn = h("button", cls, "SHIFT");
  let shiftAt = 0, wasOn = false;
  bindPress(u.shiftBtn, down => {
    const d = deckOf(s);
    shiftHeld[s] = down;
    if (down) {
      shiftAt = performance.now(); wasOn = d.shift; shiftUsedHeld[s] = false;
      if (!wasOn) setShift(s, true);
    } else if (wasOn || shiftUsedHeld[s] || performance.now() - shiftAt > 350) setShift(s, false);
    paintAll();
  });
  return u.shiftBtn;
}

// SAMPLES 1-16 / 17-32 on both sides: green while that side shows pads; the SHIFT bank on a dimmed second line,
// lit while either SHIFT is on (or while that side shows it).
const BANKS = ["1–16", "17–32"];
function paintSamplesButtons() {
  const shifted = deckOf(0).shift || deckOf(1).shift;
  [0, 1].forEach(s => {
    const b = ui.loops?.[s]?.smp;
    if (!b) return;
    const on = sidePage[s] === "samples", alt = on && sideBank[s] !== s;
    b.classList.toggle("on", on);
    setHTML(b, two(`SAMPLES <i>${BANKS[s]}</i>`, `⇧ ${BANKS[1 - s]}`, shifted || alt));
  });
}

// SHIFT used (a SHIFT function pressed): a tapped SHIFT goes off; one held stays on until it's let go
const shiftHeld = [false, false], shiftUsedHeld = [false, false];
function shiftUsed(d) {
  const both = sidePage[0] === "samples" && sidePage[1] === "samples";
  const held = [0, 1].filter(t => shiftHeld[t] && (both || deckOf(t) === d));
  if (held.length) { held.forEach(t => shiftUsedHeld[t] = true); return; }
  if (both) setShift(0, false); else d.shift = false;
}
// With both sides on sampler pads the two SHIFTs are one (the 32 pads are one grid); otherwise each has its own.
function setShift(s, on) {
  if (sidePage[0] === "samples" && sidePage[1] === "samples") [0, 1].forEach(t => deckOf(t).shift = on);
  else deckOf(s).shift = on;
}

// Sampler pads (the samples page, and SAMPLER pad mode). With the deck's SHIFT: an empty pad captures the deck's
// loop into it (just the stems it's playing); a loaded one starts or stops following the master tempo.
const samplerSync = new Array(64).fill(false);
const samplerKeylock = new Array(64).fill(true);   // [SamplerN],keylock: the pitch stays when it follows the tempo
// Pad modes (kept by Zydek's server, the same on every page): "oneshot" plays to the end, a tap restarts it;
// "hold" plays while held; "loop" starts and stops on alternate taps (in time when it follows the tempo).
const samplerModes = new Array(64).fill("oneshot");
const MODE_MARK = { oneshot: "▶", hold: "■", loop: "↻" };
const push = (g, k) => { setCtl(g, k, 1); setCtl(g, k, 0); };
function samplerPress(d, i, down, el) {
  if (d.shift) {   // SHIFT: an empty pad captures the deck's loop; a loaded one opens its options
    if (!down) return;
    shiftUsed(d);
    if (!samplers[i].state) captureInto(d, i); else padOptions(i, el);
    paintAll();
    return;
  }
  if (!live) { if (down) samplerTap(i); return; }
  const g = `[Sampler${i + 1}]`, mode = samplerModes[i];
  if (!samplers[i].state) return send("pad", 0, i, down);
  if (mode === "hold") return push(g, down ? "cue_gotoandplay" : "cue_gotoandstop");
  if (!down) return;
  if (mode === "loop" && samplers[i].state === 2) return push(g, "cue_gotoandstop");
  push(g, "cue_gotoandplay");
}
// A loaded pad's options, next to it: its mode, following the master tempo, clearing it.
function padOptions(i, anchor) {
  document.querySelectorAll(".padopts, .pfxhw").forEach(e => e.remove()); document.querySelector(".padveil")?.remove();
  const veil = h("div", "padveil"), box = h("div", "padopts"), g = `[Sampler${i + 1}]`;
  const close = () => { box.remove(); veil.remove(); };
  veil.addEventListener("pointerdown", e => { e.stopPropagation(); close(); });
  box.append(h("div", "t", `Pad ${i + 1}<small>${samplers[i].name || ""}</small>`));
  [["oneshot", "▶ ONE-SHOT"], ["hold", "■ HOLD"], ["loop", "↻ LOOP"]].forEach(([m, label]) => {
    const b = h("button", samplerModes[i] === m ? "on" : "", label);
    bindPress(b, down => {
      if (!down) return;
      samplerModes[i] = m; paintAll(); close();
      if (live) fetch(`/api/sampler/mode?slot=${i + 1}&mode=${m}`).catch(() => {});
    });

// so a finger's wobble isn't). k: {x, t: the stroke's start, dir: -1 | 0 | 1, ext, extT: its farthest point}
function strokeMove(k, x, now) {

  if ((k.ext - x) * k.dir > mm(2)) { k.x = k.ext; k.t = k.extT; k.dir = -k.dir; k.ext = x; k.extT = now; }

// Nudge bar (strips on top): like the edge of a jog wheel. Dragging bends the tempo by the finger's speed,
// left = faster as on the strip (the music moves the way you push it); still or lifted = no bend. With
// SHIFT on and a loop playing, dragging moves the loop instead, a quarter beat per 2.5 mm (right = later).
// Nudge: a short bend for lining the beats up (Serato-like), not a tempo change. At full sensitivity (1) 50 mm/s
// of finger speed = +8 % playback speed, Mixxx's feel; S.nudgeSens scales it (default 0.3, so +2.4 %).

function buildNudge(s, u) {

      const d = deckOf(s), adjust = d.adjust || null, loopMove = !adjust && d.shift && d.loopOn;
      u.nudge.classList.add("held"); u.nudge.classList.toggle("loopmove", !!(adjust || loopMove));
      if (adjust) setHTML(u.nudge, loopRange(d) ? `◀ EARLIER · LOOP ${adjust.toUpperCase()} · LATER ▶` : "NO LOOP TO ADJUST");
      else if (loopMove) setHTML(u.nudge, "◀ EARLIER · MOVE LOOP · LATER ▶");
      return { x: e.clientX, d, adjust, loopMove, acc: 0, samples: [{ t: performance.now(), x: e.clientX }] };
    },
    move: (e, st) => {
      const now = performance.now(), dx = e.clientX - st.x;

      if (st.adjust) {   // the loop point follows the finger at the strip's scale; never a tempo bend here

        else send("loopPoint", st.d.n, "out", clamp(lr[1] + sec, lr[0] + .01, st.d.dur));
        return;

        return;

// The loop on a deck in seconds, [in, out], or null.
function loopRange(d) {

// Mixxx's pre-roll and post-roll (allshader/waveformrendererpreroll.cpp): before the track's start and after its
// end, a row of triangles pointing in towards the track, 40 % of the waveform's height, outlined 1.5 px with a
// 25 % fill.
function drawRolls(g, d, pxPerSec, left, W, H) {
  if (!(d.dur > 0)) return;
  const dpr = devicePixelRatio || 1, breadth = H * .4, mid = H / 2, len = Math.max(4, Math.round(breadth));
  const tri = (tip, dir) => {   // dir 1: tip on the right
    g.beginPath(); g.moveTo(tip - dir * .75 * dpr, mid);
    g.lineTo(tip - dir * (len - .75 * dpr), mid - breadth / 2); g.lineTo(tip - dir * (len - .75 * dpr), mid + breadth / 2);
    g.closePath(); g.fill(); g.stroke();

  g.lineWidth = 1.5 * dpr; g.lineJoin = "round"; g.strokeStyle = "rgb(190,198,210)"; g.fillStyle = "rgba(190,198,210,.25)";
  let x = Math.round(0 * pxPerSec) - left;                 // the track's start: tips point right, at it
  if (x > W + len) x -= Math.ceil((x - W - len) / len) * len;

async function loadWaveform(d, id) {

      const r = await fetch(REMOTE.on ? url : `${url}?stems=1`, tries ? { cache: "no-store" } : {});
      if (!REMOTE.on && r.status === 404 && tries >= 3) return;   // not on a deck (its name can come a moment early)
      if (r.status === 202) wait = 15000;   // (or sooner: the "wf" push)

// Simulation: a made-up waveform for the demo decks (kicks on the beat, hats off the beat).

  const rate = 441, n = Math.ceil(d.dur * rate), data = new Uint8Array(n * 4), beat = 60 / d.bpm;

    const kick = Math.exp(-ph * 9) * (bar === 3 && ph > .5 ? .3 : 1);

// Controller mode's MAKE STEMS: ZyDeck Connect has the PC's stem server make them for the deck's track (by its id in

// crate) with the track's cues and beat grid. The pad shows how far it is

// library, with the original's cues and beat grid); once they're made, the same pad loads them into this deck
async function remoteStems(d) {
  if (d.rstem?.s === "making" || d.rstem?.s === "loading") return;
  if (d.rstem?.s === "done") return remoteStemsLoad(d);
  const id = d.wfFor;
  if (!REMOTE.http || id == null) { toast("The computer hasn't said which track this is yet"); return; }
  const k = `k=${encodeURIComponent(REMOTE.key || "")}`;
  const set = v => { if (d.wfFor === id) { d.rstem = v; markDirty("deck", d); } };
  set({ s: "making", p: 0 });
  try {
    const r = await (await fetch(`${REMOTE.http}/web/stems?id=${id}&${k}`)).json();
    if (!r.job) throw new Error(r.error || "ZyDeck Connect said no");
    for (;;) {
      await new Promise(res => setTimeout(res, 1500));
      const j = await (await fetch(`${REMOTE.http}/web/job?id=${encodeURIComponent(r.job)}&${k}`)).json();
      if (j.state === "done") { set({ s: "done", job: r.job }); toast("Stems ready (in Mixxx's ZyDeck Web crate): pad 5 loads them"); return; }
      if (j.state === "error" || j.ok === false) throw new Error(j.error || "failed");
      set({ s: "making", p: j.progress || 0 });
    }
  } catch (e) {
    set({ s: "failed", e: e.message });
  }
}

async function remoteStemsLoad(d) {
  const id = d.wfFor, job = d.rstem.job, k = `k=${encodeURIComponent(REMOTE.key || "")}`;
  const set = v => { if (d.wfFor === id) { d.rstem = v; markDirty("deck", d); } };
  set({ s: "loading", job });
  try {   // (Mixxx ZyDeck loads it, as a phone's "load to deck"; not into a playing deck, unless Mixxx allows that)
    const r = await (await fetch(`${REMOTE.http}/web/load?job=${encodeURIComponent(job)}&target=deck${d.n}&${k}`)).json();
    if (!r.job) throw new Error(r.error || "ZyDeck Connect said no");
    for (;;) {
      await new Promise(res => setTimeout(res, 300));
      const j = await (await fetch(`${REMOTE.http}/web/job?id=${encodeURIComponent(r.job)}&${k}`)).json();
      if (j.state === "error") throw new Error(j.error || "failed");
      if (j.state !== "done") continue;
      if (j.result?.loadError) throw new Error(j.result.loadError);
      return;   // (the deck has the stems file now: its stem pads take over)
    }
  } catch (e) {
    toast(`Stems not loaded: ${e.message}`);

  }
}

function loadFxNames() {
  if (REMOTE.on) {
    try { const c = JSON.parse(localStorage.getItem(fxCacheKey()) || "null"); if (Array.isArray(c)) setFxNames(c); else if (c?.effects) setFxNames(c.effects, c.beats); } catch {}

    }).catch(() => {});

// Mixxx's units can start out empty: the effects last used in each slot (S.fxLast, by name), else Echo, Reverb and

  if (part === "all") dirty.all = true;
