<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="/controller.webmanifest">
<link rel="stylesheet" href="/zydeck-menu.css">
<link rel="stylesheet" href="/zydeck-skin-d.css">
<script src="/zydeck-key.js"></script>
<script src="/zydeck-menu.js"></script>
<script src="/zydeck-position.js"></script>
<script src="/zydeck-wave.js"></script>
<script src="/zydeck-knob.js"></script>
<title>Mixxx Controller</title>
<style>
  :root {
    --mm: 5.93px; --bar: calc(var(--mm) * 20); --knob: calc(var(--mm) * 10.5);
    --kcol: calc(var(--knob) + var(--mm) * 3.5);
    --bg: #0b0b0b; --panel: #121212; --pad: #1a1a1a; --edge: #2c2c2c; --text: #e8e8e8; --dim: #767676;
    --deck12: #ff8a1e; --deck34: #38b6ff; --play: #3ddc84; --cue: #f0a23b; --err: #ff5a5f; --fx: #ff7a45; --roll: #38b6ff; --jump: #a47bff;
    --gap: calc(var(--mm) * 1.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--dim); overflow: hidden; overscroll-behavior: none;
    touch-action: none; font: 600 calc(var(--mm) * 2.1)/1.15 -apple-system, "Roboto", sans-serif; }

  button { font: inherit; color: #cfcfcf; background: #1c1c1c; border: 1px solid #333; border-radius: calc(var(--mm) * 1.2); padding: 0; }
  button.on { color: var(--text); border-color: var(--text); background: #2a2a2a; }

  /* ---- layout: top-left bar | mixer (full height) | top-right bar, decks under the bars ---- */
  #app { height: 100%; display: grid; padding: var(--gap); gap: var(--gap) calc(var(--gap) * 1.4);
    grid-template-columns: minmax(0, 1fr) calc(var(--mm) * 30 + 2 * var(--kcol)) minmax(0, 1fr);
    grid-template-rows: calc(var(--bar) - var(--gap)) minmax(0, 1fr);
    grid-template-areas: "tl mix tr" "dl mix dr"; }
  #topL { grid-area: tl; } #topR { grid-area: tr; justify-content: flex-end; }
  #mixwrap { grid-area: mix; display: grid; min-height: 0; }
  #dl { grid-area: dl; } #dr { grid-area: dr; }
  #dl, #dr { display: grid; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: var(--gap); min-width: 0; }
  .topbar .tab { height: calc(var(--mm) * 11); width: calc(var(--mm) * 13.5); font-size: calc(var(--mm) * 2.4); }
  .topbar .note { flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: calc(var(--mm) * 1.9); color: #555; }
  #topknobs { margin-left: auto; }
  /* loop controls for the deck on that side, next to the mixer */
  .loopbox { --acc: var(--deck12); display: flex; gap: calc(var(--mm) * 1); flex: none; }
  .loopbox.d34 { --acc: var(--deck34); }
  .loopbox button { height: calc(var(--mm) * 11); width: calc(var(--mm) * 9); font-size: calc(var(--mm) * 2.8); }
  .loopbox .loop { width: calc(var(--mm) * 16); border-color: var(--acc); color: var(--text); font-size: calc(var(--mm) * 3.4); line-height: 1; }
  .loopbox .loop small { display: block; font-size: calc(var(--mm) * 1.6); color: var(--acc); margin-top: 2px; }
  .loopbox .loop.on { background: var(--play); border-color: var(--play); color: #04200e; }
  .loopbox .loop.on small { color: #04200e; }
  .topbar .knob { width: calc(var(--mm) * 14); }
  #gear { width: calc(var(--mm) * 11); height: calc(var(--mm) * 11); font-size: calc(var(--mm) * 4); }
  /* recording the set: red while it records, with its running time */
  /* a button held for a second job (the FX menu): a light fill rises as the hold counts down */
  .holding { position: relative; overflow: hidden; }
  .holding::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 100%; pointer-events: none;
    background: rgba(255,255,255,.22); transform-origin: bottom; animation: holdfill var(--hold, 1s) linear forwards; }
  @keyframes holdfill { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  #rec { height: calc(var(--mm) * 7); padding: 0 calc(var(--mm) * 1.6); font-size: calc(var(--mm) * 1.9); font-weight: 700; flex: none;
    font-variant-numeric: tabular-nums; }
  #rec.on { border-color: #ff3b30; color: #fff; background: #b3261e; }
  #prof { position: fixed; top: calc(var(--mm) * 1.2); left: 50%; transform: translateX(-50%); z-index: 45; display: flex; align-items: center;
    gap: calc(var(--mm) * 1.2); padding: calc(var(--mm) * .6) calc(var(--mm) * .8) calc(var(--mm) * .6) calc(var(--mm) * 1.6);
    border: 1px solid #ff3b30; border-radius: calc(var(--mm) * 4); background: rgba(20, 8, 8, .92); color: #ff6b61;
    font: 700 calc(var(--mm) * 1.9) system-ui, sans-serif; }
  #prof button { height: calc(var(--mm) * 5.5); min-width: calc(var(--mm) * 7); border-radius: calc(var(--mm) * 3); border: 1px solid #ff6b61;
    background: none; color: #fff; font: inherit; }
  #prof .pm { padding: 0 calc(var(--mm) * 1.6); }
  #rec.wait { border-color: #ff3b30; color: #ff6b61; }
  #gear.live { border-color: var(--play); color: var(--play); }   /* connected to Mixxx */

  .side { --acc: var(--deck12); display: grid; gap: var(--gap); min-width: 0; min-height: 0; }
  .side.d34 { --acc: var(--deck34); }
  .side.left { grid-template-columns: calc(var(--mm) * 13) minmax(0, 1fr); }
  .side.right { grid-template-columns: minmax(0, 1fr) calc(var(--mm) * 13); }
  .side.samples { grid-template-columns: minmax(0, 1fr); }
  .deck { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; min-height: 0; }

  .head { height: calc(var(--mm) * 9); flex: none; display: flex; align-items: center; gap: calc(var(--mm) * 1.2); min-width: 0; }
  .switch { height: 100%; min-width: calc(var(--mm) * 15); display: flex; align-items: center; justify-content: center; gap: calc(var(--mm) * .8);
    border-color: var(--acc); color: var(--acc); font-size: calc(var(--mm) * 3.4); }
  .switch small { font-size: calc(var(--mm) * 1.8); color: var(--dim); }
  /* tablet: both decks named in their own colours, in fixed places; the one on this side bright */
  .switch.pair { flex-direction: row; align-items: center; justify-content: center; gap: calc(var(--mm) * .6);
    white-space: nowrap; line-height: 1; font-size: calc(var(--mm) * 3.6); }
  .switch.pair em { font-style: normal; font-size: 1em; color: var(--text); font-weight: 800; }
  .switch.pair i { font-style: normal; font-size: .7em; color: var(--dim); }
  .switch.pair span { font-size: calc(1em - 2pt); font-weight: 400; opacity: .3; }
  .switch.pair span.on { font-size: 1em; opacity: 1; font-weight: 800; }
  .switch.pair .k12 { color: var(--deck12); }
  .switch.pair .k34 { color: var(--deck34); }
  .title { flex: 1; min-width: 0; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: calc(var(--mm) * 2.3); }
  .title small { color: var(--dim); font-weight: 500; margin-left: calc(var(--mm) * .8); }
  .num { font-variant-numeric: tabular-nums; color: var(--text); font-size: calc(var(--mm) * 2.3); }
  .num.dim { color: var(--dim); }

  /* platter strip: the record unrolled; the cursor is the sticker */
  .strip { flex: 0 0 calc(var(--mm) * 22); position: relative; overflow: hidden; border-radius: calc(var(--mm) * 1.5);
    border: 1px solid #3a3a3a; background:
      repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), #2e2e2e calc(25% - 1px) 25%),
      repeating-linear-gradient(90deg, transparent 0 calc(6.25% - 1px), #1f1f1f calc(6.25% - 1px) 6.25%), #121212; }
  .strip.held { border-color: var(--acc); background-color: #181818; }
  /* the track end warning light (Settings › Screen): a playing track's last 30 s, the strip flashes pink, as Mixxx's
     overview does: once a second, lit for 70 % of it (the time left is inside it, so it doesn't blink as well); its own
     layer's opacity, so nothing is drawn again */
  .endwarn { position: absolute; inset: 0; pointer-events: none; opacity: 0; will-change: opacity; z-index: 3;
    background: rgba(255, 70, 165, .26); box-shadow: inset 0 0 0 2px rgba(255, 95, 175, .9); }
  .ending .endwarn { animation: endwarn 1s step-end infinite; }
  @keyframes endwarn { 0% { opacity: 1; } 70%, 100% { opacity: 0; } }
  .strip .cursor { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--acc); left: 50% !important;
    box-shadow: 0 0 calc(var(--mm) * 1.2) var(--acc); will-change: transform; left: 0; }
  /* waveform of the stretch of record the strip shows (Mixxx's analysis: red lows, green mids, blue highs) */
  /* the waveform's layer: tiles drawn once, slid (and squeezed for tempo) by the compositor, never redrawn per frame */
  .strip .axis { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,.28); pointer-events: none; }
  .strip .wftrack { position: absolute; left: 0; top: 0; width: 0; height: 100%; transform-origin: 0 0; will-change: transform; pointer-events: none; }
  .strip .wftrack .tiles canvas { position: absolute; top: 0; height: 100%; }
  /* Live render: the wave in its own layers (one per stem), scaled for the gain and each stem's mute without drawing */
  .strip .wftrack .wl, .strip .wftrack .sl { position: absolute; left: 0; top: 0; width: 0; height: 100%; transform-origin: 0 50%; }
  .strip .wftrack .sl { transition: transform .12s ease-out; }
  .strip .wftrack .bl { position: absolute; left: 0; top: 0; width: 0; height: 100%; transform-origin: 0 50%; mix-blend-mode: screen; mix-blend-mode: plus-lighter; }
  .strip .cm { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--c); }
  .strip .cm b { position: absolute; left: 1px; bottom: 0; height: var(--tag); line-height: var(--tag); padding: 0 calc(var(--tag) * .3);
    font-size: calc(var(--tag) * .74); font-weight: 700; background: var(--c); color: var(--ink); white-space: nowrap;
    transform: scaleX(var(--inv, 1)); transform-origin: 0 0; }
  .strip .cm.top b { top: 0; bottom: auto; }
  .strip .loop { position: absolute; top: 0; bottom: 0; box-sizing: border-box; margin-left: -1px; background: rgba(255,255,255,.3);
    border-left: 2px solid #bbbbbb; border-right: 2px solid #bbbbbb; }
  .strip .loop.on { background: rgba(0,180,0,.3); border-color: #00b400; }
  .strip .loop b { position: absolute; left: 0; top: 0; width: var(--ltag); height: var(--ltag); line-height: var(--ltag); text-align: center;
    font-size: calc(var(--ltag) * .85); color: #fff; background: #bbbbbb; transform: scaleX(var(--inv, 1)); transform-origin: 0 0; }
  .strip .loop.on b { background: #00b400; }
  /* SLIP, as Mixxx draws it: while the track runs on underneath (a loop, a scratch, CENSOR), the top half shows
     where it is, one-sided on black, in an outline that breathes (25-75 % #e0e0e0 over 1.6 s, fading out below) */
  .strip .slipghost { position: absolute; left: 0; right: 0; top: 0; height: 50%; background: #000; display: none; pointer-events: none;
    --sb: max(2px, calc(var(--mm) * .5)); }
  .strip.slipping .slipghost { display: block; }
  .strip .slipghost .clip { position: absolute; inset: 0; overflow: hidden; }
  .strip .slipghost .edge { position: absolute; left: 0; right: 0; top: 0; height: calc(100% + var(--sb)); animation: slipblink 1.6s linear infinite; }
  .strip .slipghost .edge::before { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: var(--sb); box-sizing: border-box;
    border: var(--sb) solid #e0e0e0; border-bottom: 0; }
  .strip .slipghost .edge::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--sb);
    background: linear-gradient(#e0e0e0, rgba(224,224,224,0)); }
  @keyframes slipblink { 0%, 100% { opacity: .75; } 50% { opacity: .25; } }
  .strip.slipping > .wftrack .cm.top b { top: auto; bottom: 0; }   /* the deck's labels move below, as in Mixxx */
  .strip .played { position: absolute; top: 0; bottom: 0; left: 0; width: 50%; background: rgba(0,0,0,.45); pointer-events: none; }
  .strip .label { position: absolute; left: calc(var(--mm) * 1.2); bottom: calc(var(--mm) * .8); font-size: calc(var(--mm) * 1.7); color: #4a4a4a; }

  .transport { flex: 0 0 calc(var(--mm) * 13); display: grid; grid-template-columns: 1fr 1fr 1fr calc(var(--mm) * 24); gap: var(--gap); }
  .transport button { font-size: calc(var(--mm) * 2.6); }
  .transport .play.on { background: var(--play); border-color: var(--play); color: #04200e; }
  .play.on.preview.nogrid { animation: cueblink .5s steps(1) infinite; }   /* (with a grid: the beat flash below) */
  @keyframes cueblink { 50% { background: transparent; color: var(--play); } }
  .transport .play.on.beatoff { background: transparent; color: var(--play); }
  .pad .ct { position: absolute; bottom: calc(var(--mm) * .7); font: 600 calc(var(--mm) * 1.4)/1 ui-monospace, monospace; opacity: .75; font-style: normal; }
  .pad .ct.l { left: calc(var(--mm) * .9); } .pad .ct.r { right: calc(var(--mm) * .9); }
  .transport .cuebtn.on { background: var(--cue); border-color: var(--cue); color: #1b1206; }
  /* sync: off (glows white as tempos converge) → TEMPO (outlined) → BEAT (filled) */
  .transport .sync { --glow: 0; border-color: rgba(255,255,255, calc(.2 + .8 * var(--glow)));
    box-shadow: 0 0 calc(var(--mm) * 3 * var(--glow)) rgba(255,255,255, calc(.85 * var(--glow))); }
  .transport .sync small { display: block; font-size: calc(var(--mm) * 1.5); }
  .transport .sync.matched { border-color: var(--play); color: var(--play);
    box-shadow: 0 0 calc(var(--mm) * 3) color-mix(in srgb, var(--play) 80%, transparent); }
  .transport .sync.tempo { --glow: 0; border-color: var(--acc); color: var(--acc); box-shadow: none; }
  .transport .sync.beat { --glow: 0; background: var(--acc); border-color: var(--acc); color: #111; box-shadow: none; }
  .transport .sync { padding: 0 3px; }   /* the label 3 px from the edge at least */
  /* synced (filled in the deck's colour): MASTER dark and bold on the leader, faint on the others; never the fill's colour */
  #app .transport .sync.beat .two > small { color: #111 !important; opacity: .35; }
  #app .transport .sync.beat .two > small.on { color: #000 !important; opacity: 1; font-weight: 800 !important; }
  .keybox { display: grid; grid-template-columns: 1fr auto 1fr; gap: calc(var(--mm) * .6); align-items: stretch; }
  .keybox button { font-size: calc(var(--mm) * 3.6); }
  .keybox span { align-self: center; text-align: center; min-width: calc(var(--mm) * 6); color: var(--text); font-size: calc(var(--mm) * 2); }
  .keybox span.shifted { color: var(--acc); }   /* key shifted */
  .keybox span small { display: block; color: var(--dim); font-size: calc(var(--mm) * 1.5); }

  .modes { flex: 0 0 calc(var(--mm) * 8.5); display: flex; gap: calc(var(--mm) * .8); }
  /* the FX strip: always there under the pads, so pads and FX work together */
  .fxstrip { flex: 0 0 calc(var(--mm) * 14); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap);
    border-top: 1px solid #262626; padding-top: calc(var(--mm) * .6); }
  .fxstrip > * { min-width: 0; }
  .fxstrip button { font-size: calc(var(--mm) * 1.8); padding: 0 calc(var(--mm) * .5); overflow: hidden; }
  .fxstrip button small { display: block; font-size: calc(var(--mm) * 1.35); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fxstrip button.on { border-color: var(--fx); color: var(--fx); background: color-mix(in srgb, var(--fx) 14%, #1c1c1c); }
  .fxstrip .beats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .fxstrip .beats button { font-size: calc(var(--mm) * 1.9); padding: 0; }
  .fxstrip .knob { --knob: calc(var(--mm) * 8.5); --acc: #777; justify-content: center; }
  .fxstrip .knob.fxon, .fxstrip .knob.stepped { --acc: var(--fx); }
  .knob .ktick { stroke: #555; stroke-width: 1.4; }
  .fxstrip .knob span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .modes button { flex: 1; font-size: calc(var(--mm) * 2.3); letter-spacing: .02em; }
  /* the pad mode in use: filled in the deck's colour (orange decks 1-2, blue 3-4), as on the phone */
  .modes button.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 22%, #1c1c1c); color: var(--text); }
  .modes button.on small { color: color-mix(in srgb, var(--acc) 70%, #fff); }
  .modes button.on.beatoff, #app.phone .prow.modes button.on.beatoff { background: #1c1c1c; border-color: color-mix(in srgb, var(--acc) 35%, #333); }   /* (keeping the beat: the half that's dark) */
  .tempo .shift { flex: 0 0 calc(var(--mm) * 11); font-size: calc(var(--mm) * 1.7); }
  .tempo .shift.on { background: var(--err); border-color: var(--err); color: #fff; }
  .tempo .shift.idle { opacity: .35; }            /* SHIFT only does something in CUE and FX modes */

  .pads { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
  .pads.grid16 { grid-template-rows: repeat(4, minmax(0, 1fr)); }
  .pad { position: relative; overflow: hidden; border-radius: calc(var(--mm) * 1.5); background: var(--pad); border: 1px solid var(--edge);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #8a8a8a;
    font-size: calc(var(--mm) * 2.9); font-weight: 800; line-height: 1.05; transition: transform 40ms; }
  .pad small { font-size: calc(var(--mm) * 1.5); font-weight: 600; opacity: .8; margin-top: 2px; }
  .pad .m { position: absolute; right: calc(var(--mm) * 1); top: calc(var(--mm) * .7); font-size: calc(var(--mm) * 1.7); opacity: .75; }
  .padveil { position: fixed; inset: 0; z-index: 29; }
  .pad.asknob { display: flex; align-items: center; justify-content: center; background: #121212; }
  .pad.asknob .knob { --knob: calc(var(--mm) * 9); }
  .pad.asknob .knob { --acc: #777; }
  .pad.asknob .knob.fxon { --acc: var(--fx); }
  .pad.asknob .knob span { color: var(--text); font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pad .fxname { display: block; font-size: calc(var(--mm) * 1.5); font-weight: 600; max-width: 95%; margin: 0 auto; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .padopts { position: fixed; z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--mm) * .8);
    padding: calc(var(--mm) * 1.2); width: calc(var(--mm) * 52); background: #151515; border: 1px solid #444;
    border-radius: calc(var(--mm) * 1.6); box-shadow: 0 10px 28px rgba(0,0,0,.65); }
  .padopts .t { grid-column: 1 / -1; color: var(--text); font-size: calc(var(--mm) * 2); padding: 0 calc(var(--mm) * .4); }
  .padopts .t small { color: var(--dim); font-size: calc(var(--mm) * 1.6); margin-left: calc(var(--mm) * 1); font-weight: 500; }
  .padopts button { height: calc(var(--mm) * 8.5); font-size: calc(var(--mm) * 1.8); }
  .padopts button.on { border-color: var(--cue); color: var(--cue); background: color-mix(in srgb, var(--cue) 12%, #1c1c1c); }
  .padopts .wide2 { grid-column: span 2; }
  .padopts .full { grid-column: 1 / -1; height: calc(var(--mm) * 6.5) !important; }
  .padopts button small { display: block; font-size: calc(var(--mm) * 1.4); opacity: .8; margin-top: calc(var(--mm) * .3); }
  .padopts .clear { color: var(--err); }
  .pad .n { position: absolute; left: calc(var(--mm) * 1); top: calc(var(--mm) * .8); font-size: calc(var(--mm) * 1.6); opacity: .6; }
  .pad.lit { background: var(--c); border-color: var(--c); color: var(--fg, #111); }
  .pad.tint { background: color-mix(in srgb, var(--c) 15%, var(--pad)); border-color: color-mix(in srgb, var(--c) 45%, var(--edge)); color: color-mix(in srgb, var(--c) 80%, #ddd); }
  .pad.off { opacity: .3; }
  .pad.armed { outline: 3px dashed var(--err); outline-offset: -5px; }
  .pad.down { background: #fff !important; border-color: #fff !important; color: #111 !important; transform: scale(.97); }

  /* tempo: a touchpad lane, no jump */
  .tempo { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  .ol { flex: 0 0 calc(var(--mm) * 9); font-size: calc(var(--mm) * 1.7); }
  .ol.on { background: var(--err); border-color: var(--err); color: #fff; }
  .lane { flex: 1; position: relative; border-radius: calc(var(--mm) * 1.5); border: 1px solid #333; background:
      repeating-linear-gradient(0deg, transparent 0 calc(var(--tick) - 1px), #262626 calc(var(--tick) - 1px) var(--tick)), #121212;
    --tick: 6.25%; overflow: hidden; }
  .lane.held { border-color: var(--acc); }
  .lane.locked { opacity: .45; }
  .lane .lock { position: absolute; left: 0; right: 0; top: 50%; margin-top: calc(var(--mm) * 2); text-align: center;
    font-size: calc(var(--mm) * 1.5); color: var(--acc); letter-spacing: .05em; }
  .lane .zero { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #4a4a4a; }
  .lane .mark { position: absolute; left: 12%; right: 12%; height: calc(var(--mm) * 2.2); margin-top: calc(var(--mm) * -1.1); top: 50%;
    border-radius: 3px; background: var(--acc); will-change: top; }
  .lane .end { position: absolute; left: 0; right: 0; text-align: center; font-size: calc(var(--mm) * 1.5); color: #555; }
  .lane .end.t { top: calc(var(--mm) * .6); } .lane .end.b { bottom: calc(var(--mm) * .6); }
  .tread { flex: 0 0 calc(var(--mm) * 6); text-align: center; color: var(--text); font-size: calc(var(--mm) * 1.9); font-variant-numeric: tabular-nums; }
  .tread.over { color: var(--err); }

  /* ---- strips on top (S.layout "stacked"): both platter strips across the top, as Mixxx stacks its
     waveforms, and the top-bar controls in the side columns. 3 mm of screen stay above the top strip, so a
     finger sliding off its top edge is still on the glass (and lifting there counts as off the strip). ---- */
  #stack { display: none; }
  #app.stacked { grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top top" "dl mix dr"; }
  #app.stacked #topL, #app.stacked #topR { display: none; }
  #app.stacked #stack { grid-area: top; display: grid; column-gap: var(--gap);
    grid-template-columns: calc(var(--mm) * 40) minmax(0, 1fr) calc(var(--mm) * 40);
    grid-template-rows: calc(var(--mm) * 7) calc(var(--mm) * 19) var(--gap) calc(var(--mm) * 19) calc(var(--mm) * 7);
    grid-template-areas: "sl n0 sr" "sl s0 sr" "sl . sr" "sl s1 sr" "sl n1 sr"; }
  #sideL { grid-area: sl; } #sideR { grid-area: sr; } #strip0 { grid-area: s0; } #strip1 { grid-area: s1; }
  #nudge0 { grid-area: n0; } #nudge1 { grid-area: n1; }
  #nudge0, #nudge1 { display: grid; min-width: 0; }
  /* nudge bar on the outer edge of each strip, like a jog wheel's edge: drag it to bend the tempo */
  .nudge { --acc: var(--deck12); position: relative; overflow: hidden; border: 1px solid #333; background-color: #0f0f0f;
    background-image: repeating-linear-gradient(90deg, #2c2c2c 0 1px, transparent 1px calc(var(--mm) * 2));
    background-position: var(--off, 0px) 0; display: flex; align-items: center; justify-content: center;
    color: #4a4a4a; font-size: calc(var(--mm) * 1.6); letter-spacing: .08em; white-space: nowrap; }
  .nudge.d34, .strip.d34 { --acc: var(--deck34); }
  #nudge0 .nudge { border-radius: calc(var(--mm) * 1.5) calc(var(--mm) * 1.5) 0 0; border-bottom-color: #222; }
  #nudge1 .nudge { border-radius: 0 0 calc(var(--mm) * 1.5) calc(var(--mm) * 1.5); border-top-color: #222; }
  #strip0 .strip { border-top-left-radius: 0; border-top-right-radius: 0; }
  #strip1 .strip { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .nudge.held { border-color: var(--acc); color: var(--acc); }
  .nudge.loopmove { color: var(--play); }
  .flags { --acc: var(--deck12); display: flex; gap: calc(var(--mm) * 1); flex: 1; }
  .flags.d34 { --acc: var(--deck34); }
  .flags button { flex: 1; height: calc(var(--mm) * 7.5); font-size: calc(var(--mm) * 1.7); letter-spacing: .03em; }
  .flags button.on { border-color: var(--acc); color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, #1c1c1c); }
  .loopbox button small { display: block; font-size: calc(var(--mm) * 1.3); color: var(--dim); }
  .loopbox button.adj { background: var(--play); border-color: var(--play); color: #04200e; }
  .loopbox button.adj small { color: #04200e; }
  #sideL, #sideR { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  #sideR .topbar { justify-content: flex-end; }
  #strip0, #strip1 { display: grid; min-width: 0; min-height: 0; }
  #app.stacked .topbar .tab { width: calc(var(--mm) * 12); height: calc(var(--mm) * 10.5); font-size: calc(var(--mm) * 2.2); }
  #app.stacked #gear { width: calc(var(--mm) * 10); height: calc(var(--mm) * 10.5); flex: none; }
  /* both side columns: the same rows at the same heights, so the SAMPLES buttons (and the rest) line up */
  #sideL > .topbar:first-child, #sideR > .topbar:first-child { height: calc(var(--mm) * 13); flex: none; }
  #app.stacked .loopbox button { height: calc(var(--mm) * 10.5); }
  #app.stacked .topbar .knob { width: calc(var(--mm) * 12); }
  #app.stacked .topbar .switch { height: calc(var(--mm) * 10.5); flex: 1; }
  #app.stacked .topbar .switch.narrow { flex: 0 0 calc(var(--mm) * 15); min-width: 0; }
  #app .switch.pair.narrow { font-size: calc(var(--mm) * 2.5); gap: calc(var(--mm) * .35); }   /* "Deck 1⇆3" in 15 mm */
  .smpbtn { flex: 1; height: calc(var(--mm) * 9); line-height: 1.05; font-size: calc(var(--mm) * 2); letter-spacing: .04em; }
  .smpbtn i { font-style: normal; font-weight: 400; }
  .smpbtn small { display: block; font-size: calc(var(--mm) * 1.4); font-weight: 500; color: var(--dim); margin-top: 1px; }
  .smpbtn .dimmed { opacity: .4; }
  .smpbtn small.lit { color: var(--text); }
  .smpbtn.on { border-color: var(--play); color: var(--play); background: color-mix(in srgb, var(--play) 14%, #1c1c1c); }
  .smpbtn.on small.lit { color: var(--play); }
  #app:not(.stacked) .smpbtn { flex: 0 0 auto; height: calc(var(--mm) * 11); padding: 0 calc(var(--mm) * 2); }
  .topbar .sshift { flex: 1; height: calc(var(--mm) * 10.5); font-size: calc(var(--mm) * 2.2); }
  .sshift.on { background: var(--err); border-color: var(--err); color: #fff; }
  #app.stacked .side.left { grid-template-columns: calc(var(--mm) * 13) minmax(0, 1fr); }
  #app.stacked .side.samples { grid-template-columns: minmax(0, 1fr); }   /* the sampler page: just its 16 pads */
  /* shorter mixer: the EQ columns run the full height, the crossfader sits under the two channel faders */
  #app.stacked #mixer > :nth-child(1) { grid-area: 1 / 1 / 3 / 2; }
  #app.stacked #mixer > :nth-child(2) { grid-area: 1 / 2 / 2 / 3; }
  #app.stacked #mixer > :nth-child(3) { grid-area: 1 / 3 / 2 / 4; }
  #app.stacked #mixer > :nth-child(4) { grid-area: 1 / 4 / 3 / 5; }
  #app.stacked #xf { grid-area: 2 / 2 / 3 / 4; }
  #app.stacked #xf .rail { left: calc(var(--mm) * 3); right: calc(var(--mm) * 3); }
  .strip .info { position: absolute; left: calc(var(--mm) * 1.2); right: calc(var(--mm) * 1.2); top: calc(var(--mm) * .5);
    display: flex; gap: calc(var(--mm) * 1.5); align-items: baseline; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .strip .info .title { font-size: calc(var(--mm) * 2); pointer-events: auto; }   /* held (paused): unload */
  .strip .info .num { font-size: calc(var(--mm) * 2); }
  .num.keynum { color: var(--dim); } .num.keynum.shifted { color: var(--acc); }   /* lit: shifted from the track's own key */
  /* the key's colour bar (as Mixxx's): the key you hear, and as it drifts off it (tempo without key lock) the key a
     semitone that way creeping in, top for up, bottom for down: all one colour is in tune */
  .num.keynum .kbar { display: inline-block; width: calc(var(--mm) * .7); height: .95em; margin-right: .35em; vertical-align: -.1em;
    border-radius: 1px; background: linear-gradient(var(--kt) 0 var(--ks), var(--kb) var(--ks) 100%); }
  .num.keynum .kbar[hidden] { display: none; }

  /* ---- mixer ---- */
  #mixer { display: grid; grid-template-columns: var(--kcol) minmax(0, 1fr) minmax(0, 1fr) var(--kcol);
    grid-template-rows: minmax(0, 1fr) calc(var(--mm) * 15); gap: var(--gap); padding: var(--gap); border-radius: calc(var(--mm) * 2);
    background: var(--panel); border: 1px solid #222; min-height: 0; }
  .chan { --acc: var(--deck12); display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-height: 0; }
  .chan.d34 { --acc: var(--deck34); }
  .chan .pfl { width: 100%; flex: 0 0 calc(var(--mm) * 9); font-size: calc(var(--mm) * 2); }
  .chan .pfl.on { background: var(--cue); border-color: var(--cue); color: #1b1206; }
  .fader.muted .cap { background: var(--err); border-color: var(--err); }
  .knob { --acc: inherit; display: flex; flex-direction: column; align-items: center; width: 100%; touch-action: none; }
  .knob svg { width: var(--knob); height: var(--knob); overflow: visible; }
  .topbar .knob svg { width: calc(var(--mm) * 10.5); height: calc(var(--mm) * 10.5); }   /* top bar knobs stay fixed */
  .knob .kbg { fill: #222; stroke: #3a3a3a; stroke-width: 1.5; }
  .knob .ktrack { fill: none; stroke: #2e2e2e; stroke-width: 3; stroke-linecap: round; }
  .knob .karc { fill: none; stroke: var(--acc, var(--text)); stroke-width: 3; stroke-linecap: round; }
  .knob.centred .ktrack { stroke: color-mix(in srgb, var(--acc, var(--text)) 55%, #2e2e2e); }   /* on its centre: the ring lit */
  body.kc-dark .knob.centred .ktrack { stroke: #161616; }                                           /* (Look › Knob at centre: dark) */
  .knob .kptr { stroke: #eee; stroke-width: 3; stroke-linecap: round; }
  .knob span { font-size: calc(var(--mm) * 1.55); color: var(--dim); margin-top: calc(var(--mm) * .3); }
  .knob.held .kbg { stroke: var(--acc, var(--text)); }
  /* protractor shown around a knob while spinning it: ring at the finger's radius, 15° ticks, ray to the finger */
  .protractor { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 8; overflow: visible; }
  .protractor .ring { fill: none; stroke: rgba(255,255,255,.4); stroke-width: 1.2; stroke-dasharray: 4 5; }
  .protractor .comet { stroke-width: 2.6; stroke-linecap: round; }
  .protractor .ray { stroke: var(--acc, #fff); stroke-width: 1.5; opacity: .75; }
  .protractor .ray.dead { opacity: .2; }
  .topbar .knob { --acc: #ddd; }

  .fader { --acc: var(--deck12); position: relative; min-height: 0; }
  .fader.d34 { --acc: var(--deck34); }
  .fader .rail { position: absolute; left: 50%; top: calc(var(--mm) * 3); bottom: calc(var(--mm) * 3); width: calc(var(--mm) * .9);
    margin-left: calc(var(--mm) * -.45); border-radius: 3px; background: #050505; border: 1px solid #333; }
  .fader .ticks { position: absolute; left: 12%; right: 12%; top: calc(var(--mm) * 3); bottom: calc(var(--mm) * 3);
    background: repeating-linear-gradient(180deg, #2a2a2a 0 1px, transparent 1px 10%); }
  .fader .cap { position: absolute; left: 6%; right: 6%; height: calc(var(--mm) * 6); border-radius: calc(var(--mm) * .9);
    background: #d8d8d8; border: 1px solid #fff; will-change: top; }
  .fader .cap::after { content: ""; position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; margin-top: -1px; background: var(--acc); }
  .fader .lbl { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; color: var(--acc); font-size: calc(var(--mm) * 1.8); }
  .fader.held .cap { background: #fff; box-shadow: 0 0 calc(var(--mm) * 1.2) var(--acc); }
  #xf { grid-column: 1 / -1; position: relative; }
  #xf .rail { position: absolute; top: 50%; left: calc(var(--mm) * 4); right: calc(var(--mm) * 4); height: calc(var(--mm) * .9);
    margin-top: calc(var(--mm) * -.45); border-radius: 3px; background: #050505; border: 1px solid #333; }
  #xf .cap { position: absolute; top: 12%; bottom: 12%; width: calc(var(--mm) * 6); border-radius: calc(var(--mm) * .9);
    background: #d8d8d8; border: 1px solid #fff; will-change: left; }
  #xf.held .cap { background: #fff; box-shadow: 0 0 calc(var(--mm) * 1.2) #fff; }
  #xf .mid { position: absolute; left: 50%; top: 18%; bottom: 18%; width: 1px; background: #444; }

  /* unload: the eject sign, the waveform's height, beside the title; and its question */
  .strip .ejecticon { position: absolute; top: 4%; bottom: 4%; aspect-ratio: 1; opacity: 0; transition: opacity .5s; pointer-events: none; z-index: 4; }
  .strip .ejecticon.on { opacity: .92; }
  .strip .ejecticon.armed { pointer-events: auto; cursor: pointer; }   /* after the hold: tap it to unload */
  .strip .ejecticon svg { width: 100%; height: 100%; fill: var(--text); filter: drop-shadow(0 0 calc(var(--mm) * .8) rgba(0,0,0,.8)); }
  .unloadscrim { position: fixed; inset: 0; z-index: 48; background: rgba(0,0,0,.55); }
  #unloadask { position: fixed; z-index: 49; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(90vw, calc(var(--mm) * 80));
    background: #151515; border: 1px solid #333; border-radius: calc(var(--mm) * 2); padding: calc(var(--mm) * 3); display: grid; gap: calc(var(--mm) * 1.6); }
  #unloadask .t { font-size: calc(var(--mm) * 3); font-weight: 700; }
  #unloadask .sub { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #unloadask .dont { display: flex; align-items: center; gap: calc(var(--mm) * 1); color: var(--text); }
  #unloadask .dont small { color: var(--dim); }
  #unloadask .dont input { width: calc(var(--mm) * 3.5); height: calc(var(--mm) * 3.5); }
  #unloadask .seg { display: flex; gap: calc(var(--mm) * 1); }
  #unloadask .seg button { flex: 1; height: calc(var(--mm) * 7.5); }
  #unloadask .yes { background: var(--err); border-color: var(--err); color: #fff; }

  /* ---- phone (?phone=1): one phone held sideways, inside the phone page (portrait there is the library) ----
     tempo lanes on the outer edges (full height), both strips across the top, under them deck | mixer | deck. */
  #app.phone { --gap: calc(var(--mm) * 1); padding: calc(var(--mm) * .8); gap: var(--gap); grid-template-areas: none;
    grid-template-columns: calc(var(--mm) * 9) minmax(0, 1fr) calc(var(--mm) * 9); grid-template-rows: minmax(0, 1fr); }
  #app.phone .pcol { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  #app.phone .pcol .lane { flex: 1; }
  #app.phone .pcol .gearspace { flex: 0 0 calc(var(--mm) * 7); }   /* the right fader as long as the left (under ⚙) */
  #app.phone .pcol button { flex: 0 0 calc(var(--mm) * 7); width: 100%; height: auto; font-size: calc(var(--mm) * 1.5); }
  #app.phone #gear { font-size: calc(var(--mm) * 3.2); }
  #app.phone .lane .tread { position: absolute; left: 0; right: 0; bottom: 16%; font-size: calc(var(--mm) * 1.5); }
  #app.phone .pmid { display: grid; min-width: 0; min-height: 0; gap: var(--gap);
    grid-template-rows: calc(var(--mm) * 2) calc(var(--mm) * 10) calc(var(--mm) * 10) minmax(0, 1fr); }
  #app.phone .pmid > .strip { height: auto; min-height: 0; }
  #app.phone .strip .info { left: calc(var(--mm) * 8.5); top: calc(var(--mm) * .3); }
  #app.phone .strip .info .title, #app.phone .strip .info .num { font-size: calc(var(--mm) * 1.8); }
  #app.phone .strip .label { display: none; }
  #app.phone .psw { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--mm) * 7.5); z-index: 2; border: 0;
    border-right: 1px solid #333; border-radius: 0; background: rgba(0,0,0,.6); color: var(--acc); font-size: calc(var(--mm) * 2.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  #app.phone .psw small { font-size: calc(var(--mm) * 1.4); color: var(--dim); margin-top: 2px; }
  #app.phone .lower { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: calc(var(--mm) * 1.2); min-height: 0; }
  #app.phone .pdeck { --acc: var(--deck12); display: grid; grid-template-rows: calc(var(--mm) * 5) 7.6fr 11.1fr 7.3fr 10fr;
    gap: var(--gap); min-width: 0; min-height: 0; }
  #app.phone .pdeck .nudge { border-radius: calc(var(--mm) * 1.2); font-size: calc(var(--mm) * 1.3); }
  #app.phone .nudge.d34 { --acc: var(--deck34); }
  /* two-function controls: the main function big, the SHIFT function small and dimmed (lit while it applies) */
  #app.phone { --tab: #3d8bff; }
  #app.phone .prow button small, #app.phone .knob span small { display: block; font-size: calc(var(--mm) * 1.35); color: var(--dim);
    font-weight: 600; letter-spacing: .02em; margin-top: 1px; }
  #app.phone .dimmed { opacity: .35; }
  #app.phone small.lit { color: var(--text) !important; }
  #app.phone .prow.modes button.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 22%, #1c1c1c); color: var(--text); }
  #app.phone .prow.modes button.on small { color: color-mix(in srgb, var(--acc) 70%, #fff); }
  #app.phone .sync.beat small { color: rgba(0,0,0,.55); }
  #app.phone .sync.beat small.lit { color: #000 !important; }
  #app.phone .pdeck.d34 { --acc: var(--deck34); }
  #app.phone .prow { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); min-height: 0; flex: none; }
  #app.phone .prow.modes { grid-template-columns: 1fr 1fr 1fr; }
  #app.phone .prow button { font-size: calc(var(--mm) * 2.3); }
  #app.phone .prow.modes button { font-size: calc(var(--mm) * 1.8); }
  #app.phone .pdeck .pads { grid-template-rows: minmax(0, 1fr); }
  #app.phone .pdeck .shift.on { background: var(--err); border-color: var(--err); color: #fff; }
  #app.phone #mixer { grid-template-columns: calc(var(--mm) * 10) calc(var(--mm) * 8) calc(var(--mm) * 8) calc(var(--mm) * 10);
    grid-template-rows: minmax(0, 1fr) calc(var(--mm) * 6.5); padding: calc(var(--mm) * .4) calc(var(--mm) * .8); gap: calc(var(--mm) * .8); }
  #app.phone .chan .pfl { flex-basis: calc(var(--mm) * 7); }
  #app.phone .knob span { font-size: calc(var(--mm) * 1.4); }

  /* tap a deck's BPM: the beat grid editor */
  .bpmtap { pointer-events: auto; text-decoration: underline dotted rgba(255,255,255,.35); text-underline-offset: 3px; }
  #asktext { position: fixed; z-index: 47; left: 50%; top: 22%; transform: translateX(-50%); width: min(92vw, calc(var(--mm) * 80));
    background: #151515; border: 1px solid #555; border-radius: calc(var(--mm) * 1.6); padding: calc(var(--mm) * 2);
    box-shadow: 0 12px 36px rgba(0,0,0,.7); color: var(--text); font-size: calc(var(--mm) * 2); }
  #asktext input { width: 100%; box-sizing: border-box; margin-top: calc(var(--mm) * 1.2); height: calc(var(--mm) * 7);
    font-size: calc(var(--mm) * 2.2); background: #0d0d0d; color: var(--text); border: 1px solid #444; border-radius: calc(var(--mm) * 1); padding: 0 calc(var(--mm) * 1.2); }
  #asktext .b { display: flex; gap: calc(var(--mm) * 1.2); margin-top: calc(var(--mm) * 1.6); }
  #asktext .b button { flex: 1; height: calc(var(--mm) * 7); }
  #fxmenu { position: fixed; z-index: 47; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(94vw, calc(var(--mm) * 110));
    max-height: 88vh; display: flex; flex-direction: column; gap: calc(var(--mm) * 1.2); background: #151515; border: 1px solid var(--fx);
    border-radius: calc(var(--mm) * 1.6); padding: calc(var(--mm) * 2); box-shadow: 0 12px 36px rgba(0,0,0,.7); color: var(--text);
    font-size: calc(var(--mm) * 2); }
  #fxmenu .t { font-weight: 700; }
  #fxmenu .seg { display: flex; gap: calc(var(--mm) * .8); }
  #fxmenu .seg button { flex: 1; height: calc(var(--mm) * 6.5); }
  #fxmenu .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--mm) * 24), 1fr)); gap: calc(var(--mm) * .8);
    overflow-y: auto; min-height: 0; }
  #fxmenu .list button { height: calc(var(--mm) * 6.5); font-size: calc(var(--mm) * 1.9); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #fxmenu button.on { border-color: var(--fx); color: var(--fx); background: color-mix(in srgb, var(--fx) 14%, #1c1c1c); }
  #fxmenu small { color: var(--dim); }
  .pad .lbl { display: block; font-size: calc(var(--mm) * 1.5); font-weight: 600; opacity: .85; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 95%; margin: 0 auto; }
  #linkask { position: fixed; z-index: 45; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, calc(var(--mm) * 80));
    background: #151515; border: 1px solid #3a6ea5; border-radius: calc(var(--mm) * 1.6); padding: calc(var(--mm) * 2.2);
    box-shadow: 0 12px 36px rgba(0,0,0,.7); color: var(--text); font-size: calc(var(--mm) * 2); line-height: 1.35; }
  #linkask small { display: block; color: var(--dim); font-size: calc(var(--mm) * 1.6); margin-top: calc(var(--mm) * .8); }
  #linkask .b { display: flex; gap: calc(var(--mm) * 1.2); margin-top: calc(var(--mm) * 2); }
  #linkask .b button { flex: 1; height: calc(var(--mm) * 8); font-size: calc(var(--mm) * 2); }
  #linkask .b .go { border-color: #3a6ea5; color: #8cc4ff; }

// Keys as Mixxx numbers them: 1-12 = C..B major, 13-24 = C..B minor, 0 = none.

// A key's colour: round the Camelot wheel, as the library's key chips (one hue per number, minor and major alike)

}

const setHTML = (el, html) => {

const setText = (el, t) => { if (el._text !== t) { el._text = t; el.textContent = t; } };

function applySettings() {

  r.setProperty("--mm", S.pxmm + "px");

// The look (zydeck-skin-d.js): Hardware over Element, or Element as it is

// =====================================================================================================
// Simulated Mixxx state (replaced by the real connection later)
// =====================================================================================================
const CUE_COLORS = [0xc50a08, 0x32be44, 0x0044ff, 0xf8d200, 0x42d4f4, 0xaf00cc, 0xfca6d7, 0xf2f2ff];
const STEMS = [{ n: "Vocals", c: "#56B4E9" }, { n: "Other", c: "#CC79A7" }, { n: "Bass", c: "#D55E00" }, { n: "Drums", c: "#009E73" }];

const stemFxPad = (d, k) => d.mode === "stem" && d.sc >= 4 && live && !REMOTE.on && (PHONE ? d.shift && k < 4 : k >= 4)
  ? (PHONE ? k : k - 4) : -1;
function stemFx(d, i) {
  fetch(`/api/stemfx?deck=${d.n}&fx=${i}`).then(r => r.json()).then(j => { if (!j.ok) toast(j.error || "Stem FX failed"); })
    .catch(() => {});

const DEMO = [["Demo track one", "Artist A", 128, 245], ["Second demo", "Artist B", 126, 312],

const decks = DEMO.map(([title, artist, bpm, dur], i) => ({
  n: i + 1, title, artist, bpm, dur, pos: 20 + i * 7, playing: false, grabbed: false,

const master = { main: .8, phones: .6, mix: .5, xf: .5 };
const sides = [0, 1];                    // deck index shown on the left / right side (0↔2, 1↔3)
// What each side shows: its deck, or sampler pads (left 1-16, right 17-32), switched on its own so the other
// side stays a deck.
const sidePage = ["deck", "deck"];

const sideBank = [0, 1];

function buildFxStrip(s, u) {

      knobs.forEach((k, j) => {
        k.classList.toggle("fxon", !!f.enabled[j]);
        setHTML(k.querySelector("span"), `${f.enabled[j] ? "● " : ""}${fxName(unit(), j).replace(/</g, "&lt;")}`);

    bindPress(name, holdOrTap(() => fxMenu(s), () => fxCycle(deckOf(s), unit(), 0, deckOf(s).shift ? -1 : 1), name, FX_HOLD_MS));
    // BEAT: a knob that snaps from ⅛ to 8 beats, a tick for each step

    let lastStep = -1;
    const beats = knob("BEAT", () => beatIdx() / (FX_BEAT_STEPS.length - 1), v => {
      const i = Math.round(v * (FX_BEAT_STEPS.length - 1));

    }, null);

    FX_BEAT_STEPS.forEach((_, i) => {
      const a = -135 + i / (FX_BEAT_STEPS.length - 1) * 270, [x1, y1] = polar(a, 15), [x2, y2] = polar(a, 18);
      const t = document.createElementNS("http://www.w3.org/2000/svg", "line");
      t.setAttribute("x1", x1); t.setAttribute("y1", y1); t.setAttribute("x2", x2); t.setAttribute("y2", y2); t.setAttribute("class", "ktick");
      svg.appendChild(t);
    });
    bindPress(on, down => {
      if (!down) return;

      setCtl(fxSlotG(un, 0), "enabled", f.enabled[0]);
      if (f.enabled[0]) { fxRoute(d, un); for (const j of [1, 2]) if (f.enabled[j]) { f.enabled[j] = 0; setCtl(fxSlotG(un, j), "enabled", 0); } }
      schedulePaint();
    });
    el.append(name, beats, on, level);
    u.fx.paint = () => {
      const un = unit(), f = fxState[un - 1];
      setHTML(name, `${fxName(un, 0).replace(/</g, "&lt;")}<small>${deckOf(s).shift ? "◀ previous" : "next effect ▶"}</small>`);
      setHTML(beats.querySelector("span"), `BEAT ${beatText(fxBeat[un - 1])}`);

// Tempo lane, TEMPO BOOST and SHIFT for side s (both layouts).
function tempoControls(s, u, olLabel) {
  u.ol = h("button", "ol", olLabel);
  bindPress(u.ol, down => { if (!down) return; const d = deckOf(s); d.ol = !d.ol;
    if (!d.ol && Math.abs(d.tempo) > 8) { d.tempo = clamp(d.tempo, -8, 8); send("tempo", d.n, d.tempo); }
    paintSide(s); });
  u.lane = h("div", "lane", `<div class="end t"></div><div class="zero"></div><div class="mark"></div><div class="lock"></div><div class="end b"></div>`);
  u.tread = h("div", "tread");
  shiftButton(s, u);
  drag(u.lane, {
    // Touchpad: only the change in finger position counts, wherever you touch.
    down: e => { if (synced(deckOf(s))) return false;   // a synced deck follows the master's tempo
      u.lane.classList.add("held"); u.laneDeck = deckOf(s); return { y: e.clientY, deck: u.laneDeck }; },
    move: (e, st) => {
      const dmm = (e.clientY - st.y) / S.pxmm;
      st.y = e.clientY;
      // linear; TEMPO BOOST widens it to -99 % .. +300 %
      const d = st.deck;
      d.tempo = clamp(d.tempo + dmm * S.sens * (S.fasterDown ? 1 : -1), d.ol ? -99 : -8, d.ol ? 300 : 8);
      send("tempo", st.deck.n, st.deck.tempo);

// SHIFT for side s. Held: a momentary SHIFT, like a controller's. Tapped: it stays on until the next tap (or
// until it's used). Each side's SHIFT is its own.
function shiftButton(s, u, cls = "shift") {
  u.shiftBtn = h("button", cls, "SHIFT");
  let shiftAt = 0, wasOn = false;
  bindPress(u.shiftBtn, down => {
    const d = deckOf(s);
    if (down) {
      shiftAt = performance.now(); wasOn = d.shift;
      if (!wasOn) setShift(s, true);
    } else if (wasOn || performance.now() - shiftAt > 350) setShift(s, false);
    paintAll();
  });
  return u.shiftBtn;
}

// SAMPLES 1-16 / 17-32 on both sides: green while that side shows pads; the SHIFT bank on a dimmed second line,
// lit while either SHIFT is on (or while that side shows it).
const BANKS = ["1–16", "17–32"];
function paintSamplesButtons() {
  const shifted = deckOf(0).shift || deckOf(1).shift;
  [0, 1].forEach(s => {
    const b = ui.loops?.[s]?.smp;
    if (!b) return;
    const on = sidePage[s] === "samples", alt = on && sideBank[s] !== s;
    b.classList.toggle("on", on);
    setHTML(b, two(`SAMPLES <i>${BANKS[s]}</i>`, `⇧ ${BANKS[1 - s]}`, shifted || alt));
  });
}

// With both sides on sampler pads the two SHIFTs are one (the 32 pads are one grid); otherwise each has its own.
function setShift(s, on) {
  if (sidePage[0] === "samples" && sidePage[1] === "samples") [0, 1].forEach(t => deckOf(t).shift = on);
  else deckOf(s).shift = on;
}

// Sampler pads (the samples page, and SAMPLER pad mode). With the deck's SHIFT: an empty pad captures the deck's
// loop into it (just the stems it's playing); a loaded one starts or stops following the master tempo.
const samplerSync = new Array(64).fill(false);
const samplerKeylock = new Array(64).fill(true);   // [SamplerN],keylock: the pitch stays when it follows the tempo
// Pad modes (kept by Zydek's server, the same on every page): "oneshot" plays to the end, a tap restarts it;
// "hold" plays while held; "loop" starts and stops on alternate taps (in time when it follows the tempo).
const samplerModes = new Array(64).fill("oneshot");
const MODE_MARK = { oneshot: "▶", hold: "■", loop: "↻" };
const push = (g, k) => { setCtl(g, k, 1); setCtl(g, k, 0); };
function samplerPress(d, i, down, el) {
  if (d.shift) {   // SHIFT: an empty pad captures the deck's loop; a loaded one opens its options
    if (!down) return;
    if (sidePage[0] === "samples" && sidePage[1] === "samples") setShift(0, false); else d.shift = false;
    if (!samplers[i].state) captureInto(d, i); else padOptions(i, el);
    paintAll();
    return;
  }
  if (!live) { if (down) samplerTap(i); return; }
  const g = `[Sampler${i + 1}]`, mode = samplerModes[i];
  if (!samplers[i].state) return send("pad", 0, i, down);
  if (mode === "hold") return push(g, down ? "cue_gotoandplay" : "cue_gotoandstop");
  if (!down) return;
  if (mode === "loop" && samplers[i].state === 2) return push(g, "cue_gotoandstop");
  push(g, "cue_gotoandplay");
}
// A loaded pad's options, next to it: its mode, following the master tempo, clearing it.
function padOptions(i, anchor) {
  document.querySelector(".padopts")?.remove(); document.querySelector(".padveil")?.remove();
  const veil = h("div", "padveil"), box = h("div", "padopts"), g = `[Sampler${i + 1}]`;
  const close = () => { box.remove(); veil.remove(); };
  veil.addEventListener("pointerdown", e => { e.stopPropagation(); close(); });
  box.append(h("div", "t", `Pad ${i + 1}<small>${samplers[i].name || ""}</small>`));
  [["oneshot", "▶ ONE-SHOT"], ["hold", "■ HOLD"], ["loop", "↻ LOOP"]].forEach(([m, label]) => {
    const b = h("button", samplerModes[i] === m ? "on" : "", label);
    bindPress(b, down => {
      if (!down) return;
      samplerModes[i] = m; paintAll(); close();
      if (live) fetch(`/api/sampler/mode?slot=${i + 1}&mode=${m}`).catch(() => {});
    });
    box.appendChild(b);
  });
  const sync = h("button", samplerSync[i] ? "on" : "", `⇄ TEMPO<small>${samplerSync[i] ? "FOLLOWS" : "OFF"}</small>`);
  bindPress(sync, down => {
    if (!down) return;
    samplerSync[i] = !samplerSync[i];
    if (live) setCtl(g, "sync_enabled", samplerSync[i] ? 1 : 0);
    paintAll(); close();
  });
  const lock = h("button", samplerKeylock[i] ? "on" : "", `KEYLOCK<small>${samplerKeylock[i] ? "ON" : "OFF"}</small>`);
  bindPress(lock, down => {
    if (!down) return;
    samplerKeylock[i] = !samplerKeylock[i];
    if (live) setCtl(g, "keylock", samplerKeylock[i] ? 1 : 0);
    paintAll(); close();
  });
  const clear = h("button", "clear", "CLEAR");
  bindPress(clear, down => {
    if (!down) return;
    if (live) push(g, "eject"); else { samplers[i].state = 0; }
    paintAll(); close();
  });
  const rename = h("button", "full", "✎ RENAME");
  bindPress(rename, down => {
    if (!down) return;
    close();
    askText(`Name for pad ${i + 1}`, samplers[i].name || "", async name => {
      const r = await (await fetch(`/api/sampler/rename?slot=${i + 1}&name=${encodeURIComponent(name)}`)).json().catch(() => ({}));
      if (r.ok) { samplers[i].name = name; paintAll(); } else toast(r.error || "Couldn't rename it");
    });
  });
  rename.disabled = REMOTE.on;
  box.append(sync, lock, clear, rename);
  document.body.append(veil, box);
  const r = anchor ? anchor.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const b = box.getBoundingClientRect();
  const x = clamp(r.left + r.width / 2 - b.width / 2, 8, innerWidth - b.width - 8);
  const y = r.top - b.height - 8 > 8 ? r.top - b.height - 8 : Math.min(innerHeight - b.height - 8, r.top + r.height + 8);
  Object.assign(box.style, { left: x + "px", top: y + "px" });
}
async function captureInto(d, i) {
  const sm = samplers[i];
  if (REMOTE.on) { sm.note = "not in controller mode"; paintAll(); setTimeout(() => { sm.note = ""; paintAll(); }, 2000); return; }
  if (!live) { sm.state = 1; sm.name = `Deck ${d.n} loop`; paintAll(); return; }
  sm.note = "capturing…"; paintAll();
  try {
    const r = await (await fetch(`/api/sampler/capture?deck=${d.n}&slot=${i + 1}&sync=${S.sampleSync ? 1 : 0}&keylock=${S.sampleKeylock !== false ? 1 : 0}`)).json();
    sm.note = r.ok ? "" : r.error || "couldn't capture";
    if (r.ok) { samplerSync[i] = !!S.sampleSync; samplerKeylock[i] = S.sampleKeylock !== false; }
  } catch { sm.note = "couldn't capture"; }
  paintAll();
  if (sm.note) setTimeout(() => { sm.note = ""; paintAll(); }, 2500);
}

// CUE, PLAY and SYNC for side s (both layouts).
function transportControls(s, u) {
  u.cue = h("button", "cuebtn", "CUE"); u.play = h("button", "play", "PLAY"); u.sync = h("button", "sync", "SYNC");
  bindPress(u.cue, down => { const d = deckOf(s);
    if (down && d.shift && live) { d.cueSlip = true; d.shift = false; d.slip = !d.slip; send("slip", d.n, d.slip ? 1 : 0); paintAll(); return; }
    if (!down && d.cueSlip) { d.cueSlip = false; return; }   // (that press was SLIP's)
    if (live) { send("cue", d.n, down); return; }
    if (down) { if (d.playing) { d.playing = false; d.pos = d.cuePoint; } else if (Math.abs(d.pos - d.cuePoint) > .05) d.cuePoint = d.pos; else d.preview = true; }
    else if (d.preview) { d.preview = false; d.pos = d.cuePoint; }
    paintSide(s); });
  bindPress(u.play, down => { const d = deckOf(s);
    if ((down && d.shift && live) || (!down && d.censor)) {   // SHIFT + PLAY, held: CENSOR
      d.censor = down; if (down) d.shift = false;
      send("censor", d.n, down ? 1 : 0); paintAll(); return;
    }
    if (down) {
    if (live) { send("play", d.n, d.playing ? 0 : 1); return; }
    d.playing = !d.playing; d.preview = false; paintSide(s); } });
  // Like a Pioneer deck: tap = sync on (tempo and beats locked to the master) / off (keeping the tempo).
  // SHIFT + tap = make this deck the master: the synced decks follow its tempo.
  bindPress(u.sync, down => { if (!down) return;
    const d = deckOf(s), master = d.shift;
    if (master) { d.shift = false; d.syncMode = 2; if (!live) decks.forEach(o => o.leader = o === d); }
    else d.syncMode = d.syncMode ? 0 : 2;
    if (live) send("sync", d.n, master ? 3 : d.syncMode ? 1 : 0);
    else if (d.syncMode && !d.leader) matchTempo(d, s);
    paintAll(); });
}

function buildPads(s, u, n) {
  const pads = h("div", "pads");
  u.pads = [];
  for (let k = 0; k < n; k++) {
    const p = h("div", "pad");
    bindPress(p, (down, e) => padPress(s, k, down, e, p));
    pads.appendChild(p); u.pads[k] = p;
  }
  return pads;
}

// A synced deck that isn't the master: its tempo comes from the master.
const synced = d => !!d.syncMode && !d.leader;

// The beat grid editor (grid.html) over the whole page, for the deck on side s; tap its BPM to open it.
function openGrid(s) {
  const d = deckOf(s);
  if (!live || !d.beatsFor || REMOTE.on) return;   // edits the phone's own Mixxx
  document.getElementById("gridview")?.remove();
  const f = document.createElement("iframe");
  f.id = "gridview";
  f.src = (window.zydeckKeyed || (u => u))(`${HUB_ELSEWHERE ? HUB : ""}/grid?group=${encodeURIComponent(ch(d.n))}&track=${d.beatsFor}&view=${S.viewOffset || 0}${LINKED ? "&dev=1" : ""}`);
  document.body.appendChild(f);
}
addEventListener("message", e => {
  if ((e.origin === location.origin || e.origin === HUB) && e.data?.zydek === "grid-close") document.getElementById("gridview")?.remove();
});
// Back (the system's, from the app): the grid editor gets it, or a question open is answered "no"; true if taken
window.zydekBack = () => {
  const g = document.getElementById("gridview");
  if (g) { g.contentWindow.postMessage({ zydek: "back" }, "*"); return true; }
  const ask = document.querySelector(".zm-ask, #asktext");
  if (ask) { (ask.querySelector(".no") || ask).click(); ask.remove?.(); return true; }
  return false;
};

// Deck header (switch, title, BPM, time) and platter strip for side s.
function buildStrip(s, u) {
  // header
  const head = h("div", "head");
  u.sw = h("button", "switch");
  bindPress(u.sw, down => { if (down) { sides[s] = sides[s] === s ? s + 2 : s; paintAll(); } });
  u.title = h("div", "title"); u.bpm = h("div", "num bpmtap"); u.time = h("div", "num dim");
  u.keyNum = h("div", "num keynum", `<i class="kbar" hidden></i><span></span>`);   // the key as it plays now (key shift and tempo in), beside the BPM
  u.keyBar = u.keyNum.firstChild; u.keyTxt = u.keyNum.lastChild;
  u.bpm.addEventListener("pointerdown", e => e.stopPropagation());   // not a scratch
  u.bpm.addEventListener("click", () => openGrid(s));
  head.append(u.sw, u.title, u.keyNum, u.bpm, u.time);

  // platter strip
  u.strip = h("div", "strip", `<div class="axis"></div><div class="wftrack"><div class="tiles"></div></div>` +
    `<div class="slipghost"><div class="clip"><div class="wftrack"><div class="tiles"></div></div></div><div class="edge"></div></div><div class="played"></div>` +
    `<div class="cursor"></div><div class="label"></div><div class="endwarn"></div>`);
  u.cursor = u.strip.querySelector(".cursor");
  // Unload: hold the title of a paused deck (on its waveform): the eject sign fades in beside it, as tall as
  // the waveform, and after half a second it stays, as a button: a tap on it unloads (asking first, unless told
  // not to); touching anything else puts it away. Playing, the title scratches as ever.
  // one per place it can come up (Settings › Advanced › Unload button): left, left-mid, middle, right
  u.ejects = EJECT_PLACES.map(([place]) => {
    const el = h("div", "ejecticon", `<svg viewBox="0 0 24 24"><path d="M12 4 3 15h18z"/><rect x="3" y="17.5" width="18" height="3" rx=".8"/></svg>`);
    el.dataset.place = place;
    u.strip.appendChild(el);
    return el;
  });
  u.title.addEventListener("pointerdown", e => {
    const d = deckOf(s), tr = u.title.getBoundingClientRect();
    // the title's own text only: elsewhere (and while playing) the touch goes on to the waveform (a scratch)
    if (!live || !d.loaded || d.playing || isPalm(e) || e.clientX > tr.left + Math.min(u.title.scrollWidth, tr.width) + mm(1)) return;
    e.stopPropagation(); e.preventDefault();
    const sr = u.strip.getBoundingClientRect();
    // as tall as the waveform (square); left-mid: its right edge on the end of the track's name
    // the end of the track's name itself (the title text, not the artist after it), within the title's box
    let nameEnd = Math.min(tr.right, tr.left + u.title.scrollWidth);
    const name = [...u.title.childNodes].find(n => n.textContent.trim());
    if (name) { const range = document.createRange(); range.selectNodeContents(name); nameEnd = Math.min(tr.right, range.getBoundingClientRect().right); }
    const size = sr.height * .92;
    nameEnd -= sr.left;
    const at = { left: mm(1), leftmid: Math.max(mm(1), nameEnd - size), middle: (sr.width - size) / 2, right: sr.width - size - mm(1) };
    const places = ejectPlaces();
    u.ejects.forEach(el => {
      const on = places.includes(el.dataset.place);
      el.classList.toggle("on", on);
      if (on) el.style.left = `${at[el.dataset.place].toFixed(1)}px`;
    });
    let armed = false;
    const timer = setTimeout(() => { armed = true; armEject(s, u); }, 500);
    const end = () => {
      clearTimeout(timer);
      if (!armed) u.ejects.forEach(el => el.classList.remove("on"));
      removeEventListener("pointerup", end); removeEventListener("pointercancel", end);
    };
    addEventListener("pointerup", end); addEventListener("pointercancel", end);
  });
  u.track = u.strip.querySelector(".wftrack"); u.tilesBox = u.strip.querySelector(".tiles"); u.played = u.strip.querySelector(".played");
  u.ghost = u.strip.querySelector(".slipghost"); u.gTrack = u.ghost.querySelector(".wftrack"); u.gTilesBox = u.ghost.querySelector(".tiles");
  drag(u.strip, {
    // Grab like vinyl: touching holds the record and the waveform under the finger follows it 1:1
    // (the waveform rolls past a fixed cursor, so moving the finger left plays forward).
    down: e => { const d = deckOf(s); d.grabbed = true; d.coast = false; d.vel = 0; d.easeMs = 0; d.slipStep = undefined; u.strip.classList.add("held"); send("scratchOn", d.n);
      // held, Mixxx stops, and says nothing more until the track moves again: the model of where it is stops here too
      // (left alone it ran on a quarter of a second past the last report, and the waveform rushed after it on release)
      posSeed(d, d.pos, 0, performance.now());
      scrGrab(d, performance.now());
      latTrace("d", s, Math.round(Math.max(e.width || 0, e.height || 0) / S.pxmm * 10) / 10);
      return { x: e.clientX, deck: d, w: u.strip.clientWidth, samples: [{ t: performance.now(), p: d.pos }] }; },
    move: (e, st) => {
      const dx = e.clientX - st.x; st.x = e.clientX;
      st.deck.pos = clamp(st.deck.pos - dx / st.w * deckSpan(st.deck), -PREROLL, st.deck.dur);
      const now = performance.now();
      st.samples.push({ t: now, p: st.deck.pos });
      while (st.samples.length > 2 && now - st.samples[0].t > 80) st.samples.shift();
      send("scratch", st.deck.n, scrMove(st.deck, -dx / st.w * deckSpan(st.deck), now) / deckSpan(st.deck));
      latTrace("m", s, Math.round(dx * 10) / 10);
    },
    up: (e, st) => {
      // The record leaves the hand at the finger's speed: the slope of a straight line through its
      // positions over the last 60 ms (a finger held still before lifting gives ~0).
      const now = performance.now(), d = st.deck;
      st.samples.push({ t: now, p: d.pos });
      d.vel = clamp(releaseSpeed(st.samples.filter(x => now - x.t <= 60)), -8, 8);
      // Lifting off outside the strip lets go of the flick: the record eases from the finger's speed to the
      // platter's in a fixed 150 ms instead of slipping.
      const sr = u.strip.getBoundingClientRect();
      if (e.clientX < sr.left || e.clientX > sr.right || e.clientY < sr.top || e.clientY > sr.bottom) d.easeMs = 150;
      latTrace(e.type === "pointercancel" ? "c" : "u", s, Math.round(d.vel * 100) / 100);
      d.coast = S.catchup > 0 || d.easeMs > 0;
      // Let go from where the cursor is: Mixxx's record stopped ~0.1 s past it (the cursor shows what you
      // heard, and the record slides on a moment after the grab), and would play on from there, skipping it
      // (with quantize on, Mixxx keeps a playing deck's beat phase through a seek, which put it right back:
      // quantize is off for that moment)
      // On the computer's Mixxx (controller mode) it stays where it is: the sound is what counts, and moving it there
      // was a jump you'd hear (each scratch could leave it a few hundred ms from the hand, the time the grab took to
      // reach it); the drawing goes to it instead, below
      if (live && !REMOTE.on && Math.abs(d.vel) < .2 && d.dur > 0) {
        const q = d.quantize;
        if (q) { markLocal(d, "quantize"); setCtl(ch(d.n), "quantize", 0); }
        setCtl(ch(d.n), "playposition", clamp(d.pos, 0, d.dur) / d.dur);
        if (q) setTimeout(() => { markLocal(d, "quantize"); setCtl(ch(d.n), "quantize", 1); }, 80);
      }
      if (d.scr) latTrace("s", s, Math.round(((d.scr.slip ?? 0) - d.scr.sent) * 1000));   // (slip left, ms)
      d.scr = null;
      d.grabbed = false; u.strip.classList.remove("held"); send("scratchOff", d.n, +d.vel.toFixed(2));
      if (!d.coast) {
        // Mixxx goes on from where the hand left it (put there just above): the model of where it is starts again from
        // there, at the deck's speed (the reports from while it slowed to a stop would run it on 250 ms ahead, and the
        // waveform rush after it), and the drawing doesn't jump back by the sound's delay (zydeck-position.js)
        // The computer's Mixxx: from where it last said it was (the hand drew ahead of what it heard), the drawing
        // sliding over to it from the hand's place
        const now = performance.now(), from = REMOTE.on && d.rawP != null && now - d.rawT < 1000 ? d.rawP : d.pos;
        posSeed(d, from, d.playing ? d.ratio || 1 : 0, now);
        d.released = now; d.shown = d.pos;
      }
    },
  });
  return head;
}

// Strips on top (S.layout "stacked"): each strip gets its row of the top band, with the track info riding on

const stacked = () => S.layout === "stacked";
function placeStrip(s, u) {

  document.getElementById(`nudge${s}`).replaceChildren(buildNudge(s, u));
}

// Nudge bar (strips on top): like the edge of a jog wheel. Dragging bends the tempo by the finger's speed,
// left = faster as on the strip (the music moves the way you push it); still or lifted = no bend. With
// SHIFT on and a loop playing, dragging moves the loop instead, a quarter beat per 2.5 mm (right = later).
// Nudge: a short bend for lining the beats up (Serato-like), not a tempo change. At full sensitivity (1) 50 mm/s
// of finger speed = +8 % playback speed, Mixxx's feel; S.nudgeSens scales it (default 0.3, so +2.4 %).
const NUDGE_PER_MM_S = .0016;
function setNudge(d, v) {
  if (v !== 0 && Math.abs(v - (d.nudge || 0)) < .004) return;
  if (v === 0 && !d.nudge) return;
  d.nudge = v;
  send("nudge", d.n, +v.toFixed(4));
}
function buildNudge(s, u) {
  u.nudge = h("div", "nudge", "◀ FASTER · NUDGE · SLOWER ▶");
  let off = 0;
  drag(u.nudge, {
    down: e => {
      const d = deckOf(s), adjust = d.adjust || null, loopMove = !adjust && d.shift && d.loopOn;
      u.nudge.classList.add("held"); u.nudge.classList.toggle("loopmove", !!(adjust || loopMove));
      if (adjust) setHTML(u.nudge, loopRange(d) ? `◀ EARLIER · LOOP ${adjust.toUpperCase()} · LATER ▶` : "NO LOOP TO ADJUST");
      else if (loopMove) setHTML(u.nudge, "◀ EARLIER · MOVE LOOP · LATER ▶");
      return { x: e.clientX, d, adjust, loopMove, acc: 0, samples: [{ t: performance.now(), x: e.clientX }] };
    },
    move: (e, st) => {
      const now = performance.now(), dx = e.clientX - st.x;
      st.x = e.clientX;
      off += dx; u.nudge.style.setProperty("--off", `${off.toFixed(1)}px`);   // the ridges follow the finger
      if (st.adjust) {   // the loop point follows the finger at the strip's scale; never a tempo bend here
        const lr = loopRange(st.d), sec = dx / cachedRect(u.nudge).width * deckSpan(st.d);
        if (!lr) return;
        if (st.adjust === "in") send("loopPoint", st.d.n, "in", clamp(lr[0] + sec, 0, lr[1] - .01));
        else send("loopPoint", st.d.n, "out", clamp(lr[1] + sec, lr[0] + .01, st.d.dur));
        return;
      }
      if (st.loopMove) {
        st.acc += dx / S.pxmm;
        const q = Math.trunc(st.acc / 2.5);
        if (q) { st.acc -= q * 2.5; send("loopMove", st.d.n, q / 4); }
        return;
      }
      st.samples.push({ t: now, x: e.clientX });
      while (st.samples.length > 2 && now - st.samples[0].t > 50) st.samples.shift();
      const a = st.samples[0], b = st.samples[st.samples.length - 1];
      const mmPerS = b.t > a.t ? (b.x - a.x) / S.pxmm / ((b.t - a.t) / 1000) : 0;
      const sens = S.nudgeSens ?? .3;
      setNudge(st.d, clamp(-mmPerS * NUDGE_PER_MM_S * sens, -.5 * sens, .5 * sens));
      clearTimeout(st.still); st.still = setTimeout(() => setNudge(st.d, 0), 70);   // finger stopped
    },
    up: (e, st) => {
      clearTimeout(st.still); setNudge(st.d, 0);
      u.nudge.classList.remove("held", "loopmove");
      setHTML(u.nudge, "◀ FASTER · NUDGE · SLOWER ▶");
    },
  });
  return u.nudge;
}

// The top-bar controls: in the top bars beside the mixer, or with the strips on top, in the side columns

const topNote = document.querySelector(".topbar .note");

function buildMixer() {

// Headphone cue (pre-fader listen). Drawn, because the tablet's font has no headphone character.
function pflButton(s) {

// =====================================================================================================
// Phone: what mixing needs on one phone held sideways, like a small controller (Hercules Starlight).
// Both strips across the top (waveform, scratch); tempo lanes on the outer edges, full height. Per deck:
// CUE · PLAY, 4 pads, HOT CUE / LOOP (with SHIFT: FX / SAMPLER), SHIFT · SYNC. Mixer: BASS and FILTER per
// deck (with that deck's SHIFT: MID and HIGH), headphone cue, volume faders, crossfader. Faders keep at
// least 30 mm of travel on a 7" phone.
// =====================================================================================================
const PHONE_EQ = [["low", "mid"], ["filter", "high"]];   // knob: [normally, with SHIFT]
const EQ_LABEL = { low: "BASS", mid: "MID", filter: "FILTER", high: "HIGH" };
const LOOP_PADS = [.5, 1, 2, 4];
// The phone's 4 jump pads (−4, −1, +1, +4 beats) as the tablet's 8: −1 +1 −2 +2 −4 +4 −8 +8
const PHONE_JUMPS = [4, 0, 1, 5];
const padIndex = (d, k) => PHONE && d.mode === "jump" ? PHONE_JUMPS[k] : k;
// "MAIN<small>SHIFT</small>": the SHIFT function lights up (and the main one dims) while it applies
// A two-function control's label: the main function big and bold, the SHIFT one small and plain under it; they
// swap while SHIFT is held (or the second function is the one in use). on: the second is switched on (lit).
// The big one shrinks to fit a narrow button (fitTwo, when it's set).
const two = (main, alt, altOn, on = false) =>
  `<span class="two${altOn ? " alt" : ""}"><b>${main}</b><small${on ? ' class="on"' : ""}>${alt}</small></span>`;
function fitTwo(el) {
  const t = el.firstElementChild, alt = t.classList.contains("alt"), big = t.querySelector(alt ? "small" : "b");
  const cs = getComputedStyle(el), pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 2;
  // the SHIFT label fits into the button's width with its own label (setHTML keeps it), so SHIFT never resizes it
  const room = (alt && el._room > 0 ? Math.min(el._room, el.clientWidth) : el.clientWidth) - pad, w = big.scrollWidth;
  if (room > 0 && w > room) {   // at once: a transition would let the button bulge for a moment
    big.style.setProperty("transition", "none");
    big.style.setProperty("font-size", `${(parseFloat(getComputedStyle(big).fontSize) * room / w).toFixed(1)}px`, "important");
  }
}
function buildPhone() {
  layoutEpoch++;

  const row = (cls, ...els) => { const r = h("div", "prow " + cls); r.append(...els); return r; };
  const strips = [], decksEl = [];
  [0, 1].forEach(s => {
    const u = { modes: [], key: h("span") };   // (no key display on the phone)

    u.lane.appendChild(u.tread);
    buildStrip(s, u);

    info.append(u.title, u.keyNum, u.bpm, u.time);
    u.sw.className = "psw";
    u.sw.addEventListener("pointerdown", e => e.stopPropagation());   // the deck switch, not a scratch

    transportControls(s, u);

    u.deck = u.el = h("div", "pdeck");

      s ? row("transport", u.shiftBtn, u.sync) : row("transport", u.sync, u.shiftBtn));   // SYNC on the outside
    u.col = h("div", "tempo pcol");
    ui.sides[s] = u;
    decksEl[s] = u.deck;
  });

  L.col.append(document.getElementById("gear"), L.lane, L.ol);
  R.col.append(h("div", "gearspace"), R.lane, R.ol);

  lower.append(decksEl[0], buildPhoneMixer(), decksEl[1]);
  mid.append(h("div"), strips[0], strips[1], lower);   // 2 mm of glass above the top strip
  app.replaceChildren(L.col, mid, R.col);

}
function buildPhoneMixer() {
  const m = h("div"); m.id = "mixer";
  ui.chans = []; ui.faders = [];

    const c = h("div", "chan");
    const knobs = PHONE_EQ.map(([a, b]) => {
      const key = d => d.shift ? b : a;
      const k = knob(EQ_LABEL[a], d => d[key(d)], (v, d) => { const kk = key(d); d[kk] = v; send(kk, d.n, v); }, .5, true, () => deckOf(s));
      k.label = d => two(EQ_LABEL[a], EQ_LABEL[b], d.shift);

function build() {
  if (PHONE) return buildPhone();
  layoutEpoch++;
  document.getElementById("dl").replaceChildren(buildSide(0));
  document.getElementById("mixwrap").replaceChildren(buildMixer());
  document.getElementById("dr").replaceChildren(buildSide(1));

// ½ · LOOP · ×2 for the deck on each side. Like every held control, a press stays on the deck it started on.
function buildLoops() {
  ui.loops = [0, 1].map(s => {
    const box = document.getElementById(`loop${s}`);
    const half = h("button", "", "½"), loop = h("button", "loop"), dbl = h("button", "", "×2");
    const bind = (el, key) => {
      let held = null;
      bindPress(el, down => {
        if (down) held = { d: deckOf(s), key };
        if (!held) return;
        loopAction(held.d, held.key, down);
        if (!down) held = null;
      });
    };
    // SHIFT + ½ / ×2: adjust the loop's in / out point with the nudge bar (tap again to finish)
    const adjust = (el, key, which) => {
      bindPress(el, down => {
        const d = deckOf(s);
        if (down && (d.shift || d.adjust === which)) {
          d.adjust = d.adjust === which ? null : which; d.shift = false; paintAll(); return;
        }
        if (d.adjust && down) return;
        loopAction(d, key, down);
      });
    };
    adjust(half, "loop_halve", "in"); adjust(dbl, "loop_double", "out");
    bind(loop, "beatloop_activate");   // beatloop_activate toggles in Mixxx 2.6
    box.replaceChildren(half, loop, dbl);
    // KEY LOCK and QUANTIZE for the deck on this side (strips on top: the row above the loop)
    const flags = h("div", "flags"), kl = h("button", "", "KEY LOCK"), qz = h("button", "", "QUANTIZE");
    // SLIP: the track runs on silently under loops, scratches and CENSOR, and comes back where it would be.
    // CENSOR (held): plays backwards from here, then carries on where it would have been (slip).
    const sl = h("button", "", "SLIP"), cn = h("button", "", "CENSOR");
    bindPress(sl, down => { if (!down) return; const d = deckOf(s); d.slip = !d.slip; send("slip", d.n, d.slip ? 1 : 0); paintLoop(s); });
    bindPress(cn, down => { const d = deckOf(s); d.censor = down; send("censor", d.n, down ? 1 : 0); cn.classList.toggle("on", down); });
    bindPress(kl, down => { if (!down) return; const d = deckOf(s); d.keylock = !d.keylock; send("keylock", d.n, d.keylock ? 1 : 0); paintLoop(s); });
    bindPress(qz, down => { if (!down) return; const d = deckOf(s); d.quantize = !d.quantize; send("quantize", d.n, d.quantize ? 1 : 0); paintLoop(s); });
    flags.append(kl, qz, sl, cn);
    // SAMPLES: this side shows sampler pads instead of its deck (and back); only this side is rebuilt. With
    // either side's SHIFT, the other bank (the left side can show 17-32, the right 1-16).
    const smp = h("button", "smpbtn");
    bindPress(smp, down => {
      if (!down) return;
      const shifted = deckOf(0).shift || deckOf(1).shift, bank = shifted ? 1 - s : s;
      if (shifted) { deckOf(0).shift = false; deckOf(1).shift = false; }
      // Back to the deck: a plain press while it shows pads (either bank), or SHIFT on the bank it shows.
      // SHIFT while it shows its own bank switches to the other one.
      if (sidePage[s] === "samples" && (!shifted || sideBank[s] === bank)) sidePage[s] = "deck";
      else { sidePage[s] = "samples"; sideBank[s] = bank; }
      layoutEpoch++;
      document.getElementById(s ? "dr" : "dl").replaceChildren(buildSide(s));
      placeChrome();
      requestAnimationFrame(paintAll);
    });
    return { box, loop, half, dbl, flags, kl, qz, sl, cn, smp };

}

// ½ and ×2 land on a power of two: a loop of 3 beats halves to 2 (not 1.5) and doubles to 8 (not 6)
const pow2 = b => Math.min(512, Math.max(1 / 32, 2 ** Math.round(Math.log2(b))));
function loopAction(d, key, down) {
  const step = key === "loop_halve" ? .5 : key === "loop_double" ? 2 : 0;
  if (step && down && pow2(d.loopSize * step) !== d.loopSize * step) {   // not a power of two now: set the size
    const size = pow2(d.loopSize * step);
    if (live) setCtl(ch(d.n), "beatloop_size", size);
    d.loopSize = size; paintAll(); return;
  }
  send("loop", d.n, key, down);
  if (!live && down) {
    if (key === "loop_halve") d.loopSize = Math.max(1 / 32, d.loopSize / 2);
    else if (key === "loop_double") d.loopSize = Math.min(512, d.loopSize * 2);
    else { d.loopOn = !d.loopOn; d.loopStart = d.pos; }
  }
  paintAll();
}

// =====================================================================================================
// Painting
// =====================================================================================================
const fmtTime = s => { s = Math.max(0, s); return `-${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`; };
const rgb = v => `#${v.toString(16).padStart(6, "0")}`;
const fgFor = v => ((v >> 16 & 255) * .299 + (v >> 8 & 255) * .587 + (v & 255) * .114) / 255 > .55 ? "#111" : "#fff";

function setPad(el, cls, html, color, fg) {
  const key = `${cls}|${el.dataset.down || ""}|${el.dataset.holding || ""}|${color}|${fg}|${html}`;
  if (el._key === key) return;
  el._key = key;
  el._knob = null;
  el.className = "pad " + cls + (el.dataset.down ? " down" : "") + (el.dataset.holding ? " holding" : "");
  if (color) el.style.setProperty("--c", color); else el.style.removeProperty("--c");
  if (fg) el.style.setProperty("--fg", fg); else el.style.removeProperty("--fg");
  el.innerHTML = html;
}

// A pad cell holding a knob instead (the FX panel): made once per cell and purpose, repainted after
function knobCell(el, id, make) {
  if (el._knob?.id !== id) {
    el._key = "knob:" + id;
    el.className = "pad asknob";
    el.style.removeProperty("--c");
    el.innerHTML = "";
    el._knob = make();
    el._knob.id = id;
    el.appendChild(el._knob);
  }
  el._knob.paint();
}

function paintTempo(s) {
  const u = ui.sides[s];
  if (!u || !u.lane) return;
  const d = u.laneDeck || deckOf(s);
  const scale = Math.max(8, Math.ceil(Math.abs(d.tempo)));
  const frac = d.tempo / scale * (S.fasterDown ? 1 : -1);   // +1 = bottom
  const mark = u.lane.querySelector(".mark"), top_ = (50 + frac * 46).toFixed(2) + "%";
  if (mark._top !== top_) { mark._top = top_; mark.style.top = top_; }
  if (u.lane._scale !== scale) { u.lane._scale = scale; u.lane.style.setProperty("--tick", (100 / (2 * scale)) + "%"); }   // one line per 1 %
  const top = S.fasterDown ? "−" : "+", bot = S.fasterDown ? "+" : "−";
  setText(u.lane.querySelector(".end.t"), `${top}${scale}%`);
  setText(u.lane.querySelector(".end.b"), `${bot}${scale}%`);
  setText(u.tread, (d.tempo >= 0 ? "+" : "") + d.tempo.toFixed(2) + "%");
  u.tread.classList.toggle("over", Math.abs(d.tempo) > 8);
  u.ol.classList.toggle("on", d.ol);
  setText(u.bpm, (d.bpm * (1 + d.tempo / 100)).toFixed(1));
  if (u.keyNum) {
    setText(u.keyTxt, d.curKey ? keyName(d.curKey) : ""); u.keyNum.classList.toggle("shifted", !!d.key);

    const k = Math.round(d.curKey || 0), off = d.keyOff || 0, bar = k >= 1 && k <= 24
      ? (off < 0 ? [keyColor(k), keyColor(keyStep(k, -1)), 1 + off] : [keyColor(keyStep(k, 1)), keyColor(k), off]) : null;
    const sig = bar ? `${bar[0]}|${bar[1]}|${bar[2].toFixed(3)}` : "";
    if (u.keyBar._sig !== sig) {
      u.keyBar._sig = sig; u.keyBar.hidden = !bar;
      if (bar) { u.keyBar.style.setProperty("--kt", bar[0]); u.keyBar.style.setProperty("--kb", bar[1]); u.keyBar.style.setProperty("--ks", (bar[2] * 100).toFixed(1) + "%"); }
    }

}

const fmtBeats = b => b >= 1 ? String(+b.toFixed(2)) : `1/${Math.round(1 / b)}`;
function paintLoop(s) {
  const l = ui.loops?.[s], d = deckOf(s);
  if (!l) return;
  l.box.classList.toggle("d34", d.n > 2);
  l.loop.classList.toggle("on", d.loopOn);
  setHTML(l.loop, `${fmtBeats(d.loopSize)}<small>LOOP ${d.n}</small>`);
  const sh = d.shift || d.adjust;
  setHTML(l.half, sh ? "IN<small>adjust</small>" : "½"); setHTML(l.dbl, sh ? "OUT<small>adjust</small>" : "×2");
  l.half.classList.toggle("adj", d.adjust === "in"); l.dbl.classList.toggle("adj", d.adjust === "out");
  l.flags.classList.toggle("d34", d.n > 2);
  l.kl.classList.toggle("on", !!d.keylock); l.qz.classList.toggle("on", !!d.quantize); l.sl?.classList.toggle("on", !!d.slip);
}

function paintSide(s) {

  const d = deckOf(s);
  u.el.classList.toggle("d34", d.n > 2);
  u.strip?.classList.toggle("d34", d.n > 2); u.nudge?.classList.toggle("d34", d.n > 2);
  if (u.sw) {

    else {
      // "Deck 1⇆3": both numbers in their deck colours, in fixed places; the one on this side bright

  const go = () => { if (d.loaded && !d.playing) push(ch(d.n), "eject"); done(); };
  if (S.askUnload === false) { go(); return; }
