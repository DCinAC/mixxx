<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Make a sample</title>
<!--
  ZyDeck's sample editor: /sample?track=<id>, opened over the phone's library (long press a track > Make a
  sample). The track is in the headphones' preview deck; pick a stretch on the beat grid (and, for a stem file,
  which stems), audition it looping in the headphones, and cut it into a sampler pad (Zydek's /api/sampler/cut
  writes a WAV in Music/ZyDeck Samples). Posts {zydek: "sample-close"} to the page that opened it.
-->
<style>
  :root { --bg: #0b0b0b; --edge: #2c2c2c; --text: #ececec; --dim: #8a8a8a; --acc: #3ddc84; --cue: #f0a23b; --err: #ff5a5f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 14px/1.3 system-ui, "Roboto", sans-serif;
    overflow: hidden; touch-action: none; }
  #app { height: 100%; display: grid; grid-template-rows: auto minmax(100px, 1fr) auto; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
  header { display: flex; gap: 10px; align-items: center; min-width: 0; }
  header .who { flex: 1; min-width: 0; }
  header .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  header .who small { color: var(--dim); font-size: 12px; }
  button { font: inherit; font-weight: 600; color: #ddd; background: #1c1c1c; border: 1px solid #343434; border-radius: 10px; min-height: 42px; padding: 0 10px; }
  button.on { border-color: var(--acc); color: var(--acc); background: #12261a; }
  button:active { background: #fff; color: #111; }
  #done { border-color: var(--dim); }
  #wave { position: relative; border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; background: #0f0f0f; }
  #wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #wave .head { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 8px #fff; pointer-events: none; }
  #wave .zoom { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
  #wave .zoom button { min-height: 32px; width: 36px; padding: 0; background: rgba(20,20,20,.8); }
  #panel { display: grid; gap: 8px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row > span { color: var(--dim); font-size: 12px; min-width: 52px; }
  .row button { flex: 1; min-width: 0; }
  #pads { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
  #pads button { min-height: 34px; padding: 0; font-size: 12px; }
  #pads button.taken { color: #6a6a6a; border-style: dashed; }
  #pads button.on { border-color: var(--cue); color: var(--cue); background: #2a2010; border-style: solid; }
  #save { min-height: 50px; border-color: var(--acc); color: var(--acc); font-size: 16px; }
  #msg { min-height: 16px; color: var(--dim); font-size: 12px; }
  #msg.bad { color: var(--err); } #msg.ok { color: var(--acc); }
  @media (orientation: landscape) and (min-width: 700px) {
    #app { grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto minmax(0, 1fr); }
    header { grid-column: 1 / -1; } #panel { grid-row: 2; grid-column: 2; align-content: start; overflow: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <header><button id="done">Done</button><div class="who"><b id="title">…</b><small id="sub">plays in your headphones</small></div>
    <button id="play">▶ Try it</button></header>
  <div id="wave"><canvas></canvas><div class="head"></div><div class="zoom"><button id="zout">−</button><button id="zin">+</button></div></div>
  <div id="panel">
    <div class="row"><button id="here">START HERE<br><small style="font-weight:500;color:var(--dim)">on the beat at the line</small></button>
      <button id="back">◀ beat</button><button id="fwd">beat ▶</button></div>
    <div class="row" id="lens"><span>Length</span></div>
    <div class="row" id="stems" hidden><span>Stems</span></div>
    <div class="row" id="modes"><span>Plays</span></div>
    <div id="pads"></div>
    <button id="save">Save to pad —</button>
    <div id="msg">Drag the waveform to find the spot, then START HERE.</div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const TRACK = +new URLSearchParams(location.search).get("track") || 0, GROUP = "[PreviewDeck1]";
const STEMS = ["Drums", "Bass", "Other", "Vocals"];   // stem 1..4 of ZyDeck's stem files
const LENS = [[.5, "½"], [1, "1"], [2, "2"], [4, "4"], [8, "8"], [16, "16"]];
const MODES = [["oneshot", "▶ ONE-SHOT"], ["hold", "■ HOLD"], ["loop", "↻ LOOP"]];
const ZOOMS = [2, 4, 8, 16, 32];
const st = { pos: 0, dur: 0, samples: 0, ratio: 1, playing: false, posAt: 0, wf: null, beats: null, bar: 0, loopOn: false, isStem: false };
const sel = { start: null, beats: 4, stems: 15, mode: "loop", slot: 0, auditioning: false };
let zi = 2, dragging = false;

// ---- Mixxx (Zydek's /ws) ---------------------------------------------------------------------------------
let ws;
const wsSend = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
const set = (key, v, group = GROUP) => wsSend({ set: [group, key, v, 0] });
const push = key => { set(key, 1); set(key, 0); };
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => wsSend({ sub: ["playposition", "play", "duration", "rate_ratio", "track_samples", "loop_enabled"].map(k => [GROUP, k, k === "playposition" ? 1 : 0]) });
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t !== "cv" || !m.k.startsWith(GROUP + ",")) return;
    const k = m.k.slice(GROUP.length + 1), v = m.v;
    if (k === "playposition") { if (!dragging) { st.pos = v * st.dur; st.posAt = performance.now(); } }
    else if (k === "duration") st.dur = v;
    else if (k === "track_samples") st.samples = v;
    else if (k === "rate_ratio") st.ratio = v;
    else if (k === "loop_enabled") st.loopOn = v > 0;
    else if (k === "play") st.playing = v > 0;
  };
  ws.onclose = () => setTimeout(connect, 1000);
}

// ---- the track ---------------------------------------------------------------------------------------------
async function loadTrack() {
  try {
    const t = await (await fetch(`/api/library/track/${TRACK}`)).json();
    $("#title").textContent = t.title || "Track";
    $("#sub").textContent = `${t.artist ? t.artist + " · " : ""}plays in your headphones`;
    st.isStem = !!t.stems;
    $("#stems").hidden = !st.isStem;
  } catch {}
  for (let i = 0; i < 30 && !st.wf; i++) {
    try {
      const r = await fetch(`/waveform/${TRACK}`);
      if (r.ok) { const b = new Uint8Array(await r.arrayBuffer()), dv = new DataView(b.buffer);
        st.wf = { rate: dv.getFloat32(4, true), n: dv.getUint32(8, true), data: b.subarray(12) }; break; }
    } catch {}
    await new Promise(r => setTimeout(r, 700));
  }
  try { const r = await fetch(`/beats/${TRACK}`); if (r.ok) { const j = await r.json(); st.beats = j.beats; st.bar = j.bar; } } catch {}
}
async function loadPads() {
  try {
    const j = await (await fetch("/api/sampler/modes")).json();
    const names = j.names || [];
    if (!sel.slot) sel.slot = (names.findIndex(n => !n) + 1) || 1;   // the first empty pad
    const box = $("#pads"); box.innerHTML = "";
    for (let i = 1; i <= 32; i++) {
      const b = document.createElement("button");
      b.textContent = i; b.title = names[i - 1] || "empty";
      b.className = (names[i - 1] ? "taken" : "") + (i === sel.slot ? " on" : "");
      b.addEventListener("click", () => { sel.slot = i; loadPads(); paint(); });
      box.appendChild(b);
    }
  } catch {}
  paint();
}

// ---- the selection: on the beat grid ---------------------------------------------------------------------
const beatLen = () => st.beats && st.beats.length > 1 ? (st.beats[st.beats.length - 1] - st.beats[0]) / (st.beats.length - 1) : .5;
function nearestBeatIndex(t) {
  const b = st.beats;
  if (!b || !b.length) return -1;
  let lo = 0, hi = b.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (b[m] < t) lo = m + 1; else hi = m; }
  return lo > 0 && Math.abs(b[lo - 1] - t) < Math.abs(b[lo] - t) ? lo - 1 : lo;
}
function range() {
  if (sel.start === null) return null;
  const end = sel.start + sel.beats * beatLen();
  return [sel.start, Math.min(st.dur || end, end)];
}
function moveStart(beats) {
  if (sel.start === null) return;
  const i = nearestBeatIndex(sel.start);
  if (i >= 0 && st.beats[i + beats] !== undefined) sel.start = st.beats[i + beats];
  else sel.start = Math.max(0, sel.start + beats * beatLen());
  update();
}
function update() {   // the audition loop follows the selection
  paint();
  if (sel.auditioning) audition(true);
}
function audition(on) {
  const r = range();
  if (on && r && st.samples && st.dur) {
    const sps = st.samples / st.dur;   // Mixxx's positions: samples of the stereo signal
    set("loop_start_position", Math.round(r[0] * sps / 2) * 2);
    set("loop_end_position", Math.round(r[1] * sps / 2) * 2);
    if (!st.loopOn) push("reloop_toggle");
    if (!sel.auditioning) { set("playposition", r[0] / st.dur); set("play", 1); }
    sel.auditioning = true;
  } else {
    if (st.loopOn) push("reloop_toggle");
    set("play", 0);
    sel.auditioning = false;
  }
  // only the chosen stems in the headphones too
  if (st.isStem) STEMS.forEach((_, s) => set("mute", on && !(sel.stems & (1 << s)) ? 1 : 0, `[PreviewDeck1_Stem${s + 1}]`));
  paint();
}

// ---- drawing -----------------------------------------------------------------------------------------------
const cv = $("#wave canvas"), g = cv.getContext("2d");
function draw(now) {
  const dpr = devicePixelRatio || 1, rc = cv.getBoundingClientRect(), W = Math.round(rc.width * dpr), H = Math.round(rc.height * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const pos = st.playing && !dragging ? st.pos + (now - st.posAt) / 1000 * st.ratio : st.pos;
  const sec = ZOOMS[zi], pxs = W / sec, start = pos - sec / 2, mid = H / 2;
  g.clearRect(0, 0, W, H);
  const r = range();
  if (r) {   // the stretch that becomes the sample
    g.fillStyle = "rgba(61,220,132,.22)"; g.fillRect((r[0] - start) * pxs, 0, (r[1] - r[0]) * pxs, H);
    g.fillStyle = "#3ddc84"; g.fillRect((r[0] - start) * pxs - dpr, 0, 2 * dpr, H); g.fillRect((r[1] - start) * pxs - dpr, 0, 2 * dpr, H);
  }
  g.fillStyle = "rgba(255,255,255,.25)"; g.fillRect(0, Math.floor(mid), W, Math.max(1, dpr * .6));
  const wf = st.wf;
  if (wf) {
    const per = wf.rate / pxs;
    for (let x = 0; x < W; x++) {
      const i0 = Math.floor((start * pxs + x) * per), i1 = Math.max(i0 + 1, Math.floor((start * pxs + x + 1) * per));
      if (i1 <= 0 || i0 >= wf.n) continue;
      let all = 0, lo = 0, mi = 0, hi = 0;
      for (let i = Math.max(0, i0); i < Math.min(wf.n, i1); i++) { const j = i * 4;
        all = Math.max(all, wf.data[j]); lo = Math.max(lo, wf.data[j + 1]); mi = Math.max(mi, wf.data[j + 2]); hi = Math.max(hi, wf.data[j + 3]); }
      const m = Math.max(lo, mi, hi, 1);
      g.fillStyle = `rgb(${255 * lo / m | 0},${255 * mi / m | 0},${255 * hi / m | 0})`;
      const h = Math.max(1, all / 255 * mid * .9);
      g.fillRect(x, mid - h, 1, h * 2);
    }
  }
  const b = st.beats;
  if (b) {
    for (let i = 0; i < b.length; i++) {
      if (b[i] < start - 1 || b[i] > start + sec + 1) continue;
      const x = Math.round((b[i] - start) * pxs);
      if ((i + st.bar) % 4 === 0) { g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(x - dpr, 0, 2 * dpr, H); }
      else { g.fillStyle = "rgba(255,255,255,.45)"; g.fillRect(x, 0, dpr, H * .2); g.fillRect(x, H * .8, dpr, H * .2); }
    }
  }
  requestAnimationFrame(draw);
}

// ---- controls ----------------------------------------------------------------------------------------------
const msg = (t, kind = "") => { $("#msg").textContent = t; $("#msg").className = kind; };
function paint() {
  document.querySelectorAll("#lens button").forEach(b => b.classList.toggle("on", +b.dataset.v === sel.beats));
  document.querySelectorAll("#stems button").forEach(b => b.classList.toggle("on", !!(sel.stems & (1 << +b.dataset.v))));
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.v === sel.mode));
  $("#save").textContent = `Save to pad ${sel.slot || "—"}`;
  $("#play").textContent = sel.auditioning ? "■ Stop" : "▶ Try it";
  $("#play").classList.toggle("on", sel.auditioning);
}
LENS.forEach(([v, label]) => {
  const b = document.createElement("button"); b.textContent = label + (v === 1 ? " beat" : ""); b.dataset.v = v;
  b.addEventListener("click", () => { sel.beats = v; update(); });
  $("#lens").appendChild(b);
});
STEMS.forEach((name, s) => {
  const b = document.createElement("button"); b.textContent = name; b.dataset.v = s;
  b.addEventListener("click", () => {
    const m = sel.stems ^ (1 << s);
    if (!m) return msg("Keep at least one stem", "bad");
    sel.stems = m; update();
  });
  $("#stems").appendChild(b);
});
MODES.forEach(([v, label]) => {
  const b = document.createElement("button"); b.textContent = label; b.dataset.v = v;
  b.addEventListener("click", () => { sel.mode = v; paint(); });
  $("#modes").appendChild(b);
});
$("#here").addEventListener("click", () => {
  const i = nearestBeatIndex(st.pos);
  sel.start = i >= 0 ? st.beats[i] : st.pos;
  msg(st.beats ? `Starts on beat ${i + 1}` : "No beat grid yet: it starts exactly at the line");
  update();
});
$("#back").addEventListener("click", () => moveStart(-1));
$("#fwd").addEventListener("click", () => moveStart(1));
$("#play").addEventListener("click", () => {
  if (sel.start === null) return msg("Pick where it starts first (START HERE)", "bad");
  audition(!sel.auditioning);
});
$("#zin").addEventListener("click", () => zi = Math.max(0, zi - 1));
$("#zout").addEventListener("click", () => zi = Math.min(ZOOMS.length - 1, zi + 1));
$("#save").addEventListener("click", async () => {
  const r = range();
  if (!r) return msg("Pick where it starts first (START HERE)", "bad");
  msg("Cutting…");
  const sync = (() => { try { return JSON.parse(localStorage.getItem("zphone.sampleSync") ?? "true"); } catch { return true; } })();
  const keylock = (() => { try { return JSON.parse(localStorage.getItem("zphone.sampleKeylock") ?? "true"); } catch { return true; } })();
  const stems = st.isStem && sel.stems !== 15 ? sel.stems : 0;
  try {
    const j = await (await fetch(`/api/sampler/cut?group=${encodeURIComponent(GROUP)}&start=${r[0]}&end=${r[1]}&stems=${stems}` +
      `&slot=${sel.slot}&mode=${sel.mode}&sync=${sync ? 1 : 0}&keylock=${keylock ? 1 : 0}`)).json();
    if (!j.ok) return msg(j.error || "Couldn't cut it", "bad");
    msg(`On pad ${sel.slot}: ${j.name}`, "ok");
    sel.slot = 0; loadPads();
  } catch { msg("Couldn't cut it", "bad"); }
});
$("#done").addEventListener("click", () => { audition(false); parent.postMessage({ zydek: "sample-close" }, location.origin); });

// drag the waveform to move through the track
(function scrub() {
  let x0 = 0, last = 0;
  cv.addEventListener("pointerdown", e => { dragging = true; x0 = e.clientX; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => {
    if (!dragging || !st.dur) return;
    const rc = cv.getBoundingClientRect(), dx = e.clientX - x0; x0 = e.clientX;
    st.pos = Math.max(0, Math.min(st.dur, st.pos - dx / rc.width * ZOOMS[zi]));
    const now = performance.now();
    if (now - last > 30) { last = now; set("playposition", st.pos / st.dur); }
  });
  const up = () => { if (!dragging) return; dragging = false; if (st.dur) set("playposition", st.pos / st.dur); st.posAt = performance.now(); };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
})();

connect(); loadTrack(); loadPads(); requestAnimationFrame(draw);
</script>
</body>
</html>
