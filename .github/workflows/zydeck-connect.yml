# ZyDeck Connect (tools/zydeck-connect, C++ and Qt): built for macOS, Windows and Linux whenever it changes (or by
# hand from the Actions tab). Each build is attached to the run as an artifact.
name: ZyDeck Connect

on:
  push:
    branches:
      - android-companion
      - stability
    paths:
      - tools/zydeck-connect/**
      - res/controllers/Zydek-Tablet.*
      - .github/workflows/zydeck-connect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: ZyDeck-Connect-macOS
          - os: windows-latest
            name: ZyDeck-Connect-Windows
          - os: ubuntu-24.04
            name: ZyDeck-Connect-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/zydeck-connect
            tools/zydeck-shared-tests
            src/zydek/zydeckshared.h
            res/controllers/Zydek-Tablet.midi.xml
            res/controllers/Zydek-Tablet.script.js
            res/zydek/python/zydek_web.py
          sparse-checkout-cone-mode: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"   # (6.8 links Apple's AGL, gone from the newest macOS SDK)
          modules: qtmultimedia   # (decodes tracks for the waveforms: its FFmpeg backend)
          cache: true
      - name: Linux needs ALSA's headers (and GL's, for Qt's widgets)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxkbcommon-dev
      - name: Build
        shell: bash
        working-directory: tools/zydeck-connect
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release)
          [ "$RUNNER_OS" = macOS ] && args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          [ "$RUNNER_OS" = Linux ] && args+=(-DZC_TESTS=ON)   # (the shared code's checks: below)
          cmake -S . -B build "${args[@]}"
          cmake --build build --config Release --parallel
      - name: The shared code's checks (the hub's and Connect's C++, the phone's Python, the mapping's JavaScript)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/zydeck-shared-tests/run.sh tools/zydeck-connect/build
      - name: yt-dlp, for the downloads (web.h), pinned and checked against its release's checksums
        shell: bash
        working-directory: tools/zydeck-connect
        env:
          YTDLP: "2026.10.21"
        run: |
          case "$RUNNER_OS" in
            macOS)   f=yt-dlp_macos; sum=7a6fe71d7d680f1fb0ac18d4949873d77db2859e90017c0f44bd94b23be4ee40; out=yt-dlp ;;
            Windows) f=yt-dlp.exe;   sum=33121d192d706e62f684a06f80918e3f3a8ba52ac3a65213b6951c39c7d9f555; out=yt-dlp.exe ;;
            Linux)   f=yt-dlp_linux; sum=d8bd33fca9d5b23bd5b9952b3fca36db5c46331933fda9f598a3da14ce2c243f; out=yt-dlp ;;
          esac
          mkdir -p tools-bin
          curl -fsSL -o "tools-bin/$out" "https://github.com/yt-dlp/yt-dlp/releases/download/$YTDLP/$f"
          if command -v sha256sum >/dev/null; then echo "$sum  tools-bin/$out" | sha256sum -c -; else echo "$sum  tools-bin/$out" | shasum -a 256 -c -; fi
          chmod +x "tools-bin/$out"
      - name: Package (Qt's libraries go with it)
        shell: bash
        working-directory: tools/zydeck-connect
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              macdeployqt "build/ZyDeck Connect.app"
              cp tools-bin/yt-dlp "build/ZyDeck Connect.app/Contents/MacOS/"   # (beside the program: web.cpp finds it there)
              codesign --force --deep --sign - "build/ZyDeck Connect.app"   # ad hoc: Apple Silicon won't run it unsigned
              # the app itself again, with a designated requirement that stays the same from build to build (an ad hoc
              # one is the build's own hash): macOS keeps its permissions (Mixxx's data, the network drive) across updates
              codesign --force --sign - -r='designated => identifier "org.zydeck.connect"' "build/ZyDeck Connect.app"
              (cd build && ditto -c -k --keepParent "ZyDeck Connect.app" ../dist/ZyDeck-Connect-macOS.zip) ;;
            Windows)
              mkdir -p "dist/ZyDeck Connect"
              cp "build/Release/ZyDeck Connect.exe" "dist/ZyDeck Connect/"
              windeployqt --release --no-translations "dist/ZyDeck Connect/ZyDeck Connect.exe"
              cp tools-bin/yt-dlp.exe "dist/ZyDeck Connect/" ;;
            Linux)
              cp build/zydeck-connect tools-bin/yt-dlp dist/ ;;
          esac
          cp MIDI.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tools/zydeck-connect/dist/
