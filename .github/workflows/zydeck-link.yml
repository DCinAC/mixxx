# ZyDeck Link (tools/zydeck-link): built for Windows, macOS and Linux whenever it changes (or by hand from the
# Actions tab). Each build is attached to the run as an artifact.
name: ZyDeck Link

on:
  push:
    branches:
      - android-companion
    paths:
      - tools/zydeck-link/**
      - res/controllers/Zydek-Tablet.*
      - .github/workflows/zydeck-link.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: ZyDeck-Link-Windows
            args: --windowed --onefile --name "ZyDeck Link"
          - os: macos-latest
            name: ZyDeck-Link-macOS
            args: --windowed --name "ZyDeck Link" --osx-bundle-identifier org.zydeck.link
          - os: ubuntu-latest
            name: ZyDeck-Link-Linux
            args: --onefile --name zydeck-link
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/zydeck-link
            res/controllers/Zydek-Tablet.midi.xml
            res/controllers/Zydek-Tablet.script.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux needs ALSA's headers for python-rtmidi, and Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev python3-tk
      - name: Build
        shell: bash
        working-directory: tools/zydeck-link
        run: |
          python -m pip install python-rtmidi pyinstaller
          python zydeck_link.py --write-mapping mapping
          pyinstaller --noconfirm ${{ matrix.args }} --add-data mapping:mapping zydeck_link.py
          cp MIDI.md dist/
          if [ "$RUNNER_OS" = macOS ]; then (cd dist && ditto -c -k --keepParent "ZyDeck Link.app" ZyDeck-Link-macOS.zip && rm -rf "ZyDeck Link.app" "ZyDeck Link"); fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tools/zydeck-link/dist/
